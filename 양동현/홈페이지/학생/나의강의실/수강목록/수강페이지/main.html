<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 강의 팝업</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="popup">
    <div class="logo">MyLMS</div>

    <div class="video-container" id="videoContainer">
        <div class="video" id="video">영상 재생 영역</div>
    </div>

    <div class="content" id="chat">
        <div class="content-toggle" id="chatToggle">[-]</div>
        <div class="message">안녕하세요!</div>
        <div class="message">오늘 강의 시작합니다.</div>
        <div class="message">질문은 채팅으로 남겨주세요.</div>
    </div>

    <div class="info">
        <p><strong>강사:</strong> 홍길동</p>
        <p><strong>강의 제목:</strong> 자바스크립트 기초</p>
        <p><strong>기간:</strong> 2025-09-01 ~ 2025-12-31</p>
    </div>

    <div class="controls">
        <button id="dnd">방해 금지 모드</button>
        <input type="text" id="chatInput" placeholder="채팅 입력">
        <button id="sendBtn">전송</button>
        <button id="fullscreenBtn">영상 전체화면</button>
    </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
