<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 후기 등록 | MyLMS</title>
    <style>
        /* ===== 전체 폰트 & 배경 ===== */
        body {
            margin: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f6fa; /* 홈페이지 배경 색상 */
            color: #333;
        }

        /* ===== 중앙 컨테이너 카드 ===== */
        .container {
            max-width: 700px;
            margin: 60px auto;
            background-color: #ffffff; /* 홈페이지 카드 색상 */
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); /* 홈페이지 그림자 느낌 */
        }

        h2 {
            margin-top: 0;
            font-size: 1.8em;
            font-weight: 700;
            color: #1f2937; /* 홈페이지 메인 텍스트 색상 */
            margin-bottom: 30px;
        }

        /* ===== 폼 그룹 ===== */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #374151; /* 홈페이지 라벨 색상 */
        }

        input[readonly], textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db; /* 홈페이지 입력 박스 테두리 색상 */
            border-radius: 8px;
            font-size: 1em;
            color: #111827;
            background-color: #f9fafb;
        }

        input[readonly] {
            background-color: #e5e7eb;
        }

        textarea {
            min-height: 220px;
            resize: vertical;
        }

        /* ===== 버튼 ===== */
        button {
            display: block;
            margin-left: auto;
            padding: 14px 28px;
            background-color: #f59e0b; /* 홈페이지 버튼 주황색 */
            border: none;
            border-radius: 8px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>강의 후기 등록</h2>

    <div class="form-group">
        <input type="text" value="강의 후기" readonly>
    </div>

    <div class="form-group">
        <label>제목</label>
        <input type="text" value="해당 강의명" readonly>
    </div>

    <div class="form-group">
        <label>내용</label>
        <textarea placeholder="내용을 작성하세요"></textarea>
    </div>

    <button type="submit">등록</button>
</div>

</body>
</html>
