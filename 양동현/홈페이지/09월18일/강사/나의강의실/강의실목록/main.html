<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>강의실 목록</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="course-container">
    <div class="course-header">
        <div class="filters">
            <select id="statusFilter">
                <option value="전체">전체</option>
                <option value="정상">정상</option>
                <option value="중지">중지</option>
            </select>
        </div>
        <div class="search">
            <input id="searchBox" placeholder="검색어 입력" type="text">
            <button id="searchBtn">검색</button>
        </div>
    </div>

    <div class="course-grid" id="courseGrid"></div>
</div>

<!-- 학생 모달 -->
<div id="studentModal">
    <div class="modal-content">
        <h3 id="modalTitle">학생 목록</h3>
        <ul id="studentList"></ul>
        <div id="studentPagination"></div>
        <button class="closeModal" onclick="studentModal.style.display='none'">X</button>
    </div>
</div>

<!-- 강의 수정 모달 -->
<div id="editModal">
    <div class="modal-content">
        <h3>강의 수정</h3>
        <form class="edit-form" id="editForm">
            <label>강의명</label>
            <input id="editName" type="text">
            <label>기간</label>
            <input id="editPeriod" type="text">
            <label>유형</label>
            <select id="editType">
                <option value="VOD">VOD</option>
                <option value="개인강의">개인강의</option>
                <option value="다수강의">다수강의</option>
            </select>
            <label>상태</label>
            <select id="editStatus">
                <option value="정상">정상</option>
                <option value="중지">중지</option>
            </select>
            <button type="submit">수정 완료</button>
        </form>
        <button class="closeModal" onclick="editModal.style.display='none'">X</button>
    </div>
</div>

<script src="js/main.js"> </script>
</body>
</html>
