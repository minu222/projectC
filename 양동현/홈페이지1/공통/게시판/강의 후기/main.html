<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의후기 | MyLMS</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="board-container">
    <div class="board-header">
        <div class="board-title">강의후기</div>
        <div class="filters search">
            <input type="text" placeholder="검색어 입력">
            <select>
                <option value="작성자">작성자 이름</option>
                <option value="강사">강사</option>
                <option value="회원">회원</option>
            </select>
            <button>검색</button>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th style="width:8%;">NO</th>
            <th style="width:60%;">제목</th>
            <th style="width:16%;">작성일</th>
            <th style="width:16%;">작성자</th>
        </tr>
        </thead>
        <tbody>
        <tr><td>1</td><td>리스트</td><td>2025-09-16</td><td>홍길동</td></tr>
        <tr><td>2</td><td>리스트</td><td>2025-09-16</td><td>김철수</td></tr>
        <tr><td>3</td><td>리스트</td><td>2025-09-16</td><td>이영희</td></tr>
        <tr><td>4</td><td>리스트</td><td>2025-09-16</td><td>박민수</td></tr>
        <tr><td>5</td><td>리스트</td><td>2025-09-16</td><td>최지훈</td></tr>
        </tbody>
    </table>

    <button class="write-button">글쓰기</button>

    <div class="pagination">
        <button>&laquo;</button>
        <button class="active">1</button>
        <button>2</button>
        <button>3</button>
        <button>&raquo;</button>
    </div>
</div>

</body>
</html>
