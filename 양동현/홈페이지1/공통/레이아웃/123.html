<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MyLMS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/common.css">
    <style>

    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <div class="logo">MyLMS</div>
        <nav class="nav-center">
            <ul>
                <li><a class="header-category" data-category="course" href="#">교육과정</a></li>
                <li><a class="header-category" data-category="info" href="#">정보센터</a></li>
                <li><a class="header-category" data-category="board" href="#">게시판</a></li>
                <li><a class="header-category" data-category="myclass" href="#">나의 강의실</a></li>
            </ul>
        </nav>
        <div class="auth-links" id="authLinks">
            <a href="#" id="loginBtn">로그인</a> |
            <a href="#" id="signupBtn">회원가입</a>
            <div class="notification" id="notificationBtn" style="display:none;">
                🔔<span class="badge">3</span>
                <ul class="dropdown">
                    <li><a href="#">새 쪽지: 안녕하세요!</a></li>
                    <li><a href="#">새 이메일: 수강 안내</a></li>
                    <li><a href="#">모두 보기</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>

<div class="wrapper">
    <aside class="side-menu" id="sideMenu"></aside>
    <main id="mainContent">
        <h2>환영합니다</h2>
        <p>여기에 메인 콘텐츠가 표시됩니다.</p>
    </main>
</div>

<footer>
    <div class="footer-top">
        <div class="footer-links">
            <a href="#">회사소개</a>
            <a href="#">인재채용</a>
            <a href="#">강사 모집</a>
            <a href="#">운영정책</a>
            <a href="#">이용약관</a>
            <a href="#">개인정보처리방침</a>
            <a href="#">고객센터</a>
        </div>
    </div>
    <div class="awards">
        <div class="badge">✅ 품질 인증</div>
        <div class="badge">🔒 정보보호 인증</div>
        <div class="badge">🎓 평생교육 시설 인증</div>
        <div class="badge">⭐ 고객만족 대상</div>
    </div>
    <div class="copyright">
        <p>© 2025 MyLMS. All rights reserved.</p>
        <p>문의: support@mylms.com | 고객센터 1234-5678</p>
    </div>
</footer>

<script>
    const userType = "student"; // null=비회원, "student", "teacher"
    const sideMenu = document.getElementById("sideMenu");

    const sidebarData = {
        course: [
            {title: "교육 강의", items: [{text: "강의목록", href: "#"}]},
            {title: "과정목록", items: [{text: "이과", href: "#"}, {text: "문과", href: "#"}, {text: "예체능", href: "#"}]}
        ],
        info: [
            {title: "정보센터",
                items: [{text: "강사소개", href: "#"}, {text: "도서추천", href: "#"}, {text: "시험 일정", href: "#"}, {
                    text: "자료실",
                    href: "#"
                }]
            }
        ],
        board: [
            {title: "게시판",
                items: [{text: "공지사항", href: "#"}, {text: "FAQ", href: "#"}, {
                    text: "자유게시판",
                    href: "#"
                }, {text: "문의 게시판", href: "#"}, {text: "수강후기", href: "#"}, {text: "강사후기", href: "#"}]
            }
        ],
        myclass: []
    };

    if (userType === null || userType === "student") {
        sidebarData.myclass = [
            {title: "나의 강의실",
                items: [{text: "수강목록", href: "#"}, {text: "시험목록", href: "#"}, {
                    text: "결제내역",
                    href: "#"
                }, {text: "이메일/쪽지 정보", href: "#"}, {text: "나의 게시판", href: "#"}, {text: "회원정보 수정", href: "#"}]
            }
        ];
    } else if (userType === "teacher") {
        sidebarData.myclass = [
            {title: "강사 관리",
                items: [{text: "강의실 목록", href: "#"}, {text: "강의실 등록", href: "#"}, {
                    text: "결제내역",
                    href: "#"
                }, {text: "이메일/쪽지 정보", href: "#"}, {text: "나의 게시판", href: "#"}, {text: "회원정보 수정", href: "#"}]
            }
        ];
    }

    function renderSidebar(category) {
        sideMenu.innerHTML = "";
        if (!sidebarData[category]) return;
        sidebarData[category].forEach(sec => {
            const ul = document.createElement("ul");
            if (sec.title) {
                const h3 = document.createElement("h3");
                h3.textContent = sec.title;
                ul.appendChild(h3);
            }
            sec.items.forEach(item => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = item.href;
                a.textContent = item.text;
                li.appendChild(a);
                ul.appendChild(li);
            });
            sideMenu.appendChild(ul);
        });
        sideMenu.classList.add("active"); // 사이드바 표시
    }

    document.querySelectorAll(".header-category").forEach(link => {
        link.addEventListener("click", e => {
            e.preventDefault();
            const category = link.dataset.category;
            renderSidebar(category);
            document.getElementById("mainContent").innerHTML = `<h2>${category} 페이지</h2><p>콘텐츠 영역</p>`;
        });
    });

    const notificationBtn = document.getElementById("notificationBtn");
    if (notificationBtn) {
        notificationBtn.addEventListener("click", e => {
            e.stopPropagation();
            notificationBtn.classList.toggle("active");
        });
    }
    document.addEventListener("click", () => {
        if (notificationBtn) notificationBtn.classList.remove("active");
    });
</script>

</body>
</html>
