<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유게시판 글 내용 | MyLMS</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="board-container">
    <div class="board-header">
        <div class="board-title">글 제목 예시</div>
    </div>

    <div class="post-info">
        작성자: 홍길동 | 작성일: 2025-09-16
    </div>

    <div class="post-content">
        <p>
            여기는 게시글 내용이 표시되는 영역입니다. HTML 태그를 활용하여 단락, 이미지, 링크 등 다양한 콘텐츠를 보여줄 수 있습니다.
        </p>
        <p>
            실제로는 게시판 목록에서 글을 클릭하면 글 ID를 기반으로 백엔드에서 데이터를 받아와 이 영역에 표시하게 됩니다.
        </p>
    </div>

    <a href="freeboard.html" class="back-btn">목록으로 돌아가기</a>

    <!-- 댓글 영역 -->
    <div class="comments-section">
        <h3>댓글</h3>

        <div class="comment-form">
            <textarea id="comment-input" rows="4" placeholder="댓글을 입력하세요..."></textarea>
            <button onclick="addComment()">댓글 작성</button>
        </div>

        <div class="comment-list" id="comment-list">
            <div class="comment-item">
                <div class="author">김철수</div>
                <div class="date">2025-09-16 14:30</div>
                <div class="content">좋은 글 감사합니다!</div>
                <div class="comment-item comment-reply">
                    <div class="author">홍길동</div>
                    <div class="date">2025-09-16 15:00</div>
                    <div class="content">댓글 감사합니다 ^^</div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
