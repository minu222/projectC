<!-- fragments/edit_member.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 정보 수정 | MyLMS</title>
    <link rel="stylesheet" th:href="@{/css/my classroom/Edit member information.css}">
</head>
<body>
<div th:fragment="editMemberFragment">
    <main class="main-content">
        <div class="container">
            <div class="header">
                <h1>회원 정보 수정</h1>
                <p>프로필 정보를 업데이트하세요</p>
            </div>

            <div class="content">
                <div class="profile-section">
                    <div class="profile-pic-wrapper">
                        <div class="profile-pic" onclick="document.getElementById('profileInput').click()">
                            <span class="plus-icon" id="plusIcon">+</span>
                            <img id="profileImage" src="#" alt="프로필 이미지" style="display: none;">
                        </div>
                        <input type="file" id="profileInput" accept="image/*" onchange="previewImage(event)" style="display:none;">
                    </div>
                    <div class="profile-info">
                        <h3 id="displayName">Hong Gil Dong</h3>
                        <p id="displayEmail">hong@mail.co.kr</p>
                    </div>
                </div>

                <form class="form-grid">
                    <div class="input-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" class="input-field" value="hong123" readonly>
                    </div>

                    <div class="row">
                        <div class="input-group">
                            <label for="password">새 비밀번호</label>
                            <input type="password" id="password" class="input-field" placeholder="새 비밀번호" readonly>
                        </div>
                        <div class="input-group">
                            <label for="confirmPassword">비밀번호 확인</label>
                            <input type="password" id="confirmPassword" class="input-field" placeholder="비밀번호 확인" readonly>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" class="input-field" value="Hong Gil Dong" readonly>
                    </div>

                    <div class="input-group">
                        <label for="phone">핸드폰 번호</label>
                        <input type="text" id="phone" class="input-field" placeholder="010-1234-5678" readonly>
                    </div>

                    <div class="input-group">
                        <label for="address">주소</label>
                        <input type="text" id="address" class="input-field" readonly>
                    </div>

                    <div class="input-group">
                        <label for="detailAddress">상세주소</label>
                        <input type="text" id="detailAddress" class="input-field" readonly>
                    </div>

                    <div class="input-group">
                        <label for="email">이메일</label>
                        <input type="email" id="email" class="input-field" value="hong@mail.co.kr" readonly>
                    </div>

                    <div class="checkbox-group" id="checkboxGroup">
                        <h4>수신 동의 설정</h4>
                        <div class="checkbox-item">
                            <input type="checkbox" id="emailAgree" disabled>
                            <span class="checkmark"></span>
                            <label for="emailAgree">이메일 수신 동의</label>

                            <input type="checkbox" id="messageAgree" disabled>
                            <span class="checkmark"></span>
                            <label for="messageAgree">쪽지 수신 동의</label>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-primary" id="editBtn" onclick="enableEdit()">수정하기</button>
                        <div>
                            <button type="button" class="btn btn-primary" id="saveBtn" onclick="saveProfile()">저장하기</button>
                            <button type="button" class="btn btn-secondary" onclick="window.close()">닫기</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/my classroom/Edit member information.js}"></script>
</body>
</html>
