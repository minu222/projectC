<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<aside th:fragment="sidebar" class="side-menu">
    <ul th:each="section : ${sidebarData}">
        <h3 th:text="${section.title}"></h3>
        <li th:each="item : ${section.items}">
            <a th:href="@{${item.href}}" th:text="${item.text}"></a>
        </li>
    </ul>
</aside>

</body>
</html>
