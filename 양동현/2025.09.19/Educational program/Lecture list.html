<!-- 강의 목록 fragment -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의 목록</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:fragment="lectureList" class="main-content">
    <h2>강의 목록</h2>

    <!-- 탭 버튼 -->
    <div class="tabs">
        <button class="active" onclick="changeTab('personal')">실시간 개인강의</button>
        <button onclick="changeTab('multi')">실시간 다수강의</button>
        <button onclick="changeTab('vod')">VOD 강의</button>
    </div>

    <!-- 검색/정렬 -->
    <div class="controls">
        <input id="searchInput" placeholder="강의명 또는 강사명 검색" type="text">
        <select id="sortFilter">
            <option value="">정렬 선택</option>
            <option value="latest">최신순</option>
            <option value="oldest">오래된순</option>
            <option value="popular">인기순</option>
        </select>
        <button onclick="showList()">리스트형 보기</button>
        <button onclick="showCard()">카드형 보기</button>
    </div>

    <section class="list-section" id="listSection"></section>
    <section class="card-section" id="cardSection" style="display:none;"></section>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
