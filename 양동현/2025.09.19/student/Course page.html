<!-- fragments/live_course_popup.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 강의 팝업</title>
    <link rel="stylesheet" th:href="@{/css/Course page.css}">
</head>
<body>
<div th:fragment="liveCoursePopupFragment(course, messages)">
    <div class="popup">
        <div class="logo">MyLMS</div>

        <div class="video-container" id="videoContainer">
            <div class="video" id="video" th:text="${course.videoPlaceholder}">영상 재생 영역</div>
        </div>

        <div class="content" id="chat">
            <div class="content-toggle" id="chatToggle">[-]</div>
            <div class="message" th:each="msg : ${messages}" th:text="${msg}">안녕하세요!</div>
        </div>

        <div class="info">
            <p><strong>강사:</strong> <span th:text="${course.instructor}">홍길동</span></p>
            <p><strong>강의 제목:</strong> <span th:text="${course.title}">자바스크립트 기초</span></p>
            <p><strong>기간:</strong> <span th:text="${course.startDate} + ' ~ ' + ${course.endDate}">2025-09-01 ~ 2025-12-31</span></p>
        </div>

        <div class="controls">
            <button id="dnd">방해 금지 모드</button>
            <input type="text" id="chatInput" placeholder="채팅 입력">
            <button id="sendBtn">전송</button>
            <button id="fullscreenBtn">영상 전체화면</button>
        </div>
    </div>
</div>
</body>
</html>
