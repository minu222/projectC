<!-- fragments/exam_page.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 페이지</title>
    <link rel="stylesheet" th:href="@{/css/test page.css}">
</head>
<body>
<div th:fragment="examPageFragment(examQuestions, pageNumbers)">
    <div class="container">
        <form th:action="@{/exam/submit}" method="post">
            <div class="grid">
                <!-- 문제 반복 영역 -->
                <div class="problem" th:each="q, iterStat : ${examQuestions}">
                    <!-- 문제 번호 -->
                    <h3 th:text="'문제 ' + ${iterStat.index + 1}"></h3>

                    <!-- 문제 내용 -->
                    <p th:text="${q.content}"></p>

                    <!-- 답안 입력창 -->
                    <input type="text" th:name="'answers[' + ${q.id} + ']'" placeholder="답 작성">
                </div>
            </div>

            <div class="pagination-submit">
                <!-- 페이지네이션 -->
                <div class="pagination">
                    <span th:each="page : ${pageNumbers}" th:text="${page}"></span>
                </div>

                <!-- 제출 버튼 -->
                <button type="submit" class="submit-btn">제출하기</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
