<!-- fragments/classroom_list.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의실 목록</title>
    <link rel="stylesheet" th:href="@{/css/Classroom list.css}">
</head>
<body>
<div th:fragment="classroomListFragment(classrooms)">
    <div class="course-container">
        <div class="course-header">
            <div class="filters">
                <select id="statusFilter">
                    <option value="전체">전체</option>
                    <option value="정상">정상</option>
                    <option value="중지">중지</option>
                </select>
            </div>
            <div class="search">
                <input id="searchBox" placeholder="검색어 입력" type="text">
                <button id="searchBtn">검색</button>
            </div>
        </div>

        <div class="course-grid" id="courseGrid">
            <div class="course-item" th:each="course : ${classrooms}">
                <h3 th:text="${course.name}">강의명</h3>
                <p th:text="'기간: ' + ${course.period}">기간</p>
                <p th:text="'유형: ' + ${course.type}">유형</p>
                <p th:text="'상태: ' + ${course.status}">상태</p>
                <button type="button" th:onclick="'showStudents(' + ${course.id} + ')'">학생보기</button>
                <button type="button" th:onclick="'showEditModal(' + ${course.id} + ')'">수정</button>
            </div>
        </div>
    </div>

    <!-- 학생 모달 -->
    <div id="studentModal">
        <div class="modal-content">
            <h3 id="modalTitle">학생 목록</h3>
            <ul id="studentList"></ul>
            <div id="studentPagination"></div>
            <button class="closeModal" onclick="studentModal.style.display='none'">X</button>
        </div>
    </div>

    <!-- 강의 수정 모달 -->
    <div id="editModal">
        <div class="modal-content">
            <h3>강의 수정</h3>
            <form class="edit-form" id="editForm">
                <label>강의명</label>
                <input id="editName" type="text">
                <label>기간</label>
                <input id="editPeriod" type="text">
                <label>유형</label>
                <select id="editType">
                    <option value="VOD">VOD</option>
                    <option value="개인강의">개인강의</option>
                    <option value="다수강의">다수강의</option>
                </select>
                <label>상태</label>
                <select id="editStatus">
                    <option value="정상">정상</option>
                    <option value="중지">중지</option>
                </select>
                <button type="submit">수정 완료</button>
            </form>
            <button class="closeModal" onclick="editModal.style.display='none'">X</button>
        </div>
    </div>
</div>

<script th:src="@{/js/Classroom list.js}"></script>
</body>
</html>
