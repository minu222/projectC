<!-- fragments/test_list.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험목록 | MyLMS</title>
    <link rel="stylesheet" th:href="@{/css/Test list.css}">
</head>
<body>
<div th:fragment="testListFragment(tests)">
    <div class="board-container">
        <div class="board-header">
            <div class="board-title">시험목록</div>
            <div class="filters search">
                <input type="text" placeholder="시험명 검색">
                <select>
                    <option value="시험명">시험명</option>
                    <option value="점수">점수</option>
                </select>
                <button>검색</button>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th style="width:8%;">NO</th>
                <th style="width:40%;">제목</th>
                <th style="width:20%;">시험응시일</th>
                <th style="width:12%;">점수</th>
                <th style="width:20%;">파일받기</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="test : ${tests}">
                <td th:text="${test.no}">1</td>
                <td th:text="${test.title}">HTML 기초 시험</td>
                <td th:text="${test.date}">2025-09-16</td>
                <td th:text="${test.score}">95점</td>
                <td>
                    <a th:href="@{${test.file}}" download>
                        <button class="download-button">다운로드</button>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <button th:each="pageNum : ${pages}" th:text="${pageNum}" th:classappend="${pageNum == currentPage} ? 'active'"></button>
        </div>
    </div>
</div>
</body>
</html>
