<!-- fragments/course_list.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수강 목록 | MyLMS</title>
    <link rel="stylesheet" th:href="@{/css/Course list.css}">
</head>
<body>
<div th:fragment="courseListFragment(courses, page, totalPages, filterType, searchKeyword)">
    <div class="course-container">
        <h1>수강 목록</h1>

        <!-- 필터 & 검색 -->
        <div class="course-header">
            <div class="filters">
                <select id="filter" th:value="${filterType}">
                    <option value="all">전체</option>
                    <option value="purchase">구매날짜순</option>
                    <option value="recent">최근 수강순</option>
                    <option value="progress">진행중</option>
                    <option value="completed">종료</option>
                </select>
            </div>
            <div class="search">
                <input type="text" id="searchInput" placeholder="강의명 또는 강사명 검색" th:value="${searchKeyword}">
                <button id="searchBtn">검색</button>
            </div>
        </div>

        <!-- 강의 목록 -->
        <div id="courseGrid" class="course-grid">
            <div class="course-item" th:each="course : ${courses}">
                <div class="course-title" th:text="${course.title}">강의명</div>
                <div class="course-instructor" th:text="${course.instructor}">강사명</div>
                <div class="course-status" th:text="${course.status}">진행중</div>
            </div>
        </div>

        <!-- 페이지네이션 -->
        <div id="pagination" class="pagination">
            <button th:disabled="${page == 1}" th:onclick="'location.href=\'?page=' + ${page-1} + '\''">&laquo;</button>
            <button th:each="i : ${#numbers.sequence(1,totalPages)}"
                    th:classappend="${i == page} ? 'active'"
                    th:text="${i}"
                    th:onclick="'location.href=\'?page=' + ${i} + '\''">1</button>
            <button th:disabled="${page == totalPages}" th:onclick="'location.href=\'?page=' + ${page+1} + '\''">&raquo;</button>
        </div>
    </div>
</div>
</body>
</html>
