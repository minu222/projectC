<!-- fragments/email_message.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일/쪽지 | MyLMS</title>
    <link rel="stylesheet" th:href="@{/css/Email message information.css}">
    <link rel="stylesheet" th:href="@{/NoteModal/noteModal.css}">
    <link rel="stylesheet" th:href="@{/EmailModal/emailModal.css}">
</head>
<body>
<div th:fragment="emailMessageFragment">
    <div class="board-container">
        <div class="board-header">
            <div class="board-title">내 쪽지 / 이메일</div>
            <div class="top-buttons">
                <button id="openEmailModal">이메일 보내기</button>
                <button id="openNoteModal">쪽지 보내기</button>
                <button onclick="deleteSelected()">선택 삭제</button>
            </div>
        </div>

        <div class="tabs">
            <button class="active" onclick="filterTab('전체')">전체</button>
            <button onclick="filterTab('받은메일')">받은 메일</button>
            <button onclick="filterTab('보낸메일')">보낸 메일</button>
            <button onclick="filterTab('받은쪽지')">받은 쪽지</button>
            <button onclick="filterTab('보낸쪽지')">보낸 쪽지</button>
        </div>

        <div class="search-container">
            <input id="searchInput" placeholder="제목 또는 보낸사람 검색" type="text">
            <select id="roleFilter">
                <option value="">전체</option>
                <option value="강사">강사</option>
                <option value="학생">학생</option>
                <option value="관리자">관리자</option>
            </select>
            <button onclick="filterTable()">검색</button>
        </div>

        <table id="messageTable">
            <thead>
            <tr>
                <th>NO</th>
                <th>제목</th>
                <th>보낸사람</th>
                <th>수신일</th>
                <th>유형</th>
                <th>상태</th>
                <th><input id="selectAll" onclick="toggleAll(this)" type="checkbox"> 체크</th>
                <th>지우기</th>
            </tr>
            </thead>
            <tbody>
            <tr data-direction="받은메일" data-role="강사" data-type="이메일">
                <td>1</td>
                <td>테스트용</td>
                <td>강사1</td>
                <td>2025-09-17</td>
                <td>이메일</td>
                <td>받음</td>
                <td><input type="checkbox"></td>
                <td>
                    <button class="delete-button" onclick="deleteRow(this)">삭제</button>
                </td>
            </tr>
            <tr data-direction="보낸쪽지" data-role="학생" data-type="쪽지">
                <td>2</td>
                <td>테스트2</td>
                <td>학생1</td>
                <td>2025-09-16</td>
                <td>쪽지</td>
                <td>보냄</td>
                <td><input type="checkbox"></td>
                <td>
                    <button class="delete-button" onclick="deleteRow(this)">삭제</button>
                </td>
            </tr>
            <tr data-direction="보낸메일" data-role="관리자" data-type="이메일">
                <td>3</td>
                <td>관리자공지</td>
                <td>관리자</td>
                <td>2025-09-15</td>
                <td>이메일</td>
                <td>보냄</td>
                <td><input type="checkbox"></td>
                <td>
                    <button class="delete-button" onclick="deleteRow(this)">삭제</button>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination">
            <button>&laquo;</button>
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
            <button>&raquo;</button>
        </div>
    </div>

    <!-- JS 불러오기 -->
    <script th:src="@{/EmailModal/EmailModal.js}" defer></script>
    <script th:src="@{/NoteModal/noteModal.js}" defer></script>
    <script th:src="@{/js/Email message information.js}" defer></script>
</div>
</body>
</html>
