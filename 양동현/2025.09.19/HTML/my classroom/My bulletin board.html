<!-- fragments/board_list.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:fragment="boardListFragment">
    <!-- 게시판 메인 바디 -->
    <main class="board-container">
        <!-- 헤더: 제목 + 필터 + 선택 삭제 -->
        <div class="board-header">
            <div class="board-title">게시판 목록</div>
            <div class="filters search">
                <button class="filter-btn active" data-filter="all">전체</button>
                <button class="filter-btn" data-filter="newest">최신순</button>
                <button class="filter-btn" data-filter="oldest">오래된순</button>
                <button class="filter-btn" data-filter="inquiry">문의게시판</button>
                <button class="filter-btn" data-filter="free">자유게시판</button>
                <button id="deleteSelectedBtn" class="download-button" style="background:#e74c3c;">선택 삭제</button>
            </div>
        </div>

        <!-- 게시판 테이블 -->
        <table class="board-table">
            <thead>
            <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>No</th>
                <th>제목</th>
                <th>작성일</th>
                <th>유형</th>
            </tr>
            </thead>
            <tbody id="board-list">
            <tr data-type="inquiry">
                <td><input type="checkbox" class="row-checkbox"></td>
                <td>1</td>
                <td class="board-title-link">문의 예제 글</td>
                <td>2025-09-17</td>
                <td>문의게시판</td>
            </tr>
            <tr data-type="free">
                <td><input type="checkbox" class="row-checkbox"></td>
                <td>2</td>
                <td class="board-title-link">자유 글 예제</td>
                <td>2025-09-16</td>
                <td>자유게시판</td>
            </tr>
            <tr data-type="inquiry">
                <td><input type="checkbox" class="row-checkbox"></td>
                <td>3</td>
                <td class="board-title-link">문의 글 2</td>
                <td>2025-09-15</td>
                <td>문의게시판</td>
            </tr>
            </tbody>
        </table>

        <!-- 페이지네이션 -->
        <div class="pagination">
            <button class="active">1</button>
            <button>2</button>
            <button>3</button>
        </div>
    </main>

    <!-- 모달 -->
    <div class="modal-overlay" id="boardModal" style="display:none;">
        <div class="modal-container">
            <h3 id="modalTitle">게시글 제목</h3>
            <textarea id="modalContent" rows="6" style="width:100%; padding:10px; font-size:1rem;"></textarea>
            <div style="margin-top:10px; text-align:right;">
                <button id="saveModalBtn" class="download-button">저장</button>
                <button id="closeModalBtn" class="download-button" style="background:#aaa;">닫기</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main.js}"></script>
</div>
</body>
</html>
