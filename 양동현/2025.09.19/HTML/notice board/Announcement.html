<!-- fragments/notice_event.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 / 이벤트 목록</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:fragment="noticeEventFragment">
    <div class="container">
        <h2>공지사항 / 이벤트</h2>
        <table id="noticeTable">
            <thead>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>등록일</th>
            </tr>
            </thead>
            <tbody>
            <!-- JS 또는 서버에서 Thymeleaf로 목록 삽입 가능 -->
            <tr th:each="notice : ${notices}">
                <td th:text="${notice.id}">1</td>
                <td th:text="${notice.title}">공지 제목</td>
                <td th:text="${notice.regDate}">2025-09-19</td>
            </tr>
            </tbody>
        </table>
        <div class="pagination" id="pagination"></div>
    </div>
</div>
</body>
</html>
