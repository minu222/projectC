<!-- fragments/freeboard.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유게시판 | MyLMS</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:fragment="freeboardFragment">
    <div class="board-container">
        <div class="board-header">
            <div class="board-title">자유게시판</div>
            <div class="filters search">
                <input type="text" placeholder="검색어 입력" th:value="${searchKeyword}">
                <select>
                    <option value="작성자" th:selected="${searchType == '작성자'}">작성자 이름</option>
                    <option value="강사" th:selected="${searchType == '강사'}">강사</option>
                    <option value="회원" th:selected="${searchType == '회원'}">회원</option>
                </select>
                <button type="submit">검색</button>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th style="width:8%;">NO</th>
                <th style="width:50%;">제목</th>
                <th style="width:16%;">작성일</th>
                <th style="width:16%;">작성자</th>
                <th style="width:10%;">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}">1</td>
                <td>
                    <a th:href="@{/freeboard/{id}(id=${post.id})}" th:text="${post.title}">리스트</a>
                </td>
                <td th:text="${post.date}">2025-09-16</td>
                <td th:text="${post.author}">홍길동</td>
                <td>
                    <span class="status" th:classappend="${post.role}" th:text="${post.roleName}">강사</span>
                </td>
            </tr>
            </tbody>
        </table>

        <button class="write-button" th:onclick="'location.href=\'/freeboard/write\''">글쓰기</button>

        <div class="pagination">
            <button th:disabled="${page == 1}" th:onclick="'location.href=\'?page=' + ${page-1} + '\''">&laquo;</button>
            <button th:each="i : ${#numbers.sequence(1,totalPages)}"
                    th:classappend="${i == page} ? 'active'"
                    th:text="${i}"
                    th:onclick="'location.href=\'?page=' + ${i} + '\''">1</button>
            <button th:disabled="${page == totalPages}" th:onclick="'location.href=\'?page=' + ${page+1} + '\''">&raquo;</button>
        </div>
    </div>
</div>
</body>
</html>
