<!-- fragments/post_detail.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>강의후기 상세</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:fragment="postDetailFragment">
    <div class="board-container">
        <div class="board-header">
            <div class="board-title" id="title" th:text="${post.title}">글 제목 예시</div>
        </div>

        <div class="post-info" id="post-info">
            작성자: <span th:text="${post.author}">홍길동</span> | 작성일: <span th:text="${post.date}">2025-09-16</span>
        </div>

        <div class="post-content" id="content" th:utext="${post.content}">
            <p>
                여기는 게시글 내용이 표시되는 영역입니다. HTML 태그를 활용하여 단락, 이미지, 링크 등 다양한 콘텐츠를 보여줄 수 있습니다.
            </p>
            <p>
                실제로는 게시판 목록에서 글을 클릭하면 글 ID를 기반으로 백엔드에서 데이터를 받아와 이 영역에 표시하게 됩니다.
            </p>
        </div>

        <a th:href="@{/freeboard}" class="back-btn">목록으로 돌아가기</a>

        <!-- 댓글 영역 -->
        <div class="comments-section" id="comments-section">
            <h3>댓글</h3>

            <div class="comment-form">
                <textarea id="comment-input" rows="4" placeholder="댓글을 입력하세요..."></textarea>
                <button type="button" onclick="addComment()">댓글 작성</button>
            </div>

            <div class="comment-list" id="comment-list">
                <div class="comment-item" th:each="comment : ${comments}">
                    <div class="author" th:text="${comment.author}">김철수</div>
                    <div class="date" th:text="${comment.date}">2025-09-16 14:30</div>
                    <div class="content" th:text="${comment.content}">좋은 글 감사합니다!</div>

                    <div class="comment-item comment-reply" th:each="reply : ${comment.replies}">
                        <div class="author" th:text="${reply.author}">홍길동</div>
                        <div class="date" th:text="${reply.date}">2025-09-16 15:00</div>
                        <div class="content" th:text="${reply.content}">댓글 감사합니다 ^^</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
