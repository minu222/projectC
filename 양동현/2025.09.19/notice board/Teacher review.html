<!-- fragments/teacher_review_board.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강사후기 | MyLMS</title>
    <link rel="stylesheet" th:href="@{/css/Teacher review.css}">
</head>
<body>
<div th:fragment="teacherReviewBoardFragment(reviews, page, totalPages, searchKeyword, filterType)">
    <div class="board-container">
        <div class="board-header">
            <div class="board-title">강사후기</div>
            <div class="filters search">
                <input type="text" placeholder="검색어 입력" th:value="${searchKeyword}">
                <select th:value="${filterType}">
                    <option value="작성자">작성자 이름</option>
                    <option value="강사">강사</option>
                    <option value="회원">회원</option>
                </select>
                <button type="submit">검색</button>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th style="width:8%;">NO</th>
                <th style="width:60%;">제목</th>
                <th style="width:16%;">작성일</th>
                <th style="width:16%;">작성자</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${review.id}">1</td>
                <td>
                    <a th:href="@{/teacherReview/{id}(id=${review.id})}" th:text="${review.title}">리스트</a>
                </td>
                <td th:text="${review.date}">2025-09-16</td>
                <td th:text="${review.author}">홍길동</td>
            </tr>
            </tbody>
        </table>

        <button class="write-button" th:onclick="'location.href=\'/teacherReview/write\''">글쓰기</button>

        <div class="pagination">
            <button th:disabled="${page == 1}" th:onclick="'location.href=\'?page=' + ${page-1} + '\''">&laquo;</button>
            <button th:each="i : ${#numbers.sequence(1,totalPages)}"
                    th:classappend="${i == page} ? 'active'"
                    th:text="${i}"
                    th:onclick="'location.href=\'?page=' + ${i} + '\''">1</button>
            <button th:disabled="${page == totalPages}" th:onclick="'location.href=\'?page=' + ${page+1} + '\''">&raquo;</button>
        </div>
    </div>
</div>
</body>
</html>
