<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>수업 자료 관리</title>
  </head>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* =========================
   수업 자료 관리 - Dark Neon Blue (Fixed)
   HTML 수정 금지 / CSS만 적용
   ========================= */

    /* Reset & Base */

    /* Layout (비반응형 고정 패딩) */

    /* Title */

    /* === 검색 박스 === */
    .search-box.materials-search {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 18px;
      white-space: nowrap;
    }
    .search-box.materials-search input[type="text"] {
      width: 260px;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box.materials-search input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 버튼 (조회/업로드) */
    .btn-search,
    .btn-submit {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease,
        border-color 0.15s ease;
      border: 1px solid rgba(61, 122, 255, 0.4);
      color: #fff;
    }
    .btn-search {
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(120, 140, 200, 0.6),
          transparent 70%
        ),
        linear-gradient(180deg, #1a244a, #111a36);
      border-color: rgba(120, 140, 200, 0.4);
      color: #dbe7ff;
    }
    .btn-submit {
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
    }
    .btn-search:hover,
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .btn-search:focus,
    .btn-submit:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* === 테이블 === */
    .data-table.materials-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.65),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.3);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .materials-table thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #bcd1ff;
      background: linear-gradient(
        180deg,
        rgba(32, 52, 110, 0.55),
        rgba(22, 36, 84, 0.3)
      );
      border-bottom: 1px solid rgba(84, 129, 255, 0.35);
    }
    .materials-table td {
      padding: 12px 14px;
      font-size: 14px;
      color: #e4efff;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .materials-table tbody tr:last-child td {
      border-bottom: none;
    }
    .materials-table tbody tr:hover {
      background: rgba(24, 182, 255, 0.06);
    }

    /* 열 폭 (colgroup 클래스) */
    .materials-table col.no {
      width: 72px;
    }
    .materials-table col.name {
      width: 380px;
    }
    .materials-table col.date {
      width: 160px;
    }
    .materials-table col.action {
      width: 140px;
    }

    /* 다운로드 링크 */
    .materials-table a {
      display: inline-block;
      height: 32px;
      line-height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      color: #dbe7ff;
      border: 1px solid rgba(120, 140, 200, 0.35);
      background: radial-gradient(
          120px 48px at 80% -40%,
          rgba(120, 140, 200, 0.5),
          transparent 70%
        ),
        linear-gradient(180deg, #1a244a, #111a36);
      filter: drop-shadow(0 0 6px rgba(61, 122, 255, 0.22));
    }
    .materials-table a:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .materials-table a:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 첫 열 정렬 & 날짜 숫자 정렬 */
    .materials-table td:nth-child(1) {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .materials-table td:nth-child(3) {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>수업 자료 관리</h2>

          <div class="search-box materials-search">
            <input type="text" placeholder="과정명" />
            <button class="btn-search">조회</button>
            <button class="btn-submit">새 자료 업로드</button>
          </div>

          <table class="data-table materials-table" aria-label="수업 자료 목록">
            <colgroup>
              <col class="no" />
              <col class="name" />
              <col class="date" />
              <col class="action" />
            </colgroup>
            <thead>
              <tr>
                <th>NO</th>
                <th>파일명</th>
                <th>등록일</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>1주차_강의.pdf</td>
                <td>2025-09-01</td>
                <td><a href="#">다운로드</a></td>
              </tr>
              <!-- 예시 추가 -->
              <tr>
                <td>2</td>
                <td>2주차_실습자료.zip</td>
                <td>2025-09-08</td>
                <td><a href="#">다운로드</a></td>
              </tr>
              <tr>
                <td>3</td>
                <td>중간평가_안내.hwp</td>
                <td>2025-09-15</td>
                <td><a href="#">다운로드</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
