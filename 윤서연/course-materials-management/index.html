<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>수업 자료 관리</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      /* 제목 */
      .content-box h2 {
        margin: 0 0 14px;
        color: var(--primary);
        font-size: 22px;
      }

      /* ===== 검색 박스: 비반응형 · 한 줄 고정 ===== */
      .materials-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 16px;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
      }
      .materials-search input[type="text"],
      .materials-search .btn-search,
      .materials-search .btn-submit {
        height: 42px;
        font-size: 14px;
        border-radius: 10px;
      }
      .materials-search input[type="text"] {
        width: 320px;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      .materials-search input[type="text"]:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .materials-search .btn-search {
        padding: 0 14px;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #111827;
        font-weight: 700;
        cursor: pointer;
      }
      .materials-search .btn-search:hover {
        background: #f9fafb;
      }
      .materials-search .btn-submit {
        padding: 0 14px;
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
      .materials-search .btn-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* ===== 표: 고정 레이아웃(잘림 허용) ===== */
      .materials-table {
        width: 100%;
        table-layout: fixed; /* ★ 고정 */
        border-collapse: separate;
        border-spacing: 0;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        white-space: nowrap; /* 줄바꿈 방지 */
      }
      .materials-table thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
      }
      .materials-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .materials-table tbody tr:last-child td {
        border-bottom: none;
      }
      .materials-table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 열 폭 고정 */
      .materials-table col.no {
        width: 72px;
      }
      .materials-table col.name {
        width: auto;
      } /* 남는 폭 */
      .materials-table col.date {
        width: 160px;
      }
      .materials-table col.action {
        width: 140px;
      }

      /* 열 별 디테일 */
      .materials-table td:nth-child(1) {
        text-align: center;
        color: #374151;
      } /* NO */
      .materials-table td:nth-child(2) {
        overflow-wrap: anywhere;
      } /* 파일명 */
      .materials-table td:nth-child(3) {
        font-variant-numeric: tabular-nums;
        color: #374151;
      } /* 등록일 */
      .materials-table td:nth-child(4) a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 700;
      }
      .materials-table td:nth-child(4) a:hover {
        text-decoration: underline;
      }
      .materials-table td:nth-child(4) a::before {
        content: "⤓ ";
      } /* 다운로드 아이콘 느낌 */

      /* 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>수업 자료 관리</h2>

          <div class="search-box materials-search">
            <input type="text" placeholder="과정명" />
            <button class="btn-search">조회</button>
            <button class="btn-submit">새 자료 업로드</button>
          </div>

          <table class="data-table materials-table" aria-label="수업 자료 목록">
            <colgroup>
              <col class="no" />
              <col class="name" />
              <col class="date" />
              <col class="action" />
            </colgroup>
            <thead>
              <tr>
                <th>NO</th>
                <th>파일명</th>
                <th>등록일</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>1주차_강의.pdf</td>
                <td>2025-09-01</td>
                <td><a href="#">다운로드</a></td>
              </tr>
              <!-- 예시 추가 -->
              <tr>
                <td>2</td>
                <td>2주차_실습자료.zip</td>
                <td>2025-09-08</td>
                <td><a href="#">다운로드</a></td>
              </tr>
              <tr>
                <td>3</td>
                <td>중간평가_안내.hwp</td>
                <td>2025-09-15</td>
                <td><a href="#">다운로드</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
