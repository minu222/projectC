<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy · 이메일 발송 내역</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 0 14px;
    }
    .header h2 {
      font-weight: 800;
      color: #e6f1ff;
      text-shadow: 0 0 22px rgba(24, 182, 255, 0.2);
    }

    /* =========================
   검색 + 버튼 영역
   ========================= */
    .search-area {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin: 8px 0 16px;
      padding: 14px;
      background: var(--card);
      border: 1px solid rgba(84, 129, 255, 0.26);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .search-left {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }
    .search-left label {
      color: #bcd1ff;
      font-size: 13px;
      font-weight: 600;
    }

    .search-left select,
    .search-left input[type="text"] {
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-left select {
      width: 140px;
    }
    .search-left input[type="text"] {
      width: 220px;
    }

    .search-left button[type="submit"] {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .search-left :is(select, input, button):focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 우측 액션 */
    .search-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-actions .btn-delete {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      border: 1px solid rgba(255, 120, 150, 0.4);
      color: #ffdbe4;
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(255, 120, 150, 0.55),
          transparent 70%
        ),
        linear-gradient(180deg, #3a1a2a, #2a1220);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    }
    .search-actions .btn-write {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 14px;
      text-decoration: none;
      font-weight: 800;
      border-radius: 10px;
      border: 1px solid rgba(61, 122, 255, 0.4);
      color: #fff;
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
    }
    .search-actions :is(.btn-delete, .btn-write):hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .search-actions :is(.btn-delete, .btn-write):focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* =========================
   테이블
   ========================= */
    table[aria-label="이메일 발송 내역"] {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.65),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.3);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }

    /* 열 폭 (colgroup 클래스) */
    .col-check {
      width: 52px;
    }
    .col-no {
      width: 72px;
      text-align: center;
    }
    .col-group {
      width: 120px;
    }
    .col-user {
      width: 140px;
    }
    .col-title {
      /* 가변 */
    }
    .col-sender {
      width: 120px;
    }
    .col-date {
      width: 140px;
    }
    .col-count {
      width: 110px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #bcd1ff;
      background: linear-gradient(
        180deg,
        rgba(32, 52, 110, 0.55),
        rgba(22, 36, 84, 0.3)
      );
      border-bottom: 1px solid rgba(84, 129, 255, 0.35);
    }
    thead th:first-child {
      text-align: center;
    }

    tbody td {
      padding: 12px 14px;
      font-size: 14px;
      color: #e4efff;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover {
      background: rgba(24, 182, 255, 0.06);
    }

    /* 제목 셀 말줄임 보강 (title 속성 이미 있음) */
    tbody td[title] {
      max-width: 480px;
    }

    /* 체크박스 */
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3d7aff;
      filter: drop-shadow(0 0 6px rgba(61, 122, 255, 0.3));
    }

    /* 선택 행 하이라이트 (:has 지원 브라우저 한정) */
    tbody tr:has(.row-check:checked) {
      background: rgba(61, 122, 255, 0.12);
      box-shadow: inset 0 0 0 9999px rgba(61, 122, 255, 0.08);
    }
    tbody tr:has(.row-check:checked) td {
      border-bottom-color: rgba(84, 129, 255, 0.5);
    }

    /* 포커스 보조 */
    button:focus,
    a:focus,
    select:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 아이콘 살짝 빛 */
    i[class^="fa-"],
    i[class*=" fa-"] {
      filter: drop-shadow(0 0 6px rgba(61, 122, 255, 0.25));
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <div class="header"><h2>이메일 발송 내역</h2></div>

          <!-- 검색 + 버튼 영역 -->
          <form
            class="search-area"
            method="get"
            th:action="@{/messages/search}"
          >
            <div class="search-left">
              <label for="group">소속:</label>
              <select id="group" name="group">
                <option value="">전체</option>
                <option value="teacher">강사</option>
              </select>

              <label for="type">검색:</label>
              <select id="type" name="type">
                <option value="">전체</option>
                <option value="userid">회원아이디</option>
                <option value="title">제목</option>
                <option value="sender">발송자</option>
              </select>

              <input
                name="keyword"
                placeholder="검색어 입력"
                type="text"
                aria-label="검색어"
              />
              <button type="submit" aria-label="검색">
                <i class="fa-solid fa-magnifying-glass"></i> 검색
              </button>
            </div>

            <div class="search-actions">
              <button class="btn-delete" type="button">
                <i class="fa-solid fa-trash"></i> 선택 삭제
              </button>
              <a class="btn-write" th:href="@{/messages/write}">
                <i class="fa-solid fa-envelope"></i> 메일 쓰기
              </a>
            </div>
          </form>

          <!-- 발송 내역 테이블 -->
          <table aria-label="이메일 발송 내역">
            <colgroup>
              <col class="col-check" />
              <col class="col-no" />
              <col class="col-group" />
              <col class="col-user" />
              <col class="col-title" />
              <col class="col-sender" />
              <col class="col-date" />
              <col class="col-count" />
            </colgroup>
            <thead>
              <tr>
                <th>
                  <input
                    id="checkAll"
                    type="checkbox"
                    aria-label="전체 선택(시각적)"
                  />
                </th>
                <th>번호</th>
                <th>소속</th>
                <th>회원아이디</th>
                <th>제목</th>
                <th>발송자</th>
                <th>발송일</th>
                <th>발송건수</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td class="col-no">1</td>
                <td>강사</td>
                <td>user01</td>
                <td title="공지사항 안내">공지사항 안내</td>
                <td>관리자</td>
                <td>2025-09-08</td>
                <td class="col-count">50</td>
              </tr>
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td class="col-no">2</td>
                <td>강사</td>
                <td>user02</td>
                <td title="업데이트 안내">업데이트 안내</td>
                <td>관리자</td>
                <td>2025-09-07</td>
                <td class="col-count">30</td>
              </tr>
              <!-- 서버 렌더링 예시
              <tr th:each="msg, i : ${messages}">
                <td><input class="row-check" type="checkbox" th:value="${msg.id}"/></td>
                <td class="col-no" th:text="${i.count}"></td>
                <td th:text="${msg.groupName}"></td>
                <td th:text="${msg.userId}"></td>
                <td th:text="${msg.title}" th:title="${msg.title}"></td>
                <td th:text="${msg.sender}"></td>
                <td th:text="${#temporals.format(msg.sentAt, 'yyyy-MM-dd')}"></td>
                <td class="col-count" th:text="${msg.sendCount}"></td>
              </tr> -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
