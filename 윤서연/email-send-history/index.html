<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <style>
      :root {
        --bg: #f3f4f6; /* 배경 */
        --card: #ffffff; /* 카드/패널 */
        --text: #111827; /* 본문 텍스트 */
        --muted: #6b7280; /* 보조 텍스트 */
        --primary: #1e3a8a; /* 포인트 컬러 */
        --danger: #dc2626; /* 삭제 버튼 */
        --ring: rgba(30, 58, 138, 0.15); /* 포커스 링 */
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans,
          Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* 상단바 & 레이아웃 (공통 톤) */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 20px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      .container {
        min-height: calc(100dvh - 56px);
        display: flex;
      }
      .main {
        flex: 1;
        padding: clamp(16px, 4vw, 32px);
        display: flex;
        justify-content: center;
      }

      /* 카드 박스 */
      .content-box {
        width: 100%;
        max-width: 1200px;
        background: var(--card);
        border-radius: 16px;
        padding: clamp(16px, 3.5vw, 28px);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      }
      .content-box .header h2 {
        margin: 0 0 14px;
        font-size: clamp(18px, 2.6vw, 24px);
        color: var(--primary);
      }

      /* 검색 영역 레이아웃 */
      .search-area {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 12px;
      }
      .search-left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
      }
      .search-left label {
        font-weight: 700;
        color: #111827;
      }
      .search-left select,
      .search-left input[type="text"],
      .search-left button {
        height: 40px;
        font-size: 14px;
        border-radius: 10px;
      }
      .search-left select,
      .search-left input[type="text"] {
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      .search-left input[type="text"]:focus,
      .search-left select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .search-left button {
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        padding: 0 14px;
        cursor: pointer;
      }
      .search-left button:hover {
        filter: brightness(0.98);
      }

      /* 오른쪽 버튼들 */
      .search-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn-delete,
      .btn-write {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-delete {
        border: 1px solid color-mix(in srgb, var(--danger) 40%, #e5e7eb);
        background: #fff;
        color: var(--danger);
      }
      .btn-delete:hover {
        background: color-mix(in srgb, var(--danger) 6%, #fff);
      }
      .btn-write {
        border: none;
        background: var(--primary);
        color: #fff;
      }
      .btn-write:hover {
        filter: brightness(0.98);
      }

      /* 테이블 */
      .content-box > table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
      }
      .content-box > table thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
      }
      .content-box > table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
      }
      .content-box > table tbody tr:last-child td {
        border-bottom: none;
      }
      .content-box > table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 열 정렬 & 숫자 가독성 */
      .content-box > table td:nth-child(2) {
        text-align: center;
        width: 72px;
        color: #374151;
      } /* 번호 */
      .content-box > table td:nth-child(7), /* 발송일 */
.content-box > table td:nth-child(8) {
        /* 발송건수 */
        font-variant-numeric: tabular-nums;
      }
      .content-box > table td:nth-child(8) {
        text-align: right;
      }

      /* 체크박스 톤 통일 */
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      /* 작은 화면 대응 */
      @media (max-width: 900px) {
        .search-area {
          grid-template-columns: 1fr;
        }
        .search-actions {
          justify-content: flex-start;
          flex-wrap: wrap;
        }
      }
      @media (max-width: 720px) {
        .content-box > table {
          display: block;
          width: 100%;
          overflow-x: auto;
          white-space: nowrap;
          border-radius: 12px;
        }
        .btn-write,
        .btn-delete {
          flex: 1 1 auto;
          justify-content: center;
        }
      }

      /* 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }

      /* 프린트 최적화(선택) */
      @media print {
        .topbar {
          position: static;
          border: none;
        }
        .container {
          min-height: auto;
        }
        .content-box {
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <!-- 이메일 발송 내역 -->
          <div class="header">
            <h2>이메일 발송 내역</h2>
          </div>

          <!-- 검색 + 버튼 영역 -->
          <form
            class="search-area"
            method="get"
            th:action="@{/messages/search}"
          >
            <!-- 왼쪽: 검색 조건 -->
            <div class="search-left">
              <label>소속:</label>
              <select name="group">
                <option value="">전체</option>
                <option value="teacher">강사</option>
              </select>

              <label>검색:</label>
              <select name="type">
                <option value="">전체</option>
                <option value="userid">회원아이디</option>
                <option value="title">제목</option>
                <option value="sender">발송자</option>
              </select>

              <input name="keyword" placeholder="검색어 입력" type="text" />
              <button type="submit">
                <i class="fa-solid fa-magnifying-glass"></i> 검색
              </button>
            </div>

            <!-- 오른쪽: 버튼 영역 -->
            <div class="search-actions">
              <button class="btn-delete" type="button">
                <i class="fa-solid fa-trash"></i> 선택 삭제
              </button>
              <a class="btn-write" th:href="@{/messages/write}"
                ><i class="fa-solid fa-envelope"></i> 메일 쓰기</a
              >
            </div>
          </form>

          <!-- 발송 내역 테이블 -->
          <table>
            <thead>
              <tr>
                <th><input id="checkAll" type="checkbox" /></th>
                <th>번호</th>
                <th>소속</th>
                <th>회원아이디</th>
                <th>제목</th>
                <th>발송자</th>
                <th>발송일</th>
                <th>발송건수</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td>1</td>
                <td>강사</td>
                <td>user01</td>
                <td>공지사항 안내</td>
                <td>관리자</td>
                <td>2025-09-08</td>
                <td>50</td>
              </tr>
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td>2</td>
                <td>강사</td>
                <td>user02</td>
                <td>업데이트 안내</td>
                <td>관리자</td>
                <td>2025-09-07</td>
                <td>30</td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
