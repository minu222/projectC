<!-- ===============================
DW Academy - 강의실 목록 (No JS, Fixed Layout)
- 비반응형 고정 레이아웃
- 스크립트 없음
- :has()로 체크된 행 하이라이트(지원 브라우저에서만)
=============================== -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy - 강의실 목록</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />

    <style>
      /* 헤더 */
      .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      /* ===== 검색/액션 바: 한 줄 고정 ===== */
      .search-area {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
      }
      .search-left {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
      }
      .search-left label {
        font-weight: 700;
        color: #111827;
      }
      .search-left select,
      .search-left input[type="text"],
      .search-left button {
        height: 40px;
        font-size: 14px;
        border-radius: 10px;
      }
      .search-left select,
      .search-left input[type="text"] {
        padding: 8px 10px;
        border: 1px solid var(--border);
        background: #fff;
      }
      /* 고정 폭 */
      .search-left select {
        width: 140px;
      }
      #keyword {
        width: 220px;
      }
      .search-left input[type="text"]:focus,
      .search-left select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .search-left button {
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        padding: 0 14px;
        cursor: pointer;
      }
      .search-left button:hover {
        filter: brightness(0.98);
      }

      .search-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: nowrap;
      }
      .btn-delete,
      .btn-write {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-delete {
        border: 1px solid #f3d2d2;
        background: #fff;
        color: var(--danger);
      }
      .btn-delete:hover {
        background: #fff6f6;
      }
      .btn-write {
        border: none;
        background: var(--primary);
        color: #fff;
      }
      .btn-write:hover {
        filter: brightness(0.98);
      }

      /* ===== 테이블 ===== */
      .table-wrap {
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      table {
        width: 100%;
        table-layout: fixed; /* ★ 고정 레이아웃 */
        border-collapse: separate;
        border-spacing: 0;
        white-space: nowrap; /* 줄바꿈 금지 */
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9fafb;
        color: #0f172a;
        font-weight: 700;
        font-size: 14px;
        text-align: center;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      tbody td {
        text-align: center;
        padding: 12px 14px;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      /* 줄무늬 + 호버 */
      tbody tr:nth-child(odd) {
        background: #fafafa;
      }
      tbody tr:hover {
        background: var(--soft);
      }

      /* 체크박스 컬럼 */
      colgroup col.chk {
        width: 44px;
      }
      .center {
        text-align: center;
        color: #374151;
      }

      /* 숫자 정렬/자폭 */
      .num {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      /* 체크된 행 하이라이트 (:has 지원 브라우저) */
      tbody tr:has(> td:first-child input[type="checkbox"]:checked) {
        background: #eef6ff;
        box-shadow: inset 0 0 0 9999px rgba(37, 99, 235, 0.06);
      }

      /* 상태 칩 */
      .status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .status.open {
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      }
      .status.closed {
        background: rgba(239, 68, 68, 0.12);
        color: #7f1d1d;
      }
      .status.repair {
        background: rgba(99, 102, 241, 0.12);
        color: #1e1b4b;
      }

      /* 액션 링크 버튼화 */
      .actions a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        margin-right: 6px;
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
        border: 1px solid var(--border);
        color: #1f2937;
        background: #fff;
      }
      .actions a:hover {
        background: #f3f4f6;
      }
      .actions a.edit {
        background: #ecfeff;
        border-color: #a5f3fc;
        color: #0b3a2f;
      }

      /* 체크박스 톤 */
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      /* 포커스 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <header class="topbar"><div>DW Academy</div></header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <div class="header">
            <h2>강의실 목록</h2>
            <div
              class="legend"
              aria-hidden="true"
              style="display: flex; gap: 8px; align-items: center"
            >
              <span class="status open">운영중</span>
              <span class="status repair">점검</span>
              <span class="status closed">휴강</span>
            </div>
          </div>

          <!-- 검색/액션 -->
          <form class="search-area" method="get" th:action="@{/classrooms}">
            <div class="search-left">
              <label for="campus">캠퍼스:</label>
              <select id="campus" name="campus">
                <option value="">전체</option>
                <option value="daejeon" th:selected="${campus=='daejeon'}">
                  대전
                </option>
                <option value="seoul" th:selected="${campus=='seoul'}">
                  서울
                </option>
              </select>

              <label for="status">상태:</label>
              <select id="status" name="status">
                <option value="">전체</option>
                <option value="OPEN" th:selected="${status=='OPEN'}">
                  운영중
                </option>
                <option value="CLOSED" th:selected="${status=='CLOSED'}">
                  휴강
                </option>
                <option value="REPAIR" th:selected="${status=='REPAIR'}">
                  점검
                </option>
              </select>

              <label for="type">검색:</label>
              <select id="type" name="type">
                <option value="name" th:selected="${type=='name'}">
                  강의실명
                </option>
                <option value="manager" th:selected="${type=='manager'}">
                  담당자
                </option>
              </select>

              <input
                id="keyword"
                name="keyword"
                placeholder="검색어 입력"
                type="text"
                th:value="${keyword}"
              />
              <button type="submit">
                <i class="fa-solid fa-magnifying-glass"></i> 검색
              </button>
            </div>

            <div class="search-actions">
              <!-- JS 없이 시각만 -->
              <a class="btn-delete" href="#" onclick="return false;">
                <i class="fa-solid fa-trash"></i> 선택 삭제
              </a>
              <a class="btn-write" th:href="@{/classrooms/new}">
                <i class="fa-solid fa-door-open"></i> 강의실 등록
              </a>
            </div>
          </form>

          <!-- 목록 -->
          <div class="table-wrap">
            <table aria-label="강의실 목록">
              <colgroup>
                <col class="chk" />
                <col style="width: 72px" />
                <!-- 번호 -->
                <col style="width: 220px" />
                <!-- 강의실명 -->
                <col style="width: 140px" />
                <!-- 캠퍼스 -->
                <col style="width: 120px" />
                <!-- 수용인원 -->
                <col style="width: 120px" />
                <!-- 상태 -->
                <col style="width: 160px" />
                <!-- 담당자 -->
                <col />
                <!-- 관리(가변) -->
              </colgroup>
              <thead>
                <tr>
                  <th>
                    <input
                      id="checkAllRooms"
                      type="checkbox"
                      aria-label="전체 선택(시각적)"
                    />
                  </th>
                  <th>번호</th>
                  <th>강의실명</th>
                  <th>캠퍼스</th>
                  <th class="num">수용인원</th>
                  <th>상태</th>
                  <th>담당자</th>
                  <th>관리</th>
                </tr>
              </thead>

              <tbody>
                <!-- 서버 데이터 -->
                <tr th:each="room, i: ${classrooms}">
                  <td data-label="선택">
                    <input
                      class="row-check room"
                      type="checkbox"
                      th:value="${room.id}"
                    />
                  </td>
                  <td class="center" data-label="번호" th:text="${i.count}">
                    1
                  </td>
                  <td data-label="강의실명" th:text="${room.name}">301호</td>
                  <td data-label="캠퍼스" th:text="${room.campus}">대전</td>
                  <td
                    class="num"
                    data-label="수용인원"
                    th:text="${room.capacity}"
                  >
                    30
                  </td>
                  <td data-label="상태">
                    <span class="status open" th:if="${room.status=='OPEN'}"
                      >운영중</span
                    >
                    <span class="status closed" th:if="${room.status=='CLOSED'}"
                      >휴강</span
                    >
                    <span class="status repair" th:if="${room.status=='REPAIR'}"
                      >점검</span
                    >
                  </td>
                  <td data-label="담당자" th:text="${room.manager}">김민수</td>
                  <td class="actions" data-label="관리">
                    <a
                      class="view"
                      th:href="@{/classrooms/{id}(id=${room.id})}"
                    >
                      <i class="fa-regular fa-eye"></i> 보기
                    </a>
                    <a
                      class="edit"
                      th:href="@{/classrooms/{id}/edit(id=${room.id})}"
                    >
                      <i class="fa-regular fa-pen-to-square"></i> 수정
                    </a>
                  </td>
                </tr>

                <!-- 정적 예시 -->
                <tr>
                  <td data-label="선택">
                    <input class="row-check room" type="checkbox" value="101" />
                  </td>
                  <td class="center" data-label="번호">1</td>
                  <td data-label="강의실명">301호</td>
                  <td data-label="캠퍼스">대전</td>
                  <td class="num" data-label="수용인원">30</td>
                  <td data-label="상태">
                    <span class="status open">운영중</span>
                  </td>
                  <td data-label="담당자">김민수</td>
                  <td class="actions" data-label="관리">
                    <a class="view" href="#"
                      ><i class="fa-regular fa-eye"></i> 보기</a
                    >
                    <a class="edit" href="#"
                      ><i class="fa-regular fa-pen-to-square"></i> 수정</a
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
