<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <style>
    /* =========================
   DW Academy - 강사 정보 (No JS, Fixed)
   HTML 수정 금지 / CSS만 적용
   ========================= */

    /* =========================
   필터 박스 + 라디오 상태
   ========================= */
    .filter-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 8px 0 16px;
      padding: 14px;
      background: var(--card);
      border: 1px solid rgba(84, 129, 255, 0.26);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .filter-box > div:first-child {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .filter-box > div:last-child {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .filter-box label {
      color: #bcd1ff;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .filter-box select,
    .filter-box input[type="text"] {
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .filter-box select {
      width: 140px;
    }
    .filter-box input[type="text"] {
      width: 220px;
    }
    .filter-box button {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .filter-box :is(select, input, button):focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 상태 라디오 */
    .status-filter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #bcd1ff;
      font-size: 13px;
      font-weight: 700;
    }
    .status-filter label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      cursor: pointer;
      border: 1px solid rgba(120, 140, 200, 0.35);
      color: #dbe7ff;
      background: radial-gradient(
          120px 48px at 80% -40%,
          rgba(120, 140, 200, 0.45),
          transparent 70%
        ),
        linear-gradient(180deg, #1a244a, #111a36);
    }
    .status-filter input[type="radio"] {
      accent-color: #3d7aff;
    }
    .status-filter input[type="radio"]:checked + * {
    }
    .status-filter label:has(input[type="radio"]:checked) {
      border-color: rgba(61, 122, 255, 0.5);
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* 선택 탈퇴 버튼(보조 경고 톤) */
    .btn-delete {
      color: #ffdbe4;
      border: 1px solid rgba(255, 120, 150, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(255, 120, 150, 0.55),
          transparent 70%
        ),
        linear-gradient(180deg, #3a1a2a, #2a1220);
    }
    .btn-delete:hover,
    .filter-box button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }

    /* =========================
   테이블
   ========================= */
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.65),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.3);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #bcd1ff;
      background: linear-gradient(
        180deg,
        rgba(32, 52, 110, 0.55),
        rgba(22, 36, 84, 0.3)
      );
      border-bottom: 1px solid rgba(84, 129, 255, 0.35);
    }
    thead th:first-child {
      text-align: center;
      width: 52px;
    }
    thead th:nth-child(2) {
      width: 72px;
    }
    thead th:nth-child(3) {
      width: 140px;
    } /* 아이디 */
    thead th:nth-child(4) {
      width: 120px;
    } /* 이름 */
    thead th:nth-child(5) {
      width: 220px;
    } /* 이메일 */
    thead th:nth-child(6) {
      width: 150px;
    } /* 전화번호 */
    thead th:nth-child(7) {
      width: 140px;
    } /* 가입일 */
    thead th:nth-child(8) {
      width: 110px;
    } /* 상태 */

    tbody td {
      padding: 12px 14px;
      font-size: 14px;
      color: #e4efff;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover {
      background: rgba(24, 182, 255, 0.06);
    }

    /* 숫자/날짜 정렬 */
    tbody td:nth-child(2),
    tbody td:nth-child(7) {
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    /* 링크(아이디) */
    tbody td a {
      color: #dbe7ff;
      text-decoration: none;
      font-weight: 700;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.45);
    }
    tbody td a:hover {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(61, 122, 255, 0.6);
    }
    tbody td a:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* 체크박스 & 선택 행 하이라이트 */
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3d7aff;
      filter: drop-shadow(0 0 6px rgba(61, 122, 255, 0.3));
    }
    tbody tr:has(.row-check:checked) {
      background: rgba(61, 122, 255, 0.12);
      box-shadow: inset 0 0 0 9999px rgba(61, 122, 255, 0.08);
    }
    tbody tr:has(.row-check:checked) td {
      border-bottom-color: rgba(84, 129, 255, 0.5);
    }

    /* 배지 (상태) */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid currentColor;
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
    }
    .badge-green {
      background: rgba(42, 216, 155, 0.12);
      color: #1fc493;
    } /* 정상 */
    .badge-gray {
      background: rgba(160, 170, 190, 0.12);
      color: #b9c4da;
    } /* 휴면 */
    .badge-red {
      background: rgba(255, 91, 124, 0.12);
      color: #ff6b8a;
    } /* 탈퇴 */

    /* 포커스 보조 */
    button:focus,
    a:focus,
    select:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }
  </style>
  <body>
    <div class="container">
      <!-- 메인 -->
      <main class="main">
        <div class="content-box">
          <h2>강사 정보</h2>

          <!-- 검색 필터 + 탈퇴 버튼 -->
          <div class="filter-box">
            <div>
              <label
                >소속:
                <select>
                  <option>- 전체 -</option>
                  <option>DW</option>
                  <option>JS</option>
                </select>
              </label>
              <label
                >검색:
                <select>
                  <option>- 전체 -</option>
                  <option>이름</option>
                  <option>아이디</option>
                </select>
                <input placeholder="검색어 입력" type="text" />
              </label>
              <button>검색</button>
            </div>

            <div>
              <div class="status-filter">
                상태:
                <label><input checked name="status" type="radio" /> 전체</label>
                <label><input name="status" type="radio" /> 정상</label>
                <label><input name="status" type="radio" /> 휴면</label>
                <label><input name="status" type="radio" /> 탈퇴</label>
              </div>

              <div style="margin-left: auto">
                <button class="btn-delete">🗑 선택 탈퇴</button>
              </div>
            </div>
          </div>

          <!-- 강사 리스트 (Thymeleaf 적용) -->
          <table>
            <thead>
              <tr>
                <th><input id="checkAll" type="checkbox" /></th>
                <th>No</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>가입일</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="teacher, stat : ${teachers}">
                <td>
                  <input
                    class="row-check"
                    th:value="${teacher.id}"
                    type="checkbox"
                  />
                </td>
                <td th:text="${stat.count}"></td>
                <td>
                  <a
                    th:href="@{'/admin/teachers/' + ${teacher.id}}"
                    th:text="${teacher.username}"
                  ></a>
                </td>
                <td th:text="${teacher.name}"></td>
                <td th:text="${teacher.email}"></td>
                <td th:text="${teacher.phone}"></td>
                <td
                  th:text="${#temporals.format(teacher.createdAt, 'yyyy-MM-dd')}"
                ></td>
                <td>
                  <span class="badge badge-green" th:if="${teacher.active}"
                    >정상</span
                  >
                  <span
                    class="badge badge-gray"
                    th:if="${teacher.status == 'SLEEP'}"
                    >휴면</span
                  >
                  <span class="badge badge-red" th:if="${!teacher.active}"
                    >탈퇴</span
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
