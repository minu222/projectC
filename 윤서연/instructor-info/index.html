<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <div class="container">
      <!-- 메인 -->
      <main class="main">
        <div class="content-box">
          <h2>강사 정보</h2>

          <!-- 검색 필터 + 탈퇴 버튼 -->
          <div class="filter-box">
            <div>
              <label
                >소속:
                <select>
                  <option>- 전체 -</option>
                  <option>DW</option>
                  <option>JS</option>
                </select>
              </label>
              <label
                >검색:
                <select>
                  <option>- 전체 -</option>
                  <option>이름</option>
                  <option>아이디</option>
                </select>
                <input placeholder="검색어 입력" type="text" />
              </label>
              <button class="rjator">검색</button>
            </div>

            <div class="lastbox">
              <div class="status-filter">
                상태:
                <label><input checked name="status" type="radio" /> 전체</label>
                <label><input name="status" type="radio" /> 정상</label>
                <label><input name="status" type="radio" /> 휴면</label>
                <label><input name="status" type="radio" /> 탈퇴</label>
              </div>

              <div style="margin-left: auto">
                <button class="btn-delete">🗑 선택 탈퇴</button>
              </div>
            </div>
          </div>

          <!-- 강사 리스트 (Thymeleaf 적용) -->
          <table>
            <thead>
              <tr>
                <th><input id="checkAll" type="checkbox" /></th>
                <th>No</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>가입일</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="teacher, stat : ${teachers}">
                <td>
                  <input
                    class="row-check"
                    th:value="${teacher.id}"
                    type="checkbox"
                  />
                </td>
                <td th:text="${stat.count}"></td>
                <td>
                  <a
                    th:href="@{'/admin/teachers/' + ${teacher.id}}"
                    th:text="${teacher.username}"
                  ></a>
                </td>
                <td th:text="${teacher.name}"></td>
                <td th:text="${teacher.email}"></td>
                <td th:text="${teacher.phone}"></td>
                <td
                  th:text="${#temporals.format(teacher.createdAt, 'yyyy-MM-dd')}"
                ></td>
                <td>
                  <span class="badge badge-green" th:if="${teacher.active}"
                    >정상</span
                  >
                  <span
                    class="badge badge-gray"
                    th:if="${teacher.status == 'SLEEP'}"
                    >휴면</span
                  >
                  <span class="badge badge-red" th:if="${!teacher.active}"
                    >탈퇴</span
                  >
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
