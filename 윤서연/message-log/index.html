<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DW Academy - 쪽지내역</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <!-- 전역 공통 CSS는 이미 프로젝트에서 로드된다고 가정 -->
  </head>
  <body>
    <div th:replace="adminpages/menu :: menu"></div>

    <div class="container">
      <main class="main">
        <div class="header">
          <h2 class="card-title">쪽지 내역</h2>
          <div class="search-actions">
            <a href="#" class="btn-line btn-primary"
              ><i class="fa-solid fa-pen"></i> 새 쪽지</a
            >
          </div>
        </div>

        <div class="two-col">
          <!-- 리스트 영역 -->
          <section class="card" style="flex: 3">
            <div class="card-header">
              <div class="detail-title">쪽지 목록</div>
              <div class="actions">
                <button class="btn-sm btn-line btn-primary" type="button">
                  <i class="fa-solid fa-check-double"></i> 전체 읽음
                </button>
                <button class="btn-sm btn-line btn-danger" type="button">
                  <i class="fa-solid fa-trash"></i> 선택 삭제
                </button>
              </div>
            </div>

            <div class="card-body">
              <div class="table-wrap table-gap-top">
                <div class="table-scroller">
                  <table class="data-table member-table" aria-label="쪽지 목록">
                    <colgroup>
                      <col class="chk" />
                      <col class="no" />
                      <col class="name" />
                      <col class="name" />
                      <col />
                      <col class="col-date" />
                      <col class="col-actions" />
                    </colgroup>

                    <thead>
                      <tr>
                        <th class="center">
                          <input id="check-all" type="checkbox" />
                        </th>
                        <th class="col-no">#</th>
                        <th>보낸이</th>
                        <th>받는사람</th>
                        <th>제목 / 내용</th>
                        <th>날짜</th>
                        <th class="center">읽음</th>
                      </tr>
                    </thead>

                    <tbody>
                      <!-- 반복: notes -->
                      <tr
                        th:each="note,iterStat : ${notes}"
                        th:attr="data-id=${note.id},data-sender=${note.senderName},data-receiver=${note.receiverName},data-title=${note.title},data-content=${note.content},data-date=${note.sentAt},data-read=${note.read}"
                        class="note-row"
                        th:classappend="${note.read} ? '' : 'unread'"
                      >
                        <td class="center">
                          <input
                            class="row-check"
                            type="checkbox"
                            th:value="${note.id}"
                          />
                        </td>
                        <td class="num" th:text="${iterStat.index + 1}">1</td>
                        <td th:text="${note.senderName}">보낸이</td>
                        <td th:text="${note.receiverName}">받는사람</td>
                        <td>
                          <a
                            href="#"
                            class="title-link note-link"
                            th:href="@{'#'}"
                            th:text="${note.title != null ? note.title : #strings.abbreviate(note.content,0,60)}"
                            >제목 또는 내용 미리보기</a
                          >
                          <div
                            class="muted"
                            style="font-size: 0.9rem; margin-top: 6px"
                            th:text="${#strings.abbreviate(note.content, 0, 100)}"
                          >
                            미리보기 텍스트...
                          </div>
                        </td>
                        <td class="center" th:text="${note.sentAt}">
                          2025-09-30
                        </td>
                        <td class="center">
                          <span th:if="${note.read}" class="badge done"
                            ><i class="fa-solid fa-check"></i> 읽음</span
                          >
                          <span th:unless="${note.read}" class="badge"
                            ><i class="fa-regular fa-envelope"></i> 안읽음</span
                          >
                        </td>
                      </tr>

                      <tr th:if="${#lists.isEmpty(notes)}">
                        <td colspan="7" class="center muted">
                          쪽지가 없습니다.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="detail-footer">
              <div class="helper-note">
                쪽지를 클릭하면 우측에서 전체 내용을 확인하고 답장할 수
                있습니다.
              </div>
            </div>
          </section>

          <!-- 상세 영역 -->
          <aside class="detail-col">
            <div class="detail-card">
              <div class="detail-head">
                <div class="detail-title">쪽지 상세</div>
                <div>
                  <button
                    id="btn-reply"
                    class="btn-sm btn-line btn-primary"
                    type="button"
                    disabled
                  >
                    <i class="fa-solid fa-reply"></i> 답장
                  </button>
                </div>
              </div>

              <div class="detail-body" id="detail-body">
                <div class="empty">
                  <p class="muted">왼쪽 목록에서 쪽지를 선택하세요.</p>
                </div>

                <div id="detail-content" style="display: none">
                  <div style="display: flex; flex-direction: column; gap: 10px">
                    <div>
                      <strong>보낸이:</strong> <span id="d-sender"></span>
                    </div>
                    <div>
                      <strong>받는사람:</strong> <span id="d-receiver"></span>
                    </div>
                    <div><strong>제목:</strong> <span id="d-title"></span></div>
                    <div><strong>날짜:</strong> <span id="d-date"></span></div>
                    <div>
                      <strong>상태:</strong>
                      <span id="d-read" class="badge"></span>
                    </div>
                    <hr />
                    <div
                      id="d-content"
                      style="white-space: pre-wrap; line-height: 1.6"
                    ></div>
                  </div>
                </div>
              </div>

              <div class="detail-footer">
                <div class="actions">
                  <button
                    id="btn-flag"
                    class="btn-sm btn-line"
                    type="button"
                    disabled
                  >
                    <i class="fa-solid fa-flag"></i> 신고
                  </button>
                  <button
                    id="btn-delete"
                    class="btn-sm btn-line btn-danger"
                    type="button"
                    disabled
                  >
                    <i class="fa-solid fa-trash"></i> 삭제
                  </button>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </body>
</html>
