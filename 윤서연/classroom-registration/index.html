<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강의실 등록</title>
   

    <!-- 페이지 전용(최소) -->
 
  </head>

  <body>


    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>강의실 등록</h2>

          <form class="classroom-form">
            <div>
              <label>
                강의실 코드
                <input type="text" placeholder="예: A-101" class="form-input" />
              </label>
              <label>
                수용 인원
                <input type="number" placeholder="예: 30" class="form-input" />
              </label>
            </div>

            <label class="full-row">
              비고
              <textarea
                rows="6"
                placeholder="프로젝터, 화이트보드 등"
                class="form-textarea"
              ></textarea>
            </label>

            <div class="form-actions">
              <button type="reset" class="btn-reset">초기화</button>
              <button type="submit" class="btn-submit">등록</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
