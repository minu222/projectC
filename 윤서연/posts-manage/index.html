<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DW Academy - 게시글 관리</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <style>
      .search-area {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
        margin-bottom: 12px;
      }
      .search-left {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
      }
      .search-left label {
        font-weight: 700;
        color: #111827;
      }
      .search-left select,
      .search-left input[type="text"],
      .search-left button {
        height: 40px;
        font-size: 14px;
        border-radius: 10px;
      }
      .search-left select,
      .search-left input[type="text"] {
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      .search-left input[type="text"]:focus,
      .search-left select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .search-left button {
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        padding: 0 14px;
        cursor: pointer;
      }
      .search-left button:hover {
        filter: brightness(0.98);
      }
      .search-actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .btn-delete,
      .btn-write {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-delete {
        border: 1px solid #f3d2d2;
        background: #fff;
        color: var(--danger);
      }
      .btn-delete:hover {
        background: #fff6f6;
      }
      .btn-write {
        border: none;
        background: var(--primary);
        color: #fff;
      }
      .btn-write:hover {
        filter: brightness(0.98);
      }

      .table-wrap {
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
      }
      .table-scroller {
        width: 100%;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 960px;
      }
      thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
      }
      td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #fcfcfd;
      }
      .num {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .title-link {
        color: #111827;
        text-decoration: none;
        font-weight: 700;
      }
      .title-link:hover {
        text-decoration: underline;
      }

      .state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 12px;
      }
      .pub {
        color: #064e3b;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
      }
      .hid {
        color: #7c2d12;
        background: #fff7ed;
        border: 1px solid #fed7aa;
      }
      .drf {
        color: #1e1b8a;
        background: #e0e7ff;
        border: 1px solid #c7d2fe;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }
      @media (max-width: 900px) {
        .search-area {
          grid-template-columns: 1fr;
        }
        .search-actions {
          flex-wrap: wrap;
        }
      }
      @media (max-width: 720px) {
        .btn-write,
        .btn-delete {
          flex: 1 1 auto;
          justify-content: center;
        }
        table {
          min-width: 720px;
        }
      }
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <header class="topbar"><div>DW Academy</div></header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <div class="header"><h2>게시글 관리</h2></div>

          <form class="search-area" method="get" th:action="@{/posts}">
            <div class="search-left">
              <label for="category">분류:</label>
              <select id="category" name="category">
                <option value="">전체</option>
                <option value="notice" th:selected="${category=='notice'}">
                  공지
                </option>
                <option value="event" th:selected="${category=='event'}">
                  이벤트
                </option>
                <option value="faq" th:selected="${category=='faq'}">
                  FAQ
                </option>
              </select>

              <label for="state">상태:</label>
              <select id="state" name="state">
                <option value="">전체</option>
                <option value="PUBLISHED" th:selected="${state=='PUBLISHED'}">
                  게시
                </option>
                <option value="HIDDEN" th:selected="${state=='HIDDEN'}">
                  숨김
                </option>
                <option value="DRAFT" th:selected="${state=='DRAFT'}">
                  임시
                </option>
              </select>

              <label for="ptype">검색:</label>
              <select id="ptype" name="type">
                <option value="title" th:selected="${type=='title'}">
                  제목
                </option>
                <option value="author" th:selected="${type=='author'}">
                  작성자
                </option>
              </select>
              <input
                id="pkeyword"
                name="keyword"
                placeholder="검색어 입력"
                type="text"
                th:value="${keyword}"
              />
              <button type="submit">
                <i class="fa-solid fa-magnifying-glass"></i> 검색
              </button>
            </div>
            <div class="search-actions">
              <button class="btn-delete" type="button" id="btnDeletePosts">
                <i class="fa-solid fa-trash"></i> 선택 삭제
              </button>
              <a class="btn-write" th:href="@{/posts/new}"
                ><i class="fa-regular fa-square-plus"></i> 새 글 작성</a
              >
            </div>
          </form>

          <div class="table-wrap">
            <div class="table-scroller">
              <table aria-label="게시글 목록">
                <thead>
                  <tr>
                    <th>
                      <input
                        id="checkAllPosts"
                        type="checkbox"
                        aria-label="전체 선택"
                      />
                    </th>
                    <th>번호</th>
                    <th>분류</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>등록일</th>
                    <th class="num">조회수</th>
                    <th>상태</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="p, i: ${posts}">
                    <td>
                      <input
                        class="row-check post"
                        type="checkbox"
                        th:value="${p.id}"
                      />
                    </td>
                    <td class="center" th:text="${i.count}">1</td>
                    <td th:text="${p.category}">공지</td>
                    <td>
                      <a
                        class="title-link"
                        th:href="@{/posts/{id}(id=${p.id})}"
                        th:text="${p.title}"
                        >공지사항 안내</a
                      >
                    </td>
                    <td th:text="${p.author}">관리자</td>
                    <td th:text="${p.createdAt}">2025-09-10</td>
                    <td class="num" th:text="${p.views}">120</td>
                    <td>
                      <span class="state pub" th:if="${p.state=='PUBLISHED'}"
                        ><i class="fa-solid fa-bullhorn"></i> 게시</span
                      >
                      <span class="state hid" th:if="${p.state=='HIDDEN'}"
                        ><i class="fa-regular fa-eye-slash"></i> 숨김</span
                      >
                      <span class="state drf" th:if="${p.state=='DRAFT'}"
                        ><i class="fa-regular fa-pen-to-square"></i> 임시</span
                      >
                    </td>
                  </tr>
                  <!-- 정적 예시 -->
                  <tr>
                    <td>
                      <input
                        class="row-check post"
                        type="checkbox"
                        value="501"
                      />
                    </td>
                    <td class="center">1</td>
                    <td>공지</td>
                    <td><a class="title-link" href="#">9월 휴강 안내</a></td>
                    <td>관리자</td>
                    <td>2025-09-07</td>
                    <td class="num">87</td>
                    <td>
                      <span class="state pub"
                        ><i class="fa-solid fa-bullhorn"></i> 게시</span
                      >
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      const allPosts = document.getElementById("checkAllPosts");
      const postChecks = () =>
        Array.from(document.querySelectorAll("input.row-check.post"));
      allPosts?.addEventListener("change", (e) =>
        postChecks().forEach((c) => (c.checked = e.target.checked))
      );
      document
        .getElementById("btnDeletePosts")
        ?.addEventListener("click", () => {
          const ids = postChecks()
            .filter((c) => c.checked)
            .map((c) => c.value);
          if (!ids.length) return alert("삭제할 게시글을 선택하세요.");
          if (confirm(ids.length + "개 게시글을 삭제하시겠습니까?")) {
            // TODO: fetch('/posts/bulk-delete', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(ids)});
            console.log("DELETE posts", ids);
          }
        });
    </script>
  </body>
</html>
