<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy - 관리자 메인</title>

    <!-- Libs (필요 시) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- 전역 고정 레이아웃/토큰 -->
    <link rel="stylesheet" href="/common.css" />

    <!-- 페이지 전용 -->
    <style>
      /* 대시보드 컨테이너: .content-box(1280) 내부 전용 */
      .dashboard-wrap {
        width: 100%;
      }

      /* 통계 카드: 6열 고정 (줄바꿈 금지) */
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr); /* ★ 고정 6열 */
        gap: 20px;
        margin-bottom: 28px;
        white-space: nowrap;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        border-top: 5px solid rgba(30, 58, 138, 0.2);
        font-weight: 800;
        font-size: 20px; /* 고정 폰트 */
      }
      .card span {
        display: block;
        margin-top: 6px;
        color: var(--muted);
        font-weight: 600;
        font-size: 13px; /* 고정 폰트 */
      }

      /* 알림 박스 */
      .alerts {
        background: var(--card);
        padding: 20px;
        border-radius: 14px;
        margin-bottom: 16px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .alerts h3 {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 18px; /* 고정 */
      }
      .alerts ul {
        margin: 0;
        padding-left: 18px;
      }

      /* 검색 박스: 한 줄 고정, 고정 폭 */
      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: nowrap; /* ★ 줄바꿈 금지 */
        white-space: nowrap;
      }
      .search-box input,
      .search-box select,
      .search-box button {
        height: 40px;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
      }
      .search-box input {
        width: 220px;
      } /* 고정 폭 */
      .search-box select {
        width: 140px;
      } /* 고정 폭 */
      .search-box button {
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      /* 표: 고정 레이아웃 + 줄바꿈 금지 */
      .table-wrap {
        background: var(--card);
        border-radius: 14px;
        border: 1px solid #e5e7eb;
        overflow: hidden; /* 넘치는 부분 자름(전역도 숨김) */
      }
      .data-table {
        width: 100%;
        table-layout: fixed; /* ★ 고정 레이아웃 */
        border-collapse: collapse;
        white-space: nowrap; /* ★ 줄바꿈 금지 */
      }
      .data-table thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
      }
      .data-table td {
        padding: 12px 14px;
        font-size: 14px;
        border-bottom: 1px solid #e5e7eb;
        overflow: hidden;
        text-overflow: ellipsis; /* 넘침 … 처리 */
      }
      .data-table tbody tr:last-child td {
        border-bottom: none;
      }
      .data-table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 상태 배지 */
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.normal {
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      }
      .badge.cancel {
        background: rgba(239, 68, 68, 0.12);
        color: #7f1d1d;
      }
      .badge.done {
        background: rgba(99, 102, 241, 0.12);
        color: #1e1b4b;
      }

      /* 리포트 */
      .sales-report {
        background: var(--card);
        border-radius: 14px;
        padding: 20px;
        margin-top: 16px;
        border: 1px solid #e5e7eb;
      }
      .sales-report h3 {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 18px;
      }
      .chart-container {
        width: 100%;
        height: 360px; /* ★ 고정 높이 (반응형 비활성) */
        position: relative;
      }
      .chart-container > canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>관리자 메인</h2>

          <div class="dashboard-wrap">
            <!-- 📊 통계 카드 (6고정) -->
            <section class="stats" aria-label="통계 카드">
              <div class="card" th:text="${studentCount} + '명'">
                120명<span>총 회원(학생)</span>
              </div>
              <div class="card" th:text="${teacherCount} + '명'">
                35명<span>총 강사</span>
              </div>
              <div class="card" th:text="${courseCount} + '개'">
                25개<span>개설 과정</span>
              </div>
              <div class="card" th:text="${avgCompletion} + '%'">
                85%<span>평균 수료율</span>
              </div>
              <div class="card" th:text="${cancelRate} + '%'">
                12%<span>수강 취소율</span>
              </div>
              <div class="card" th:text="'₩' + ${monthRevenue}">
                ₩12,530,000<span>이번 달 매출</span>
              </div>
            </section>

            <!-- 📢 알림 -->
            <section class="alerts" aria-label="최근 알림">
              <h3>최근 알림 / 처리 필요</h3>
              <ul>
                <li th:each="notice : ${notices}" th:text="${notice}">
                  강사 김민수 강의자료 업로드 요청
                </li>
              </ul>
            </section>

            <!-- 🔍 검색 + 테이블 (줄바꿈 없음) -->
            <section aria-label="검색 및 목록">
              <div class="search-box">
                <input placeholder="과정명 검색" type="text" />
                <input placeholder="예: 2025/01" type="text" />
                <select>
                  <option>전체</option>
                  <option>정상</option>
                  <option>수강취소</option>
                  <option>수료</option>
                </select>
                <button>검색</button>
              </div>

              <div class="table-wrap">
                <table class="data-table" aria-label="수강 리스트">
                  <thead>
                    <tr>
                      <th style="width: 72px">NO</th>
                      <th style="width: 140px">년도/차수</th>
                      <th>과정명</th>
                      <th style="width: 200px">소속</th>
                      <th style="width: 140px">수강생</th>
                      <th style="width: 120px">진도율</th>
                      <th style="width: 120px">상태</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>2025/01</td>
                      <td>스마트테스트</td>
                      <td>(주)위런소프트</td>
                      <td>홍길동</td>
                      <td>90%</td>
                      <td><span class="badge normal">정상</span></td>
                    </tr>
                    <tr>
                      <td>2</td>
                      <td>2024/33</td>
                      <td>인터넷활용</td>
                      <td>(주)위런소프트</td>
                      <td>이영희</td>
                      <td>75%</td>
                      <td><span class="badge cancel">수강취소</span></td>
                    </tr>
                    <tr>
                      <td>3</td>
                      <td>2024/20</td>
                      <td>엑셀활용</td>
                      <td>(주)위런소프트</td>
                      <td>김민수</td>
                      <td>100%</td>
                      <td><span class="badge done">수료</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <!-- 💰 매출 리포트 (고정 높이) -->
            <section class="sales-report" aria-label="매출 리포트">
              <h3>💰 이번 달 매출 리포트</h3>
              <div class="chart-container">
                <canvas id="salesChart"></canvas>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
