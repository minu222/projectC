<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy - 관리자 메인</title>
    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />



    <!-- 페이지 전용: 네온 블루 다크 테마 -->
    <style>
      /* === 페이지 테마 토큰 (공통 토큰 위에 오버라이드) === */
      body {
        margin-top: 100px;
        margin-right: 100px;
        margin-left: 300px;
        --bg-0: #0a1224;
        --card: rgba(16, 26, 54, 0.82);
        --primary: #3d7aff;
        --ring: rgba(61, 122, 255, 0.22);
        --muted: #9cb4dc;
        --text: #e5f0ff;
        color: var(--text);
        background: radial-gradient(
            1200px 600px at 50% -10%,
            #15214a 0%,
            transparent 60%
          ),
          linear-gradient(180deg, #0a0f1d 0%, var(--bg-0) 60%);
        -webkit-font-smoothing: antialiased;
        letter-spacing: 0.2px;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.35;
        background: linear-gradient(
            transparent 31px,
            rgba(33, 56, 112, 0.28) 32px
          ),
          linear-gradient(90deg, transparent 31px, rgba(33, 56, 112, 0.28) 32px);
        background-size: 32px 32px;
      }

      /* 제목 */
      .content-box h2 {
        margin: 0 0 14px;
        color: #e6f1ff;
        text-shadow: 0 0 22px rgba(24, 182, 255, 0.2);
      }

      /* ===== 통계 카드 6열 ===== */
      .dashboard-wrap {
        width: 100%;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 18px;
        margin-bottom: 24px;
        white-space: nowrap;
      }
      .stats .card {
        position: relative;
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(20, 31, 64, 0.85),
          rgba(10, 17, 32, 0.8)
        );
        border: 1px solid rgba(24, 182, 255, 0.22);
        padding: 22px 18px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4),
          0 0 36px rgba(61, 122, 255, 0.08);
        font-weight: 800;
        font-size: 22px;
        color: #eaf4ff;
      }
      .stats .card::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 16px;
        pointer-events: none;
        background: radial-gradient(
            120px 40px at 85% -20%,
            rgba(61, 122, 255, 0.42),
            transparent 70%
          ),
          radial-gradient(
            100px 30px at 15% 110%,
            rgba(24, 182, 255, 0.25),
            transparent 70%
          );
      }
      .stats .card span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-weight: 600;
        font-size: 13px;
      }

      /* ===== 알림 박스 ===== */
      .alerts {
        background: var(--card);
        border-radius: 14px;
        padding: 18px 18px 16px;
        margin-bottom: 16px;
        border: 1px solid rgba(84, 129, 255, 0.26);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35),
          0 0 36px rgba(24, 182, 255, 0.06);
      }
      .alerts h3 {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 18px;
        text-shadow: 0 0 16px rgba(61, 122, 255, 0.22);
      }
      .alerts ul {
        margin: 0;
        padding-left: 18px;
        color: #cfe3ff;
      }

      /* ===== 검색 박스 ===== */
      .search-box {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: nowrap;
      }
      .search-box input,
      .search-box select,
      .search-box button {
        height: 40px;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 10px;
        transition: box-shadow 0.15s ease, transform 0.05s ease;
      }
      .search-box input,
      .search-box select {
        background: linear-gradient(
          180deg,
          rgba(22, 34, 74, 0.9),
          rgba(15, 26, 56, 0.9)
        );
        border: 1px solid rgba(84, 129, 255, 0.34);
        color: var(--text);
        width: 220px;
      }
      .search-box select {
        width: 140px;
      }
      .search-box input:focus,
      .search-box select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }
      .search-box button {
        border: 1px solid rgba(61, 122, 255, 0.4);
        background: radial-gradient(
            140px 60px at 80% -40%,
            rgba(61, 122, 255, 0.8),
            transparent 70%
          ),
          linear-gradient(180deg, #1b2f72, #142963);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      }
      .search-box button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
          0 0 24px rgba(61, 122, 255, 0.22);
      }

      /* ===== 표 ===== */
      .table-wrap {
        background: linear-gradient(
          180deg,
          rgba(10, 17, 32, 0.65),
          rgba(16, 28, 64, 0.65)
        );
        border-radius: 14px;
        border: 1px solid rgba(84, 129, 255, 0.3);
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
          0 0 36px rgba(61, 122, 255, 0.08);
      }
      .data-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        white-space: nowrap;
      }
      .data-table thead th {
        background: linear-gradient(
          180deg,
          rgba(32, 52, 110, 0.55),
          rgba(22, 36, 84, 0.3)
        );
        color: #bcd1ff;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        padding: 12px 14px;
        border-bottom: 1px solid rgba(84, 129, 255, 0.35);
      }
      .data-table td {
        padding: 12px 14px;
        font-size: 14px;
        color: #e4efff;
        border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .data-table tbody tr:last-child td {
        border-bottom: none;
      }
      .data-table tbody tr:hover {
        background: rgba(24, 182, 255, 0.06);
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        border: 1px solid currentColor;
        box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
      }
      .badge.normal {
        background: rgba(42, 216, 155, 0.12);
        color: #1fc493;
      }
      .badge.cancel {
        background: rgba(255, 91, 124, 0.12);
        color: #ff6b8a;
      }
      .badge.done {
        background: rgba(99, 102, 241, 0.12);
        color: #8aa0ff;
      }

      /* ===== 매출 리포트 ===== */
      .sales-report {
        background: var(--card);
        border-radius: 14px;
        padding: 18px 18px 20px;
        margin-top: 16px;
        border: 1px solid rgba(84, 129, 255, 0.26);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
          0 0 36px rgba(61, 122, 255, 0.08);
      }
      .sales-report h3 {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 18px;
        text-shadow: 0 0 16px rgba(61, 122, 255, 0.22);
      }
      .chart-container {
        position: relative;
        width: 100%;
        height: 360px;
        border-radius: 12px;
        background: linear-gradient(
          180deg,
          rgba(10, 17, 32, 0.6),
          rgba(16, 28, 64, 0.65)
        );
        border: 1px solid rgba(84, 129, 255, 0.25);
      }
      .chart-container::before {
        content: "";
        position: absolute;
        inset: 10px;
        border-radius: 8px;
        pointer-events: none;
        opacity: 0.55;
        background: linear-gradient(
            transparent 39px,
            rgba(54, 86, 170, 0.28) 40px
          ),
          linear-gradient(90deg, transparent 39px, rgba(54, 86, 170, 0.28) 40px);
        background-size: 40px 40px;
      }
      .chart-container > canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>관리자 메인</h2>

          <div class="dashboard-wrap">
            <!-- 📊 통계 카드 (6고정) -->
            <section class="stats" aria-label="통계 카드">
              <div class="card" th:text="${studentCount} + '명'">
                120명<span>총 회원(학생)</span>
              </div>
              <div class="card" th:text="${teacherCount} + '명'">
                35명<span>총 강사</span>
              </div>
              <div class="card" th:text="${courseCount} + '개'">
                25개<span>개설 과정</span>
              </div>
              <div class="card" th:text="${avgCompletion} + '%'">
                85%<span>평균 수료율</span>
              </div>
              <div class="card" th:text="${cancelRate} + '%'">
                12%<span>수강 취소율</span>
              </div>
              <div class="card" th:text="'₩' + ${monthRevenue}">
                ₩12,530,000<span>이번 달 매출</span>
              </div>
            </section>

            <!-- 📢 알림 -->
            <section class="alerts" aria-label="최근 알림">
              <h3>최근 알림 / 처리 필요</h3>
              <ul>
                <li th:each="notice : ${notices}" th:text="${notice}">
                  강사 김민수 강의자료 업로드 요청
                </li>
              </ul>
            </section>

            <!-- 🔍 검색 + 테이블 (줄바꿈 없음) -->
            <section aria-label="검색 및 목록">
              <div class="search-box">
                <input placeholder="과정명 검색" type="text" />
                <input placeholder="예: 2025/01" type="text" />
                <select>
                  <option>전체</option>
                  <option>정상</option>
                  <option>수강취소</option>
                  <option>수료</option>
                </select>
                <button>검색</button>
              </div>

              <div class="table-wrap">
                <table class="data-table" aria-label="수강 리스트">
                  <thead>
                    <tr>
                      <th style="width: 72px">NO</th>
                      <th style="width: 140px">년도/차수</th>
                      <th>과정명</th>
                      <th style="width: 200px">소속</th>
                      <th style="width: 140px">수강생</th>
                      <th style="width: 120px">진도율</th>
                      <th style="width: 120px">상태</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>2025/01</td>
                      <td>스마트테스트</td>
                      <td>(주)위런소프트</td>
                      <td>홍길동</td>
                      <td>90%</td>
                      <td><span class="badge normal">정상</span></td>
                    </tr>
                    <tr>
                      <td>2</td>
                      <td>2024/33</td>
                      <td>인터넷활용</td>
                      <td>(주)위런소프트</td>
                      <td>이영희</td>
                      <td>75%</td>
                      <td><span class="badge cancel">수강취소</span></td>
                    </tr>
                    <tr>
                      <td>3</td>
                      <td>2024/20</td>
                      <td>엑셀활용</td>
                      <td>(주)위런소프트</td>
                      <td>김민수</td>
                      <td>100%</td>
                      <td><span class="badge done">수료</span></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <!-- 💰 매출 리포트 (고정 높이) -->
            <section class="sales-report" aria-label="매출 리포트">
              <h3>💰 이번 달 매출 리포트</h3>
              <div class="chart-container">
                <canvas id="salesChart"></canvas>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
