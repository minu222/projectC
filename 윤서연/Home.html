<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DW Academy - 관리자 메인</title>

    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />

    <!-- 공통 CSS가 있다면 그대로 사용 (선택) -->
    <link rel="stylesheet" href="/common.css" />

    <style>
      /* 메인 */
      .dashboard {
        flex: 1;
        padding: clamp(16px, 4vw, 32px);
        overflow-y: auto;
      }

      /* 통계 카드 그리드: 자동으로 끊어짐 */
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 28px;
      }
      .card {
        background: var(--card);
        border-radius: 16px;
        padding: 28px;
        text-align: center;
        font-size: clamp(18px, 2.2vw, 26px);
        font-weight: 700;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      }
      .card span {
        display: block;
        margin-top: 8px;
        font-size: clamp(12px, 1.6vw, 16px);
        font-weight: 500;
        color: var(--muted);
      }
      .card:nth-child(1) {
        border-top: 5px solid #3b82f6;
      }
      .card:nth-child(2) {
        border-top: 5px solid #10b981;
      }
      .card:nth-child(3) {
        border-top: 5px solid #f59e0b;
      }
      .card:nth-child(4) {
        border-top: 5px solid #6366f1;
      }
      .card:nth-child(5) {
        border-top: 5px solid #ef4444;
      }
      .card:nth-child(6) {
        border-top: 5px solid #1e3a8a;
      }

      /* 알림 */
      .alerts {
        background: var(--card);
        padding: 20px;
        border-radius: 14px;
        margin-bottom: 20px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .alerts h3 {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--primary);
      }
      .alerts ul {
        margin: 0;
        padding-left: 18px;
      }

      /* 검색 박스: 자동 칼럼 개수 */
      .search-box {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      .search-box input,
      .search-box select,
      .search-box button {
        height: 40px;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
      }
      .search-box input:focus,
      .search-box select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .search-box button {
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      /* 표: 가로 스크롤 + 모바일 카드형 전환 */
      .table-wrap {
        background: var(--card);
        border-radius: 14px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        overflow: hidden;
      }
      .table-scroller {
        width: 100%;
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }
      .data-table th,
      .data-table td {
        padding: 12px 14px;
        border-bottom: 1px solid #e5e7eb;
        text-align: left;
        font-size: 14px;
      }
      .data-table thead th {
        background: #f9fafb;
        font-weight: 700;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.normal {
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      }
      .badge.cancel {
        background: rgba(239, 68, 68, 0.12);
        color: #7f1d1d;
      }
      .badge.done {
        background: rgba(99, 102, 241, 0.12);
        color: #1e1b4b;
      }

      /* 매출 리포트 */
      .sales-report {
        background: var(--card);
        border-radius: 14px;
        padding: 20px;
        margin-top: 16px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }
      .sales-report h3 {
        margin: 0 0 12px;
        font-size: 18px;
        color: var(--primary);
      }
      .chart-container {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
      }
      .chart-container > canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
      }

      /* 매우 작은 화면에서 표를 카드형으로 바꿔 읽기 좋게 */
      @media (max-width: 560px) {
        .table-wrap {
          padding: 8px;
        }
        .table-scroller {
          overflow: visible;
        }
        .data-table {
          border-collapse: separate;
          border-spacing: 0 10px;
          min-width: 0;
        }
        .data-table thead {
          display: none;
        }
        .data-table tr {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 8px;
          background: #fff;
          border: 1px solid #e5e7eb;
          border-radius: 12px;
          padding: 10px;
        }
        .data-table td {
          border: none;
          padding: 6px 8px;
        }
        .data-table td::before {
          content: attr(data-label);
          display: block;
          font-size: 12px;
          color: var(--muted);
          margin-bottom: 2px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <!-- 📂 (선택) 사이드바 영역이 있다면 여기에 배치하세요 -->

      <!-- 📂 메인 대시보드 -->
      <main class="dashboard">
        <!-- 📊 통계 카드 -->
        <section class="stats" aria-label="통계 카드">
          <div class="card" th:text="${studentCount} + '명'">
            120명<span>총 회원(학생)</span>
          </div>
          <div class="card" th:text="${teacherCount} + '명'">
            35명<span>총 강사</span>
          </div>
          <div class="card" th:text="${courseCount} + '개'">
            25개<span>개설 과정</span>
          </div>
          <div class="card" th:text="${avgCompletion} + '%'">
            85%<span>평균 수료율</span>
          </div>
          <div class="card" th:text="${cancelRate} + '%'">
            12%<span>수강 취소율</span>
          </div>
          <div class="card" th:text="'₩' + ${monthRevenue}">
            ₩12,530,000<span>이번 달 매출</span>
          </div>
        </section>

        <!-- 📢 알림 -->
        <section class="alerts" aria-label="최근 알림">
          <h3>📢 최근 알림 / 처리 필요</h3>
          <ul>
            <li th:each="notice : ${notices}" th:text="${notice}">
              강사 김민수 강의자료 업로드 요청
            </li>
          </ul>
        </section>

        <!-- 🔍 검색 + 테이블 -->
        <section aria-label="검색 및 목록">
          <div class="search-box">
            <input placeholder="과정명 검색" type="text" />
            <input placeholder="예: 2025/01" type="text" />
            <select>
              <option>전체</option>
              <option>정상</option>
              <option>수강취소</option>
              <option>수료</option>
            </select>
            <button>검색</button>
          </div>

          <div class="table-wrap">
            <div class="table-scroller">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>NO</th>
                    <th>년도/차수</th>
                    <th>과정명</th>
                    <th>소속</th>
                    <th>수강생</th>
                    <th>진도율</th>
                    <th>상태</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- 모바일 카드형에서 라벨로 보이도록 data-label 속성 추가 -->
                  <tr>
                    <td data-label="NO">1</td>
                    <td data-label="년도/차수">2025/01</td>
                    <td data-label="과정명">스마트테스트</td>
                    <td data-label="소속">(주)위런소프트</td>
                    <td data-label="수강생">홍길동</td>
                    <td data-label="진도율">90%</td>
                    <td data-label="상태">
                      <span class="badge normal">정상</span>
                    </td>
                  </tr>
                  <tr>
                    <td data-label="NO">2</td>
                    <td data-label="년도/차수">2024/33</td>
                    <td data-label="과정명">인터넷활용</td>
                    <td data-label="소속">(주)위런소프트</td>
                    <td data-label="수강생">이영희</td>
                    <td data-label="진도율">75%</td>
                    <td data-label="상태">
                      <span class="badge cancel">수강취소</span>
                    </td>
                  </tr>
                  <tr>
                    <td data-label="NO">3</td>
                    <td data-label="년도/차수">2024/20</td>
                    <td data-label="과정명">엑셀활용</td>
                    <td data-label="소속">(주)위런소프트</td>
                    <td data-label="수강생">김민수</td>
                    <td data-label="진도율">100%</td>
                    <td data-label="상태">
                      <span class="badge done">수료</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- 💰 매출 리포트 -->
        <section class="sales-report" aria-label="매출 리포트">
          <h3>💰 이번 달 매출 리포트</h3>
          <div class="chart-container">
            <canvas id="salesChart"></canvas>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
