<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강의실 삭제</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <style>
    .content-box .helper {
      margin: 0 0 16px;
      color: #bcd1ff;
      font-size: 14px;
    }

    /* 검색/삭제 폼(바 형태) */
    .search-box.classroom-delete-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      background: var(--card);
      border: 1px solid rgba(84, 129, 255, 0.26);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .classroom-delete-box input[type="text"] {
      flex: 1 1 auto;
      min-width: 260px;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .classroom-delete-box input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 버튼: 조회(보조), 삭제(경고) */
    .btn-search,
    .btn-delete {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease,
        border-color 0.15s ease;
      border: 1px solid rgba(61, 122, 255, 0.4);
      color: #fff;
    }
    .btn-search {
      color: #dbe7ff;
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(120, 140, 200, 0.6),
          transparent 70%
        ),
        linear-gradient(180deg, #1a244a, #111a36);
      border-color: rgba(120, 140, 200, 0.4);
    }
    .btn-delete {
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(255, 120, 150, 0.55),
          transparent 70%
        ),
        linear-gradient(180deg, #3a1a2a, #2a1220);
      border-color: rgba(255, 120, 150, 0.45);
      color: #ffdbe4;
    }
    .btn-search:hover,
    .btn-delete:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .btn-search:focus,
    .btn-delete:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 위험 안내(Callout) */
    .danger-callout {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 14px;
      border-radius: 14px;
      margin-top: 8px;
      background: radial-gradient(
          300px 120px at 10% -30%,
          rgba(255, 120, 150, 0.25),
          transparent 70%
        ),
        linear-gradient(180deg, rgba(46, 16, 26, 0.9), rgba(26, 10, 18, 0.9));
      border: 1px solid rgba(255, 120, 150, 0.45);
      color: #ffe9ee;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45),
        0 0 30px rgba(255, 120, 150, 0.12);
    }
    .danger-callout .icon {
      flex: 0 0 32px;
      height: 32px;
      line-height: 32px;
      text-align: center;
      border-radius: 50%;
      font-weight: 900;
      color: #2b0d15;
      background: #ffd2dd;
      box-shadow: 0 0 0 3px rgba(255, 120, 150, 0.35),
        0 0 24px rgba(255, 120, 150, 0.22) inset;
    }
    .danger-callout strong {
      display: inline-block;
      margin-bottom: 4px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 120, 150, 0.35);
    }

    /* 포커스 보조 */
    button:focus,
    input:focus {
      outline: none;
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>강의실 삭제</h2>
          <p class="helper">강의실 코드를 확인한 뒤 삭제를 진행하세요.</p>

          <form
            class="search-box classroom-delete-box"
            method="post"
            th:action="@{/classrooms/delete}"
          >
            <input
              type="text"
              name="roomCode"
              placeholder="강의실 코드 (예: A-101)"
              aria-label="강의실 코드"
              required
            />
            <button type="button" class="btn-search" aria-label="조회">
              조회
            </button>
            <button type="submit" class="btn-delete" aria-label="삭제">
              삭제
            </button>
          </form>

          <div class="danger-callout" role="alert" aria-live="polite">
            <div class="icon">!</div>
            <div>
              <strong>삭제 주의</strong>
              삭제 시 해당 강의실에 연결된 배정/출석/자료 등의 데이터가 영향을
              받을 수 있습니다. 필요 시 먼저 이관 또는 백업을 진행하세요.
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
