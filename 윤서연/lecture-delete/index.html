<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강의실 삭제</title>
    <link rel="stylesheet" href="/common.css" />
  </head>
  <style>

    /* 검색/액션 박스 */
  
    .search-box.classroom-delete-box input[type="text"],
    .search-box.classroom-delete-box .btn-search,
    .search-box.classroom-delete-box .btn-delete {
      height: 42px;
      font-size: 14px;
      border-radius: 10px;
    }
    .search-box.classroom-delete-box input[type="text"] {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    .search-box.classroom-delete-box input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

   
    .btn-search:hover {
      background: #f9fafb;
    }

    .btn-delete {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 40%, #e5e7eb);
      background: #fff;
      color: var(--danger);
    }
    .btn-delete:hover {
      background: color-mix(in srgb, var(--danger) 6%, #fff);
    }

    /* 주의 문구 */
    .muted {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .muted::before {
      content: "⚠ ";
    }

    /* 작은 화면 */
    @media (max-width: 560px) {
      .search-box.classroom-delete-box {
        grid-template-columns: 1fr;
      }
      .btn-search,
      .btn-delete {
        width: 100%;
      }
    }

    /* 접근성 */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-radius: 8px;
    }

    /* 프린트 최적화(선택) */
    @media print {
      .topbar {
        position: static;
        border: none;
      }
      .container {
        min-height: auto;
      }
      .content-box {
        box-shadow: none;
      }
    }
  </style>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>강의실 삭제</h2>
          <div class="search-box classroom-delete-box">
            <input type="text" placeholder="강의실 코드" />
            <button class="btn-search">조회</button>
            <button class="btn-delete">삭제</button>
          </div>
          <p class="muted">
            ※ 삭제 시 관련 배정 정보가 영향을 받을 수 있습니다.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
