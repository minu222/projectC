<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>menu.html</title>
    <!-- 아이콘 CDN -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      html {
        overflow: hidden;
      }

      .sidebar {
        overflow: hidden;
        position: relative;
        padding-top: 80px;
        width: 260px;
        background: #fff;
        border-right: 1px solid #e5e7eb;
        overflow-y: auto;
      }

      .menu,
      .menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* 상단 링크/토글 버튼 공통 모양 유지 */
      .menu > li > .submenu-toggle,
      .menu > li > .link {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 16px;
        margin: 6px 10px;
        border-radius: 8px;
        background: #1e3a8a;
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        text-decoration: none;
        cursor: pointer;
      }
      .menu > li > .submenu-toggle:hover,
      .menu > li > .link:hover {
        background: #374eb8;
        transform: translateX(2px);
      }

      .submenu > li > .submenu-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 14px;
        margin: 4px 14px;
        border-radius: 6px;
        background: #f9fafb;
        color: #111827;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid #e5e7eb;
      }

      .submenu li ul li a,
      .submenu li a {
        display: block;
        padding: 8px 14px;
        margin: 2px 14px 2px 28px;
        font-size: 13px;
        text-decoration: none;
        color: #4b5563;
        border-radius: 4px;
      }
      .submenu li ul li a:hover,
      .submenu li a:hover {
        background: #f3f4f6;
        color: #111827;
      }

      /* ▼ JS 없이 열고 닫기: max-height 트릭 */
      .submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }
      .submenu-check {
        display: none;
      } /* 접근성 배려하려면 visually-hidden 처리해도 OK */

      /* 체크되면 인접한 submenu 펼침 */
      .submenu-check:checked + .submenu {
        transition: 0.5s ease-in-out;
        max-height: 1200px;
      } /* 필요시 값 키워도 됨 */
    </style>
  </head>
  <body>
    <div class="sidebar">
      <ul class="menu">
        <li>
          <a class="link" href="./Home.html">
            <i class="fa-solid fa-house"></i> 홈
          </a>
        </li>

        <!-- 회원 정보 -->

          <label class="submenu-toggle" for="toggle-members">
            <i class="fas fa-users"></i> 회원 정보
          </label>
          <input type="checkbox" id="toggle-members" class="submenu-check" />
          <ul class="submenu">
            <li>
              <label class="submenu-toggle" for="toggle-members-mgmt">
                <i class="fas fa-user-cog"></i> 회원 관리
              </label>
              <input
                type="checkbox"
                id="toggle-members-mgmt"
                class="submenu-check"
              />
              <ul class="submenu">
                <li>
                  <a href="/instructor-info/index.html">
                    <i class="fas fa-chalkboard-teacher"></i> 강사 정보
                  </a>
                </li>
                <li>
                  <a href="/student-info/index.html">
                    <i class="fas fa-user-graduate"></i> 학생 정보
                  </a>
                </li>
                <li>
                  <a href="/info-trash/index.html">
                    <i class="fas fa-trash-alt"></i> 정보 휴지통
                  </a>
                </li>
                <li>
                  <a href="/member-details/index.html">
                    <i class="fas fa-id-card"></i> 회원 상세 정보
                  </a>
                </li>
              </ul>
            </li>
          </ul>
        </li>

        <!-- 발송 관리 -->
        <li>
          <label class="submenu-toggle" for="toggle-mailing">
            <i class="fas fa-paper-plane"></i> 발송 관리
          </label>
          <input type="checkbox" id="toggle-mailing" class="submenu-check" />
          <ul class="submenu">

            </li>
            <li>
              <a href="/email-send-history/index.html">
                <i class="fas fa-envelope-open-text"></i> 이메일 발송 내역

        </li>

        <!-- 교육과정 -->
        <li>
          <label class="submenu-toggle" for="toggle-courses">

          </label>
          <input type="checkbox" id="toggle-courses" class="submenu-check" />
          <ul class="submenu">
            <li>
              <a href="/classroom-registration/index.html">

            </li>
            <li>
              <a href="/classroom-edit/index.html">

            </li>

            </li>
            <li>
              <a href="/classroom-student-info/index.html">
                <i class="fas fa-users"></i> 강의실 학생 정보
              </a>
            </li>
            <li>
              <a href="/course-materials-management/index.html">

            </li>
            <li>

              </a>
            </li>
          </ul>
        </li>

        <!-- 결제 관리 -->
        <li>

          </label>
          <input type="checkbox" id="toggle-payments" class="submenu-check" />
          <ul class="submenu">
            <li>
              <a href="/order-list/index.html">

            </li>
            <li>

            </li>

        <!-- 매출 관리 -->
        <li>
          <label class="submenu-toggle" for="toggle-revenue">
            <i class="fas fa-chart-line"></i> 매출 관리
          </label>
          <input type="checkbox" id="toggle-revenue" class="submenu-check" />
          <ul class="submenu">

              <a href="/annual-revenue-stats/index.html">

            </li>

              </a>
            </li>
            <li>
              <a href="/course-revenue-stats/index.html">

              </a>
            </li>
            <li>
              <a href="/tax-management/index.html">
                <i class="fas fa-file-invoice-dollar"></i> 세금 관리
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
