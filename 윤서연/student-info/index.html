<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <style>

    


      /* 전체 콘텐츠 래퍼를 고정폭으로 */
      .content-box.students-page {
        background: transparent;
        box-shadow: none;
        padding: 0;
        width: 1280px; /* ★ 고정 폭 */
        max-width: none;
      }

   
    
      /* ==== 필터 영역: 줄바꿈/수축 금지 ==== */
      .filter-box {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: end;
        margin-bottom: 12px;
        white-space: nowrap; /* 줄바꿈 금지 */
      }
      .filter-box > div:first-child,
      .filter-box > div:last-child {
        display: flex;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
        align-items: center;
        width: 100%;
      }
      .filter-box > div:first-child {
        gap: 20px;
      }
      .filter-box > div:last-child {
        justify-content: space-between;
      }

      .filter-box label {
        min-width: max-content;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        flex: 0 0 auto; /* 수축 금지 */
      }
      .filter-box label > select,
      .filter-box label > input {
        height: 40px;
        font-size: 14px;
        border-radius: 10px;
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        background: #fff;
        width: 220px; /* ★ 고정폭 입력 */
      }
      .filter-box label > input:focus,
      .filter-box label > select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring, rgba(30, 58, 138, 0.15));
      }

      .filter-box > div:first-child button {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        border: none;
        background: var(--primary, #1e3a8a);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        flex: 0 0 auto; /* 수축 금지 */
      }
      .filter-box > button:hover {
        filter: brightness(0.98);
      }

      .status-filter {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #111827;
        font-weight: 700;
        flex: 0 0 auto;
      }
      .status-filter label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
      }
      .status-filter input[type="radio"] {
        accent-color: var(--primary, #1e3a8a);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .btn-delete {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid #f3d2d2;
        background: #fff;
        color: #dc2626;
        flex: 0 0 auto;
      }
      .btn-delete:hover {
        background: #fff6f6;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary, #1e3a8a);
        cursor: pointer;
      }

      /* ==== 테이블: 전통 테이블 레이아웃 + 고정폭 ==== */
      .students-table {
        width: 1232px; /* 1280 - (양쪽 패딩 24*2) 예시 */
        table-layout: fixed; /* ★ 고정 레이아웃 */
        border-collapse: collapse;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        overflow: hidden;
        white-space: nowrap; /* 줄바꿈 금지 */
      }
      .students-table thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
      }
      .students-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
        vertical-align: middle;
        overflow: hidden; /* 넘어가는 텍스트는 숨김 */
        text-overflow: ellipsis; /* … 처리 */
      }
      .students-table tbody tr:last-child td {
        border-bottom: none;
      }
      .students-table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 고정 컬럼 폭: colgroup으로 제어 */
      .students-table col.chk {
        width: 44px;
      }
      .students-table col.no {
        width: 72px;
      }
      .students-table col.id {
        width: 200px;
      }
      .students-table col.name {
        width: 140px;
      }
      .students-table col.email {
        width: 260px;
      }
      .students-table col.tel {
        width: 160px;
      }
      .students-table col.join {
        width: 140px;
      }
      .students-table col.stat {
        width: 120px;
      }

      /* 링크/배지 */
      .students-table td:nth-child(3) a {
        color: #1e3a8a;
        text-decoration: none;
        font-weight: 700;
      }
      .students-table td:nth-child(3) a:hover {
        text-decoration: underline;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
      }
      .badge-green {
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      } /* 정상 */
      .badge-gray {
        background: rgba(107, 114, 128, 0.15);
        color: #374151;
      } /* 휴면 */
      .badge-red {
        background: rgba(220, 38, 38, 0.12);
        color: #7f1d1d;
      } /* 탈퇴 */

      /* 접근성 포커스 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring, rgba(30, 58, 138, 0.15));
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="content-box students-page">
      <div class="container">
        <main class="main">
          <div class="content-box">
            <h2>학생 정보</h2>

            <!-- 검색 필터 + 탈퇴 버튼 -->
            <div class="filter-box">
              <div>
                <label>
                  소속:
                  <select>
                    <option>- 전체 -</option>
                    <option>DW</option>
                    <option>JS</option>
                  </select>
                </label>

                <label>
                  검색:
                  <select>
                    <option>- 전체 -</option>
                    <option>이름</option>
                    <option>아이디</option>
                  </select>
                  <input placeholder="검색어 입력" type="text" />
                </label>

                <button>검색</button>
              </div>

              <div>
                <div class="status-filter">
                  상태:
                  <label
                    ><input checked name="status" type="radio" /> 전체</label
                  >
                  <label><input name="status" type="radio" /> 정상</label>
                  <label><input name="status" type="radio" /> 휴면</label>
                  <label><input name="status" type="radio" /> 탈퇴</label>
                </div>

                <div style="margin-left: auto">
                  <button class="btn-delete">🗑 선택 탈퇴</button>
                </div>
              </div>
            </div>

            <!-- 학생 리스트 -->
            <table class="students-table">
              <colgroup>
                <col class="chk" />
                <col class="no" />
                <col class="id" />
                <col class="name" />
                <col class="email" />
                <col class="tel" />
                <col class="join" />
                <col class="stat" />
              </colgroup>
              <thead>
                <tr>
                  <th><input id="checkAll" type="checkbox" /></th>
                  <th>No</th>
                  <th>아이디</th>
                  <th>이름</th>
                  <th>이메일</th>
                  <th>전화번호</th>
                  <th>가입일</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="student, stat : ${students}">
                  <td>
                    <input
                      class="row-check"
                      th:value="${student.id}"
                      type="checkbox"
                    />
                  </td>
                  <td th:text="${stat.count}"></td>
                  <td>
                    <a
                      th:href="@{'/admin/students/' + ${student.id}}"
                      th:text="${student.username}"
                      >user01</a
                    >
                  </td>
                  <td th:text="${student.name}">홍길동</td>
                  <td th:text="${student.email}">user01@example.com</td>
                  <td th:text="${student.phone}">010-0000-0000</td>
                  <td
                    th:text="${#temporals.format(student.createdAt, 'yyyy-MM-dd')}"
                  >
                    2025-09-15
                  </td>
                  <td>
                    <span class="badge badge-green" th:if="${student.active}"
                      >정상</span
                    >
                    <span
                      class="badge badge-gray"
                      th:if="${student.status == 'SLEEP'}"
                      >휴면</span
                    >
                    <span class="badge badge-red" th:if="${!student.active}"
                      >탈퇴</span
                    >
                  </td>
                </tr>

                <!-- 정적 예시 -->
                <tr>
                  <td><input class="row-check" value="1" type="checkbox" /></td>
                  <td>1</td>
                  <td><a href="#">user01</a></td>
                  <td>홍길동</td>
                  <td>user01@example.com</td>
                  <td>010-0000-0000</td>
                  <td>2025-09-15</td>
                  <td><span class="badge badge-green">정상</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
