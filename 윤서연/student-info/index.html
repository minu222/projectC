<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
  </head>
  <style>
    /* 바깥 래퍼 투명 처리 (중첩 카드 방지) */
    .content-box.students-page {
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    /* 안쪽 컨텐츠 카드 */
    .content-box > .container > .main > .content-box {
      width: 100%;
      max-width: 1200px;
      background: var(--card);
      border-radius: 16px;
      padding: clamp(16px, 3.5vw, 28px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
    }
    .content-box > .container > .main > .content-box h2 {
      margin: 0 0 14px;
      font-size: clamp(18px, 2.6vw, 24px);
      color: var(--primary);
    }

    /* 필터 영역 */
    .filter-box {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin-bottom: 12px;
    }
    .filter-box label {
      display: grid;
      gap: 8px;
      grid-template-columns: auto minmax(130px, 160px) minmax(180px, 260px);
      align-items: center;
    }
    .filter-box label > select,
    .filter-box label > input {
      height: 40px;
      font-size: 14px;
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    .filter-box label > input:focus,
    .filter-box label > select:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    /* 검색 버튼 */
    .filter-box > button {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .filter-box > button:hover {
      filter: brightness(0.98);
    }

    /* 상태 라디오 그룹 */
    .status-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #111827;
      font-weight: 700;
    }
    .status-filter label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .status-filter input[type="radio"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* 우측 탈퇴 버튼 */
    .btn-delete {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 40%, #e5e7eb);
      background: #fff;
      color: var(--danger);
    }
    .btn-delete:hover {
      background: color-mix(in srgb, var(--danger) 6%, #fff);
    }

    /* 체크박스 톤 통일 */
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* 테이블 */
    .students-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    .students-table thead th {
      background: #f9fafb;
      font-weight: 700;
      font-size: 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
    }
    .students-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
      font-size: 14px;
    }
    .students-table tbody tr:last-child td {
      border-bottom: none;
    }
    .students-table tbody tr:hover {
      background: #fcfcfd;
    }

    /* 열 디테일 */
    .students-table td:nth-child(2) {
      width: 72px;
      text-align: center;
      color: #374151;
    } /* No */
    .students-table td:nth-child(5), /* 이메일 */
.students-table td:nth-child(6), /* 전화번호 */
.students-table td:nth-child(7) {
      /* 가입일 */
      font-variant-numeric: tabular-nums;
    }
    .students-table td:nth-child(3) a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }
    .students-table td:nth-child(3) a:hover {
      text-decoration: underline;
    }

    /* 배지 */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .badge-green {
      background: rgba(16, 185, 129, 0.12);
      color: #065f46;
    } /* 정상 */
    .badge-gray {
      background: rgba(107, 114, 128, 0.15);
      color: #374151;
    } /* 휴면 */
    .badge-red {
      background: rgba(220, 38, 38, 0.12);
      color: #7f1d1d;
    } /* 탈퇴 */

    /* 작은 화면 대응 */
    @media (max-width: 900px) {
      .filter-box {
        gap: 10px;
      }
    }
    @media (max-width: 780px) {
      .students-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        border-radius: 12px;
      }
      .btn-delete {
        flex: 1 1 auto;
      }
    }

    /* 접근성 */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-radius: 8px;
    }

    /* 프린트 최적화 */
    @media print {
      .topbar {
        position: static;
        border: none;
      }
      .container {
        min-height: auto;
      }
      .content-box.students-page {
        padding: 0;
      }
      .content-box > .container > .main > .content-box {
        box-shadow: none;
      }
    }
  </style>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="content-box students-page">
      <div class="container">
        <!-- 메인 -->
        <main class="main">
          <div class="content-box">
            <h2>학생 정보</h2>

            <!-- 검색 필터 + 탈퇴 버튼 -->
            <div class="filter-box">
              <label
                >소속:
                <select>
                  <option>- 전체 -</option>
                  <option>DW</option>
                  <option>JS</option>
                </select>
              </label>
              <label
                >검색:
                <select>
                  <option>- 전체 -</option>
                  <option>이름</option>
                  <option>아이디</option>
                </select>
                <input placeholder="검색어 입력" type="text" />
              </label>
              <button>검색</button>

              <div class="status-filter">
                상태:
                <label><input checked name="status" type="radio" /> 전체</label>
                <label><input name="status" type="radio" /> 정상</label>
                <label><input name="status" type="radio" /> 휴면</label>
                <label><input name="status" type="radio" /> 탈퇴</label>
              </div>

              <div style="margin-left: auto">
                <button class="btn-delete">🗑 선택 탈퇴</button>
              </div>
            </div>

            <!-- 학생 리스트 (Thymeleaf 적용) -->
            <table class="students-table">
              <thead>
                <tr>
                  <th><input id="checkAll" type="checkbox" /></th>
                  <th>No</th>
                  <th>아이디</th>
                  <th>이름</th>
                  <th>이메일</th>
                  <th>전화번호</th>
                  <th>가입일</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="student, stat : ${students}">
                  <td>
                    <input
                      class="row-check"
                      th:value="${student.id}"
                      type="checkbox"
                    />
                  </td>
                  <td th:text="${stat.count}"></td>
                  <td>
                    <a
                      th:href="@{'/admin/students/' + ${student.id}}"
                      th:text="${student.username}"
                    ></a>
                  </td>
                  <td th:text="${student.name}"></td>
                  <td th:text="${student.email}"></td>
                  <td th:text="${student.phone}"></td>
                  <td
                    th:text="${#temporals.format(student.createdAt, 'yyyy-MM-dd')}"
                  ></td>
                  <td>
                    <span class="badge badge-green" th:if="${student.active}"
                      >정상</span
                    >
                    <span
                      class="badge badge-gray"
                      th:if="${student.status == 'SLEEP'}"
                      >휴면</span
                    >
                    <span class="badge badge-red" th:if="${!student.active}"
                      >탈퇴</span
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
