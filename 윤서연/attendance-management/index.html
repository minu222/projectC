<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>출석 관리</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .search-box.attendance-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0 18px;
        white-space: nowrap;
      }
      .search-box.attendance-search input[type="text"],
      .search-box.attendance-search input[type="date"],
      .search-box.attendance-search select {
        height: 40px;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 10px;
        color: #e5f0ff;
        background: linear-gradient(
          180deg,
          rgba(22, 34, 74, 0.9),
          rgba(15, 26, 56, 0.9)
        );
        border: 1px solid rgba(84, 129, 255, 0.34);
        transition: box-shadow 0.15s ease, border-color 0.15s ease,
          transform 0.05s ease;
      }
      .search-box.attendance-search input[type="text"] {
        width: 200px;
      }
      .search-box.attendance-search input[type="date"] {
        width: 180px;
      }
      .search-box.attendance-search select {
        width: 140px;
      }

      .search-box.attendance-search :is(input, select):focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }

      /* Buttons */
      .btn-primary,
      .btn-secondary {
        height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        transition: transform 0.05s ease, box-shadow 0.15s ease,
          border-color 0.15s ease;
        border: 1px solid rgba(61, 122, 255, 0.4);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      }
      .btn-primary {
        color: #fff;
        background: radial-gradient(
            140px 60px at 80% -40%,
            rgba(61, 122, 255, 0.8),
            transparent 70%
          ),
          linear-gradient(180deg, #1b2f72, #142963);
      }
      .btn-secondary {
        color: #dbe7ff;
        background: radial-gradient(
            140px 60px at 80% -40%,
            rgba(120, 140, 200, 0.55),
            transparent 70%
          ),
          linear-gradient(180deg, #1a244a, #111a36);
        border-color: rgba(120, 140, 200, 0.4);
      }
      .btn-primary:hover,
      .btn-secondary:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
          0 0 24px rgba(61, 122, 255, 0.22);
      }
      .btn-primary:focus,
      .btn-secondary:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }

      /* Actions row */
      .actions-row.attendance-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 16px;
      }

      /* Table */
      .table-gap-top {
        margin-top: 6px;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        white-space: nowrap;
        background: linear-gradient(
          180deg,
          rgba(10, 17, 32, 0.65),
          rgba(16, 28, 64, 0.65)
        );
        border: 1px solid rgba(84, 129, 255, 0.3);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
          0 0 36px rgba(61, 122, 255, 0.08);
      }
      .data-table thead th {
        text-align: left;
        padding: 12px 14px;
        font-size: 14px;
        font-weight: 700;
        color: #bcd1ff;
        background: linear-gradient(
          180deg,
          rgba(32, 52, 110, 0.55),
          rgba(22, 36, 84, 0.3)
        );
        border-bottom: 1px solid rgba(84, 129, 255, 0.35);
      }
      .data-table td {
        padding: 12px 14px;
        font-size: 14px;
        color: #e4efff;
        border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .data-table tbody tr:last-child td {
        border-bottom: none;
      }
      .data-table tbody tr:hover {
        background: rgba(24, 182, 255, 0.06);
      }

      /* Inputs inside table */
      .data-table select,
      .data-table input[type="text"] {
        width: 100%;
        height: 36px;
        padding: 6px 10px;
        font-size: 13px;
        border-radius: 8px;
        color: #e5f0ff;
        background: linear-gradient(
          180deg,
          rgba(22, 34, 74, 0.9),
          rgba(15, 26, 56, 0.9)
        );
        border: 1px solid rgba(84, 129, 255, 0.34);
      }
      .data-table select:focus,
      .data-table input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--ring);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>출석 관리</h2>

          <div class="search-box attendance-search">
            <input type="text" placeholder="과정명" />
            <input type="date" />
            <button class="btn-primary">조회</button>
          </div>

          <table class="data-table table-gap-top" aria-label="출석 테이블">
            <colgroup>
              <col style="width: 72px" />
              <!-- NO -->
              <col />
              <!-- 학생 (가변) -->
              <col style="width: 200px" />
              <!-- 상태 -->
              <col style="width: 300px" />
              <!-- 비고 -->
            </colgroup>
            <thead>
              <tr>
                <th>NO</th>
                <th>학생</th>
                <th>상태</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>
                  <select>
                    <option>출석</option>
                    <option>지각</option>
                    <option>결석</option>
                  </select>
                </td>
                <td><input type="text" placeholder="사유" /></td>
              </tr>
              <!-- 필요 시 항목 반복 -->
            </tbody>
          </table>

          <div class="actions-row attendance-actions">
            <button class="btn-secondary">임시저장</button>
            <button class="btn-primary">출석 저장</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
