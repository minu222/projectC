<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>출석 관리</title>
    <link rel="stylesheet" href="/common.css" />
  </head>
  <style>
    /* 콘텐츠 박스 */

    .content-box h2 {
      margin: 0 0 14px;
      font-size: clamp(18px, 2.6vw, 24px);
      color: var(--primary);
    }

    /* 검색 박스: 자동 칼럼 그리드 */
    .search-box.attendance-search {
      display: grid;
      gap: 12px;
      margin: 8px 0 16px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .search-box.attendance-search input[type="text"],
    .search-box.attendance-search input[type="date"],
    .search-box.attendance-search .btn-primary {
      height: 42px;
      font-size: 14px;
      border-radius: 10px;
    }
    .search-box.attendance-search input[type="text"],
    .search-box.attendance-search input[type="date"] {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    .search-box.attendance-search input[type="text"]:focus,
    .search-box.attendance-search input[type="date"]:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    /* 버튼 */
    .btn-primary,
    .btn-secondary {
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      height: 42px;
    }
   
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #fff;
      border: 1px solid #e5e7eb;
      color: #111827;
    }
    .btn-secondary:hover {
      background: #f9fafb;
    }

    /* 테이블 */
    .table-gap-top {
      margin-top: 12px;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    .data-table thead th {
      background: #f9fafb;
      font-weight: 700;
      font-size: 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
    }
    .data-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
      font-size: 14px;
    }
    .data-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table tbody tr:hover {
      background: #fcfcfd;
    }

    /* 테이블 내부 폼 요소 크기 통일 */
    .data-table select,
    .data-table input[type="text"] {
      width: 100%;
      height: 38px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      padding: 6px 10px;
      background: #fff;
    }
    .data-table select:focus,
    .data-table input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    /* 작은 화면에서 테이블 가로 스크롤 허용 (HTML 변경 없이) */
    @media (max-width: 720px) {
      .data-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        border-radius: 12px;
      }
    }

    /* 액션 버튼 줄: 오른쪽 정렬, 좁아지면 스택 */
    .actions-row.attendance-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    @media (max-width: 560px) {
      .actions-row.attendance-actions {
        justify-content: stretch;
      }
      .actions-row.attendance-actions > * {
        flex: 1 1 auto;
      }
    }

    /* 접근성 보강 */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-radius: 8px;
    }

    /* 프린트 최적화(선택) */
    @media print {
      .topbar {
        position: static;
        border: none;
      }
      .container {
        min-height: auto;
      }
      .content-box {
        box-shadow: none;
      }
      .actions-row.attendance-actions {
        display: none;
      }
    }
  </style>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>출석 관리</h2>

          <div class="search-box attendance-search">
            <input type="text" placeholder="과정명" />
            <input type="date" />
            <button class="btn-primary">조회</button>
          </div>

          <table class="data-table table-gap-top">
            <thead>
              <tr>
                <th>NO</th>
                <th>학생</th>
                <th>상태</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>
                  <select>
                    <option>출석</option>
                    <option>지각</option>
                    <option>결석</option>
                  </select>
                </td>
                <td><input type="text" placeholder="사유" /></td>
              </tr>
            </tbody>
          </table>

          <div class="actions-row attendance-actions">
            <button class="btn-secondary">임시저장</button>
            <button class="btn-primary">출석 저장</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
