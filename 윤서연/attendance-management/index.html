<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>출석 관리</title>
    <link rel="stylesheet" href="/common.css" />

    <!-- 페이지 전용: 비반응형 고정 레이아웃 -->
    <style>
      .content-box h2 {
        margin: 0 0 14px;
        color: var(--primary);
        font-size: 22px;
      }

      /* 검색 박스: 한 줄 고정, 폭 고정 */
      .attendance-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
      }
      .attendance-search input[type="text"],
      .attendance-search input[type="date"],
      .attendance-search .btn-primary {
        height: 42px;
        font-size: 14px;
        border-radius: 10px;
      }
      .attendance-search input[type="text"],
      .attendance-search input[type="date"] {
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        background: #fff;
        width: 220px; /* 고정 폭 */
      }
      .attendance-search input[type="date"] {
        width: 180px;
      } /* 날짜 입력은 조금 좁게 */
      .attendance-search input:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
        border: none;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
      }
      .btn-secondary {
        background: #fff;
        border: 1px solid #e5e7eb;
        color: #111827;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
        border-radius: 10px;
        height: 42px;
      }
      .btn-secondary:hover {
        background: #f9fafb;
      }
      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* 테이블: 고정 레이아웃 + 잘림 */
      .data-table {
        width: 100%;
        table-layout: fixed; /* ★ 고정 레이아웃 */
        border-collapse: collapse;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        overflow: hidden;
        white-space: nowrap; /* 줄바꿈 금지 */
      }
      .data-table thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
      }
      .data-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .data-table tbody tr:last-child td {
        border-bottom: none;
      }
      .data-table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 테이블 내부 폼: 고정 크기 */
      .data-table select,
      .data-table input[type="text"] {
        width: 100%;
        height: 38px;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        padding: 6px 10px;
        background: #fff;
      }
      .data-table select:focus,
      .data-table input[type="text"]:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      .table-gap-top {
        margin-top: 12px;
      }

      /* 액션 버튼 행: 오른쪽 정렬, 한 줄 고정 */
      .attendance-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 14px;
        flex-wrap: nowrap;
      }

      /* 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>출석 관리</h2>

          <div class="search-box attendance-search">
            <input type="text" placeholder="과정명" />
            <input type="date" />
            <button class="btn-primary">조회</button>
          </div>

          <table class="data-table table-gap-top" aria-label="출석 테이블">
            <colgroup>
              <col style="width: 72px" />
              <!-- NO -->
              <col />
              <!-- 학생 (가변) -->
              <col style="width: 200px" />
              <!-- 상태 -->
              <col style="width: 300px" />
              <!-- 비고 -->
            </colgroup>
            <thead>
              <tr>
                <th>NO</th>
                <th>학생</th>
                <th>상태</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>
                  <select>
                    <option>출석</option>
                    <option>지각</option>
                    <option>결석</option>
                  </select>
                </td>
                <td><input type="text" placeholder="사유" /></td>
              </tr>
              <!-- 필요 시 항목 반복 -->
            </tbody>
          </table>

          <div class="actions-row attendance-actions">
            <button class="btn-secondary">임시저장</button>
            <button class="btn-primary">출석 저장</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
