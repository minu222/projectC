<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>메일 쓰기</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <style>
   

  

      /* 오버레이 */
      #mailPopup.popup-overlay {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        padding: 16px; /* 모바일에서 가장자리 여백 */
      }

      /* 팝업 컨테이너 */
      #mailPopup .popup {
        width: clamp(320px, 92vw, 900px);
        max-height: min(90vh, 860px);
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 헤더 */
      #mailPopup .popup-header {
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      #mailPopup .popup-header button {
        color: #fff;
        font-size: 22px;
        line-height: 1;
        border: none;
        background: transparent;
        cursor: pointer;
      }
      #mailPopup .popup-header button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 6px;
      }

      /* 본문 */
      #mailPopup .popup-body {
        padding: clamp(14px, 3vw, 20px);
        overflow: auto;
        flex: 1;
      }

      /* 공통 폼 */
      #mailPopup .form-group {
        margin-bottom: 16px;
      }
      #mailPopup .form-label {
        display: block;
        font-weight: 700;
        margin-bottom: 6px;
        color: #111827;
      }

      /* 받는사람 행 */
      #mailPopup .receiver-box {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr minmax(160px, 240px) auto;
        align-items: start;
      }
      #mailPopup #receiverList.receiver-list {
        min-height: 44px;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fafafa;
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      }
      #mailPopup .receiver-tag {
        background: var(--primary);
        color: #fff;
        padding: 6px 10px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      #mailPopup .receiver-tag button {
        color: #fff;
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 14px;
      }
      #mailPopup #receiverInput {
        height: 44px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
      }
      #mailPopup #receiverInput:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      #mailPopup .address-book-btn {
        height: 44px;
        padding: 0 14px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
      }
      #mailPopup .address-book-btn:hover {
        filter: brightness(0.98);
      }

      /* 제목 행 */
      #mailPopup .title-box {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr minmax(160px, 260px);
      }
      #mailPopup .title-box input,
      #mailPopup .title-box select {
        height: 42px;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
        font-size: 14px;
      }
      #mailPopup .title-box input:focus,
      #mailPopup .title-box select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      /* 파일 첨부 드롭존 */
      #mailPopup #fileDrop.file-drop-area {
        border: 2px dashed #cbd5e1;
        border-radius: 12px;
        background: #f9fafb;
        text-align: center;
        padding: 22px;
        color: #475569;
        cursor: pointer;
      }
      /* 드래그중 표시 (JS에서 class "is-dragover" 토글해 사용) */
      #mailPopup #fileDrop.is-dragover {
        background: #eff6ff;
        border-color: #93c5fd;
        color: #1e3a8a;
      }

      /* 에디터 */
      #mailPopup .editor-toolbar {
        border: 1px solid #e5e7eb;
        border-bottom: none;
        padding: 8px;
        background: #f3f4f6;
        border-radius: 10px 10px 0 0;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      #mailPopup .editor-toolbar button,
      #mailPopup .editor-toolbar select {
        height: 34px;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #e5e7eb;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
      }
      #mailPopup .editor-toolbar button:hover {
        background: #f9fafb;
      }
      #mailPopup .editor {
        min-height: 300px;
        border: 1px solid #e5e7eb;
        border-radius: 0 0 10px 10px;
        padding: 12px;
        background: #fff;
        outline: none;
      }
      #mailPopup .editor:focus {
        box-shadow: 0 0 0 4px var(--ring);
      }

      /* 제출 버튼 */
      #mailPopup .btn-submit {
        margin-top: 16px;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        font-size: 15px;
      }
      #mailPopup .btn-submit:hover {
        filter: brightness(0.98);
      }

      /* 배지 (다른 페이지와 톤 맞춤; 필요시 재사용) */
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.normal {
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      }
      .badge.done {
        background: rgba(99, 102, 241, 0.12);
        color: #1e1b4b;
      }
      .badge.cancel {
        background: rgba(239, 68, 68, 0.12);
        color: #7f1d1d;
      }

      /* 반응형 */
      @media (max-width: 860px) {
        #mailPopup .receiver-box {
          grid-template-columns: 1fr 1fr auto;
        }
        #mailPopup .title-box {
          grid-template-columns: 1fr 200px;
        }
      }
      @media (max-width: 640px) {
        #mailPopup.popup-overlay {
          padding: 10px;
        }
        #mailPopup .receiver-box {
          grid-template-columns: 1fr;
        }
        #mailPopup .address-book-btn {
          justify-self: start;
        }
        #mailPopup .title-box {
          grid-template-columns: 1fr;
        }
        #mailPopup .btn-submit {
          width: 100%;
        }
      }

      /* 접근성 */
      #mailPopup :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }

      /* 프린트 시 팝업 숨김 (선택) */
      @media print {
        #mailPopup {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <!-- 메일쓰기 팝업 -->
    <div class="popup-overlay" id="mailPopup">
      <div class="popup">
        <div class="popup-header">
          메일 쓰기
          <button onclick="closePopup()">&times;</button>
        </div>
        <div class="popup-body">
          <!-- 받는사람 -->
          <div class="form-group">
            <label class="form-label">받는사람</label>
            <div class="receiver-box">
              <div id="receiverList" class="receiver-list"></div>
              <input
                type="text"
                id="receiverInput"
                placeholder="이메일 입력 후 Enter"
              />
              <button
                type="button"
                class="address-book-btn"
                onclick="openAddressBook()"
              >
                <i class="fa-solid fa-book"></i> 주소록
              </button>
            </div>
          </div>

          <!-- 제목 -->
          <div class="form-group">
            <label class="form-label">제목</label>
            <div class="title-box">
              <input type="text" placeholder="제목 입력" />
              <select>
                <option value="">템플릿 선택</option>
                <option>공지사항 안내</option>
                <option>업데이트 안내</option>
                <option>이벤트 초대</option>
              </select>
            </div>
          </div>

          <!-- 파일첨부 -->
          <div class="form-group">
            <label class="form-label">파일첨부</label>
            <div id="fileDrop" class="file-drop-area">
              파일을 끌어오거나 클릭하여 업로드하세요.
            </div>
          </div>

          <!-- 내용 -->
          <div class="form-group">
            <label class="form-label">내용</label>
            <div class="editor-toolbar">
              <select
                onchange="document.execCommand('fontSize',false,this.value)"
              >
                <option value="3">14px</option>
                <option value="4">18px</option>
                <option value="5">24px</option>
              </select>
              <button onclick="document.execCommand('bold',false,'')">
                <b>B</b>
              </button>
              <button onclick="document.execCommand('italic',false,'')">
                <i>I</i>
              </button>
              <button onclick="document.execCommand('underline',false,'')">
                <u>U</u>
              </button>
              <button
                onclick="document.execCommand('insertUnorderedList',false,'')"
              >
                <i class="fa fa-list-ul"></i>
              </button>
              <button
                onclick="document.execCommand('insertOrderedList',false,'')"
              >
                <i class="fa fa-list-ol"></i>
              </button>
              <button
                onclick="document.execCommand('createLink',false,prompt('링크 URL'))"
              >
                <i class="fa fa-link"></i>
              </button>
              <button
                onclick="document.execCommand('insertImage',false,prompt('이미지 URL'))"
              >
                <i class="fa fa-image"></i>
              </button>
            </div>
            <div class="editor" contenteditable="true">
              여기에 내용을 입력하세요...
            </div>
          </div>

          <!-- 버튼 -->
          <button class="btn-submit">메일 보내기</button>
        </div>
      </div>
    </div>
  </body>
</html>
