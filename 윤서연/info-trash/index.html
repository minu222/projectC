<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy - 정보 휴지통</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>정보 휴지통</h2>

          <!-- 필터 -->
          <div class="filter-box">
            <label>
              검색:
              <select aria-label="검색 조건">
                <option>- 전체 -</option>
                <option>이름</option>
                <option>아이디</option>
                <option>구분</option>
              </select>
              <input
                type="text"
                placeholder="검색어 입력"
                aria-label="검색어 입력"
              />
            </label>
            <button class="rjator">검색</button>

            <div style="margin-left: auto">
              <button class="btn-restore">
                <p class="rjator">♻ 선택 복원</p>
              </button>
            </div>
          </div>

          <!-- 표 -->
          <table class="trash-table" aria-label="삭제된 정보 목록">
            <colgroup>
              <col class="col-chk" />
              <col class="col-no" />
              <col class="col-type" />
              <col class="col-id" />
              <col class="col-name" />
              <col class="col-email" />
              <col class="col-phone" />
              <col class="col-del" />
              <col class="col-exp" />
              <col class="col-status" />
            </colgroup>
            <thead>
              <tr>
                <th>
                  <input
                    id="checkAll"
                    type="checkbox"
                    aria-label="전체 선택(시각적)"
                  />
                </th>
                <th>No</th>
                <th>구분</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>삭제일</th>
                <th>삭제 예정일</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <!-- 서버 데이터 -->
              <tr th:each="item, stat : ${trashList}">
                <td>
                  <input
                    class="row-check"
                    th:value="${item.id}"
                    type="checkbox"
                  />
                </td>
                <td th:text="${stat.count}">1</td>
                <td th:text="${item.userType}">강사</td>
                <td th:text="${item.refId}">teacher01</td>
                <td th:text="${item.name}">김민수</td>
                <td th:text="${item.email}">user@dw.com</td>
                <td th:text="${item.phone}">010-1234-5678</td>
                <td
                  class="num muted"
                  th:text="${#temporals.format(item.deletedAt, 'yyyy-MM-dd')}"
                >
                  2025-09-01
                </td>
                <td
                  class="num muted"
                  th:text="${#temporals.format(item.expiresAt, 'yyyy-MM-dd')}"
                >
                  2025-09-30
                </td>
                <td><span class="badge-red">탈퇴</span></td>
              </tr>

              <!-- 예시 행 -->
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td>2</td>
                <td>학생</td>
                <td>user02</td>
                <td>이영희</td>
                <td>lee@example.com</td>
                <td>010-2222-3333</td>
                <td class="num muted">2025-09-05</td>
                <td class="num muted">2025-10-04</td>
                <td><span class="badge-red">탈퇴</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
