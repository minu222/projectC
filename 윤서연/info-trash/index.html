<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy - 정보 휴지통</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <style>
    /* =========================
   필터 박스
   ========================= */
    .filter-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 16px;
      padding: 14px;
      background: var(--card);
      border: 1px solid rgba(84, 129, 255, 0.26);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .filter-box label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #bcd1ff;
      font-size: 13px;
      font-weight: 600;
    }
    .filter-box select,
    .filter-box input[type="text"] {
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .filter-box select {
      width: 140px;
    }
    .filter-box input[type="text"] {
      width: 220px;
    }
    .filter-box button {
      height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .filter-box :is(select, input, button):focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 선택 복원 버튼(보조 강조) */
    .btn-restore {
      color: #dff7ee;
      border: 1px solid rgba(80, 200, 170, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(80, 200, 170, 0.55),
          transparent 70%
        ),
        linear-gradient(180deg, #173b37, #102b29);
    }
    .filter-box button:hover,
    .btn-restore:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }

    /* =========================
   표
   ========================= */
    .trash-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.65),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.3);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }

    /* colgroup 기반 열 폭 */
    .trash-table col.col-chk {
      width: 52px;
    }
    .trash-table col.col-no {
      width: 72px;
    }
    .trash-table col.col-type {
      width: 100px;
    }
    .trash-table col.col-id {
      width: 140px;
    }
    .trash-table col.col-name {
      width: 120px;
    }
    .trash-table col.col-email {
      width: 220px;
    }
    .trash-table col.col-phone {
      width: 150px;
    }
    .trash-table col.col-del {
      width: 140px;
    }
    .trash-table col.col-exp {
      width: 150px;
    }
    .trash-table col.col-status {
      width: 100px;
    }

    .trash-table thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #bcd1ff;
      background: linear-gradient(
        180deg,
        rgba(32, 52, 110, 0.55),
        rgba(22, 36, 84, 0.3)
      );
      border-bottom: 1px solid rgba(84, 129, 255, 0.35);
    }
    .trash-table thead th:first-child {
      text-align: center;
    }

    .trash-table td {
      padding: 12px 14px;
      font-size: 14px;
      color: #e4efff;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trash-table tbody tr:last-child td {
      border-bottom: none;
    }
    .trash-table tbody tr:hover {
      background: rgba(24, 182, 255, 0.06);
    }

    /* 숫자/희미톤 */
    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .muted {
      color: #a7b9da;
    }

    /* 체크박스 & 선택 행 하이라이트 */
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #3d7aff;
      filter: drop-shadow(0 0 6px rgba(61, 122, 255, 0.3));
    }
    tbody tr:has(.row-check:checked) {
      background: rgba(61, 122, 255, 0.12);
      box-shadow: inset 0 0 0 9999px rgba(61, 122, 255, 0.08);
    }
    tbody tr:has(.row-check:checked) td {
      border-bottom-color: rgba(84, 129, 255, 0.5);
    }

    /* 상태 배지 (탈퇴) */
    .badge-red {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid currentColor;
      color: #ff6b8a;
      background: rgba(255, 91, 124, 0.12);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
    }

    /* 포커스 보조 */
    button:focus,
    a:focus,
    select:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>정보 휴지통</h2>

          <!-- 필터 -->
          <div class="filter-box">
            <label>
              검색:
              <select aria-label="검색 조건">
                <option>- 전체 -</option>
                <option>이름</option>
                <option>아이디</option>
                <option>구분</option>
              </select>
              <input
                type="text"
                placeholder="검색어 입력"
                aria-label="검색어 입력"
              />
            </label>
            <button>검색</button>

            <div style="margin-left: auto">
              <button class="btn-restore">♻ 선택 복원</button>
            </div>
          </div>

          <!-- 표 -->
          <table class="trash-table" aria-label="삭제된 정보 목록">
            <colgroup>
              <col class="col-chk" />
              <col class="col-no" />
              <col class="col-type" />
              <col class="col-id" />
              <col class="col-name" />
              <col class="col-email" />
              <col class="col-phone" />
              <col class="col-del" />
              <col class="col-exp" />
              <col class="col-status" />
            </colgroup>
            <thead>
              <tr>
                <th>
                  <input
                    id="checkAll"
                    type="checkbox"
                    aria-label="전체 선택(시각적)"
                  />
                </th>
                <th>No</th>
                <th>구분</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>삭제일</th>
                <th>삭제 예정일</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <!-- 서버 데이터 -->
              <tr th:each="item, stat : ${trashList}">
                <td>
                  <input
                    class="row-check"
                    th:value="${item.id}"
                    type="checkbox"
                  />
                </td>
                <td th:text="${stat.count}">1</td>
                <td th:text="${item.userType}">강사</td>
                <td th:text="${item.refId}">teacher01</td>
                <td th:text="${item.name}">김민수</td>
                <td th:text="${item.email}">user@dw.com</td>
                <td th:text="${item.phone}">010-1234-5678</td>
                <td
                  class="num muted"
                  th:text="${#temporals.format(item.deletedAt, 'yyyy-MM-dd')}"
                >
                  2025-09-01
                </td>
                <td
                  class="num muted"
                  th:text="${#temporals.format(item.expiresAt, 'yyyy-MM-dd')}"
                >
                  2025-09-30
                </td>
                <td><span class="badge-red">탈퇴</span></td>
              </tr>

              <!-- 예시 행 -->
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td>2</td>
                <td>학생</td>
                <td>user02</td>
                <td>이영희</td>
                <td>lee@example.com</td>
                <td>010-2222-3333</td>
                <td class="num muted">2025-09-05</td>
                <td class="num muted">2025-10-04</td>
                <td><span class="badge-red">탈퇴</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
