<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy - 정보 휴지통</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/common.css" />
    <style>
      /* 제목 */
      .content-box h2 {
        margin: 0 0 14px;
        color: var(--primary);
        font-size: 22px;
      }

      /* ===== 필터 바: 비반응형(줄바꿈 금지) ===== */
      .filter-box {
        display: flex;
        align-items: end;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: nowrap;
      }
      .filter-box label {
        display: grid;
        gap: 8px;
        align-items: center;
        grid-template-columns: auto 140px 240px; /* 레이블 / 셀렉트 / 인풋 고정폭 */
      }
      .filter-box label > select,
      .filter-box label > input {
        height: 40px;
        font-size: 14px;
        border-radius: 10px;
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      .filter-box label > input:focus,
      .filter-box label > select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      .filter-box > button,
      .btn-restore {
        height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        font-weight: 800;
        cursor: pointer;
        font-size: 14px;
      }
      .filter-box > button {
        border: none;
        background: var(--primary);
        color: #fff;
      }
      .filter-box > button:hover {
        filter: brightness(0.98);
      }
      .btn-restore {
        border: 1px solid color-mix(in srgb, var(--primary) 40%, #e5e7eb);
        background: #fff;
        color: var(--primary);
      }
      .btn-restore:hover {
        background: color-mix(in srgb, var(--primary) 6%, #fff);
      }

      /* 체크박스 톤 */
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      /* ===== 표: 고정 레이아웃 + 줄바꿈 금지 ===== */
      .trash-table {
        width: 100%;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        white-space: nowrap;
      }
      .trash-table thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        color: #0f172a;
      }
      .trash-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .trash-table tbody tr:last-child td {
        border-bottom: none;
      }
      .trash-table tbody tr:nth-child(odd) {
        background: #fafafa;
      }
      .trash-table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 열 폭 고정 */
      .col-chk {
        width: 48px;
      }
      .col-no {
        width: 72px;
        text-align: center;
        color: #374151;
      }
      .col-type {
        width: 90px;
      }
      .col-id {
        width: 160px;
      }
      .col-name {
        width: 120px;
      }
      .col-email {
        width: 240px;
      }
      .col-phone {
        width: 160px;
      }
      .col-del {
        width: 140px;
      }
      .col-exp {
        width: 140px;
      }
      .col-status {
        width: 100px;
      }

      /* 숫자/날짜 등폭 */
      .num {
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: #374151;
      }

      /* 상태 배지 */
      .badge-red {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        background: rgba(220, 38, 38, 0.12);
        color: #7f1d1d;
      }

      /* 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>정보 휴지통</h2>

          <!-- 필터 -->
          <div class="filter-box">
            <label>
              검색:
              <select aria-label="검색 조건">
                <option>- 전체 -</option>
                <option>이름</option>
                <option>아이디</option>
                <option>구분</option>
              </select>
              <input
                type="text"
                placeholder="검색어 입력"
                aria-label="검색어 입력"
              />
            </label>
            <button>검색</button>

            <div style="margin-left: auto">
              <button class="btn-restore">♻ 선택 복원</button>
            </div>
          </div>

          <!-- 표 -->
          <table class="trash-table" aria-label="삭제된 정보 목록">
            <colgroup>
              <col class="col-chk" />
              <col class="col-no" />
              <col class="col-type" />
              <col class="col-id" />
              <col class="col-name" />
              <col class="col-email" />
              <col class="col-phone" />
              <col class="col-del" />
              <col class="col-exp" />
              <col class="col-status" />
            </colgroup>
            <thead>
              <tr>
                <th>
                  <input
                    id="checkAll"
                    type="checkbox"
                    aria-label="전체 선택(시각적)"
                  />
                </th>
                <th>No</th>
                <th>구분</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>삭제일</th>
                <th>삭제 예정일</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <!-- 서버 데이터 -->
              <tr th:each="item, stat : ${trashList}">
                <td>
                  <input
                    class="row-check"
                    th:value="${item.id}"
                    type="checkbox"
                  />
                </td>
                <td th:text="${stat.count}">1</td>
                <td th:text="${item.userType}">강사</td>
                <td th:text="${item.refId}">teacher01</td>
                <td th:text="${item.name}">김민수</td>
                <td th:text="${item.email}">user@dw.com</td>
                <td th:text="${item.phone}">010-1234-5678</td>
                <td
                  class="num muted"
                  th:text="${#temporals.format(item.deletedAt, 'yyyy-MM-dd')}"
                >
                  2025-09-01
                </td>
                <td
                  class="num muted"
                  th:text="${#temporals.format(item.expiresAt, 'yyyy-MM-dd')}"
                >
                  2025-09-30
                </td>
                <td><span class="badge-red">탈퇴</span></td>
              </tr>

              <!-- 예시 행 -->
              <tr>
                <td><input class="row-check" type="checkbox" /></td>
                <td>2</td>
                <td>학생</td>
                <td>user02</td>
                <td>이영희</td>
                <td>lee@example.com</td>
                <td>010-2222-3333</td>
                <td class="num muted">2025-09-05</td>
                <td class="num muted">2025-10-04</td>
                <td><span class="badge-red">탈퇴</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
