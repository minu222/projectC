<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>시험 문제 관리</title>
    <link rel="stylesheet" href="/common.css" />
  </head>
  <style>
    /* 검색 박스: 입력/셀렉트/버튼 4개가 자연스럽게 접힘 */
    .search-box.exam-search {
      display: grid;
      gap: 12px;
      margin: 8px 0 16px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .search-box.exam-search input[type="text"],
    .search-box.exam-search select,
    .search-box.exam-search .btn-search,
    .search-box.exam-search .btn-submit {
      height: 42px;
      font-size: 14px;
      border-radius: 10px;
    }
    .search-box.exam-search input[type="text"],
    .search-box.exam-search select {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    .search-box.exam-search input[type="text"]:focus,
    .search-box.exam-search select:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }
    .btn-search {
      padding: 10px 14px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-search:hover {
      background: #f9fafb;
    }
    .btn-submit {
      padding: 10px 14px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 표 */
    .data-table.exam-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    .data-table.exam-table thead th {
      background: #f9fafb;
      font-weight: 700;
      font-size: 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
    }
    .data-table.exam-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
      font-size: 14px;
      vertical-align: top;
    }
    .data-table.exam-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table.exam-table tbody tr:hover {
      background: #fcfcfd;
    }

    /* 열 디테일 */
    .exam-table td:nth-child(1) {
      width: 72px;
      text-align: center;
      color: #374151;
    }
    .exam-table td:nth-child(2) {
      overflow-wrap: anywhere;
    }
    /* 유형/난이도 살짝 강조 (칩 느낌) */
    .exam-table td:nth-child(3),
    .exam-table td:nth-child(4) {
      font-weight: 700;
      color: #1f2937;
      background: #f8fafc;
      border-radius: 999px;
      text-align: center;
    }
    /* 칩처럼 보이도록 내부 여백 — 셀에 직접 패딩을 주면 칩이 너무 커지므로 content-box로 보정 */
    .exam-table td:nth-child(3),
    .exam-table td:nth-child(4) {
      padding: 8px 14px;
      background-clip: padding-box;
    }

    /* 관리 링크: 편집/삭제 구분 색상 */
    .exam-table td:last-child a {
      text-decoration: none;
      font-weight: 700;
    }
    .exam-table td:last-child a:first-child {
      color: var(--primary);
    }
    .exam-table td:last-child a:last-child {
      color: var(--danger);
    }
    .exam-table td:last-child a:hover {
      text-decoration: underline;
    }

    /* 작은 화면: HTML 수정 없이 가로 스크롤 */
    @media (max-width: 720px) {
      .data-table.exam-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        border-radius: 12px;
      }
      .btn-submit {
        width: 100%;
      }
    }

    /* 접근성 */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-radius: 8px;
    }

    /* 프린트 최적화(선택) */
    @media print {
      .topbar {
        position: static;
        border: none;
      }
      .container {
        min-height: auto;
      }
      .content-box {
        box-shadow: none;
      }
    }
  </style>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>시험 문제 관리</h2>

          <div class="search-box exam-search">
            <input type="text" placeholder="과정/키워드" />
            <select>
              <option>객관식</option>
              <option>주관식</option>
            </select>
            <button class="btn-search">검색</button>
            <button class="btn-submit">문항 추가</button>
          </div>

          <table class="data-table exam-table">
            <thead>
              <tr>
                <th>NO</th>
                <th>문항</th>
                <th>유형</th>
                <th>난이도</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>JSP의 역할은?</td>
                <td>객관식</td>
                <td>중</td>
                <td><a href="#">수정</a> | <a href="#">삭제</a></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
