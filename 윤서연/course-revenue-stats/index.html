<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>과정 매출 통계</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .search-box.sales-course-search {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 18px;
      white-space: nowrap;
    }
    .search-box.sales-course-search input[type="text"] {
      width: 260px;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box.sales-course-search input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }
    .btn-search {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .btn-search:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .btn-search:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* === 차트 컨테이너 === */
    .chart-container.sales-course-chart {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 12px;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.6),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.25);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .chart-container.sales-course-chart::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0.55;
      background: linear-gradient(
          transparent 39px,
          rgba(54, 86, 170, 0.28) 40px
        ),
        linear-gradient(90deg, transparent 39px, rgba(54, 86, 170, 0.28) 40px);
      background-size: 40px 40px, 40px 40px;
    }
    .chart-container.sales-course-chart > canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* 포커스 보조 */
    button:focus,
    input:focus {
      outline: none;
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>과정 매출 통계</h2>

          <div class="search-box sales-course-search">
            <input type="text" placeholder="과정명" aria-label="과정명" />
            <button class="btn-search" aria-label="조회">조회</button>
          </div>

          <div class="chart-container sales-course-chart">
            <canvas
              id="courseChart"
              aria-label="과정 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
