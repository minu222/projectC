<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>과정 매출 통계</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <link rel="stylesheet" href="/style.css" /> <link rel="stylesheet" href="/menu.css" />

  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>과정 매출 통계</h2>

          <div class="search-box sales-course-search">
            <input type="text" placeholder="과정명" aria-label="과정명" />
            <button class="btn-search" aria-label="조회">조회</button>
          </div>

          <div class="chart-container sales-course-chart">
            <canvas
              id="courseChart"
              aria-label="과정 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
