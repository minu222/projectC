<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>과정 매출 통계</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/common.css" />
    <style>
      /* 제목 */
      .content-box h2 {
        margin: 0 0 14px;
        color: var(--primary);
        font-size: 22px;
      }

      /* ===== 검색 박스: 비반응형 · 한 줄 고정 ===== */
      .sales-course-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 16px;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
      }
      .sales-course-search input[type="text"],
      .sales-course-search .btn-search {
        height: 42px;
        font-size: 14px;
        border-radius: 10px;
      }
      .sales-course-search input[type="text"] {
        width: 320px;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      .sales-course-search input[type="text"]:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .sales-course-search .btn-search {
        padding: 0 14px;
        border: 1px solid #e5e7eb;
        background: #fff;
        color: #111827;
        font-weight: 700;
        cursor: pointer;
      }
      .sales-course-search .btn-search:hover {
        background: #f9fafb;
      }

      /* ===== 차트 컨테이너: 고정 크기(비반응형) + 그리드 배경 ===== */
      .sales-course-chart {
        position: relative;
        width: 100%;
        height: 520px; /* ★ 고정 높이 */
        border-radius: 12px;
        overflow: hidden;
        background: repeating-linear-gradient(
            to right,
            #f3f4f6 0,
            #f3f4f6 1px,
            transparent 1px,
            transparent 40px
          ),
          repeating-linear-gradient(
            to bottom,
            #f3f4f6 0,
            #f3f4f6 1px,
            transparent 1px,
            transparent 40px
          );
        border: 1px dashed #e5e7eb;
      }
      .sales-course-chart > canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }

      /* 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>과정 매출 통계</h2>

          <div class="search-box sales-course-search">
            <input type="text" placeholder="과정명" aria-label="과정명" />
            <button class="btn-search" aria-label="조회">조회</button>
          </div>

          <div class="chart-container sales-course-chart">
            <canvas
              id="courseChart"
              aria-label="과정 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
