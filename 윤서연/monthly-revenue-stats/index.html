<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>월별 매출 통계</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <link rel="stylesheet" href="/style.css" /> <link rel="stylesheet" href="/menu.css" />

  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>월별 매출 통계</h2>

          <div class="search-box sales-monthly-search">
            <input type="number" placeholder="연도(예: 2025)" />
            <button class="btn-primary">조회</button>
          </div>

          <div class="chart-container">
            <canvas
              id="monthlyChart"
              aria-label="월별 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
