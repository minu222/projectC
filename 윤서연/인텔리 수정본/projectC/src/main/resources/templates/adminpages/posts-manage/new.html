<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/adminpages/css/style.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/menu.css}">
</head>

<body>
<div th:replace="adminpages/menu :: menu"></div>
    <main class="main">
    <div class="content-box">
    <h2>새 글 작성</h2>
    <form th:action="@{/admin/posts-manage/new}" method="post">
        <div>
            <label for="title">제목:</label>
            <input type="text" id="title" name="title" th:value="${post.title}" required/>
        </div>
        <div>
            <label for="category">카테고리:</label>
            <select id="category" name="category" th:value="${post.category}" required>
                <option value="FREE">자유</option>
                <option value="NOTICE">공지</option>
            </select>
        </div>
        <div>
            <label for="content">내용:</label>
            <textarea id="content" name="content" rows="10" th:text="${post.content}" required></textarea>
        </div>
        <div>
            <button type="submit">등록</button>
            <a th:href="@{/admin/posts-manage}">취소</a>
        </div>
    </form>
    </div>
    </main>
    </div>
</body>
</html>
