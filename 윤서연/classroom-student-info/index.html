<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/adminpages/css/style.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/menu.css}">
</head>

<body>
<div th:replace="adminpages/menu :: menu"></div>
    <main class="main">
        <div class="content-box">
            <h2>강의실 학생 정보</h2>

            <!-- 강의실 검색 -->
            <div class="search-box classroom-students-search">
                <form th:action="@{/admin/classrooms/students}" method="get">
                    <input type="text" name="courseId" placeholder="강의실 코드" />
                    <button class="btn-search" type="submit">조회</button>
                </form>
            </div>

            <!-- 학생 목록 테이블 -->
            <table class="data-table classroom-students-table">
                <thead>
                <tr>
                    <th>NO</th>
                    <th>학생명</th>
                    <th>연락처</th>
                    <th>상태</th>
                    <th>수강신청일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, i : ${students}">
                    <td th:text="${i.index + 1}"></td>
                    <td th:text="${student.name}"></td>
                    <td th:text="${student.phone}"></td>
                    <td>
                      <span class="badge"
                             th:classappend="${student.status == 'active'} ? ' normal' :
                                           (${student.status == 'suspended'} ? ' warning' : ' deleted')"
                             th:text="${student.status == 'active' ? '재학' :
                               (student.status == 'suspended' ? '정지' : '탈퇴')}">
                      </span>
                    </td>
                    <td th:text="${#temporals.format(student.enrolledAt, 'yyyy-MM-dd')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
