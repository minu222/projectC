<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강의실 학생 정보</title>
  </head>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ==== 검색 박스 ==== */
    .search-box.classroom-students-search {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 18px;
      white-space: nowrap;
    }
    .search-box.classroom-students-search input[type="text"] {
      width: 220px;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box.classroom-students-search input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }
    .btn-search {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .btn-search:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .btn-search:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* ==== 테이블 ==== */
    .data-table.classroom-students-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.65),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.3);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .classroom-students-table thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #bcd1ff;
      background: linear-gradient(
        180deg,
        rgba(32, 52, 110, 0.55),
        rgba(22, 36, 84, 0.3)
      );
      border-bottom: 1px solid rgba(84, 129, 255, 0.35);
    }
    .classroom-students-table td {
      padding: 12px 14px;
      font-size: 14px;
      color: #e4efff;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .classroom-students-table tbody tr:last-child td {
      border-bottom: none;
    }
    .classroom-students-table tbody tr:hover {
      background: rgba(24, 182, 255, 0.06);
    }

    /* 상태 배지 */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid currentColor;
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
    }
    .badge.normal {
      background: rgba(42, 216, 155, 0.12);
      color: #1fc493;
    } /* 재학 */
    .badge.done {
      background: rgba(99, 102, 241, 0.12);
      color: #8aa0ff;
    } /* 수료 */

    /* 숫자/정렬 보조 (원하면 사용) */
    td:nth-child(1) {
      text-align: center;
      width: 72px;
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>강의실 학생 정보</h2>

          <div class="search-box classroom-students-search">
            <input type="text" placeholder="강의실 코드" />
            <button class="btn-search">조회</button>
          </div>

          <table class="data-table classroom-students-table">
            <thead>
              <tr>
                <th>NO</th>
                <th>학생명</th>
                <th>연락처</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>010-1234-5678</td>
                <td><span class="badge normal">재학</span></td>
              </tr>
              <tr>
                <td>2</td>
                <td>이영희</td>
                <td>010-2222-3333</td>
                <td><span class="badge done">수료</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
