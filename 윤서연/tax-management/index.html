<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>세금 관리</title>
    <link rel="stylesheet" href="/common.css" />
  </head>
  <style>
    /* 검색 박스 */
    .search-box.taxes-search {
      display: grid;
      gap: 12px;
      margin: 8px 0 16px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }
    .search-box.taxes-search input[type="number"],
    .search-box.taxes-search select,
    .search-box.taxes-search .btn-search {
      height: 42px;
      font-size: 14px;
      border-radius: 10px;
    }
    .search-box.taxes-search input[type="number"],
    .search-box.taxes-search select {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    .search-box.taxes-search input[type="number"]:focus,
    .search-box.taxes-search select:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    .btn-search:hover {
      background: #f9fafb;
    }

    /* number 스핀 제거(브라우저 일관화) */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* 표 스타일 */
    .data-table.taxes-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }
    .data-table.taxes-table thead th {
      background: #f9fafb;
      font-weight: 700;
      font-size: 14px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
    }
    .data-table.taxes-table td {
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 14px;
      font-size: 14px;
    }
    .data-table.taxes-table tbody tr:last-child td {
      border-bottom: none;
    }
    .data-table.taxes-table tbody tr:hover {
      background: #fcfcfd;
    }

    /* 금액 열 우측 정렬 + 등폭 숫자 */
    .taxes-table td:nth-child(2) {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* 합계/세액 강조 (마지막 행 = 예상세액) */
    .taxes-table tbody tr:last-child td {
      background: #fffdf7;
      font-weight: 800;
    }

    /* 하단 액션 버튼 */
    .form-actions.taxes-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .btn-reset,
    .btn-submit {
      height: 42px;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-reset {
      background: #fff;
      border: 1px solid #e5e7eb;
      color: #111827;
    }
    .btn-reset:hover {
      background: #f9fafb;
    }
    .btn-submit {
      border: none;
      background: var(--primary);
      color: #fff;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 작은 화면 대응 */
    @media (max-width: 720px) {
      .data-table.taxes-table {
        display: block;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        border-radius: 12px;
      }
      .btn-reset,
      .btn-submit {
        flex: 1 1 auto;
      }
    }

    /* 접근성 */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-radius: 8px;
    }

    /* 프린트 최적화 */
    @media print {
      .topbar {
        position: static;
        border: none;
      }
      .container {
        min-height: auto;
      }
      .content-box {
        box-shadow: none;
      }
      .form-actions.taxes-actions {
        display: none;
      }
    }
  </style>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>세금 관리</h2>

          <div class="search-box taxes-search">
            <input type="number" placeholder="연도" />
            <select>
              <option>분기 선택</option>
              <option>1분기</option>
              <option>2분기</option>
              <option>3분기</option>
              <option>4분기</option>
            </select>
            <button class="btn-search">조회</button>
          </div>

          <table class="data-table taxes-table">
            <thead>
              <tr>
                <th>구분</th>
                <th>금액</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>매출합계</td>
                <td>₩25,000,000</td>
                <td>-</td>
              </tr>
              <tr>
                <td>공제/비용</td>
                <td>₩5,000,000</td>
                <td>강의실, 장비</td>
              </tr>
              <tr>
                <td>과세표준</td>
                <td>₩20,000,000</td>
                <td>-</td>
              </tr>
              <tr>
                <td>예상세액</td>
                <td>₩2,200,000</td>
                <td>추정</td>
              </tr>
            </tbody>
          </table>

          <div class="form-actions taxes-actions">
            <button class="btn-reset">엑셀 내보내기</button>
            <button class="btn-submit">신고서 미리보기</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
