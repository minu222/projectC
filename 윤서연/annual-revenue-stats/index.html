<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>연별 매출 통계</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/common.css" />
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>연별 매출 통계</h2>

          <div class="search-box sales-yearly-search">
            <input type="number" placeholder="시작연도(예: 2021)" />
            <input type="number" placeholder="종료연도(예: 2025)" />
            <button class="btn-primary">조회</button>
          </div>

          <div class="chart-container">
            <canvas id="yearlyChart"></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
