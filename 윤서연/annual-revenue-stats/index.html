<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>연별 매출 통계</title>

    <!-- 페이지 전용 최소 스타일 -->
  </head>
  <link rel="stylesheet" href="/style.css" />
  <style>
 
    /* 타이틀/보조문구 */
    .content-box h2 {
      margin: 0 0 14px;
      color: #e6f1ff;
      text-shadow: 0 0 22px rgba(24, 182, 255, 0.2);
    }
    .content-box .helper {
      margin: 0 0 18px;
      color: #bcd1ff;
      font-size: 14px;
    }

    /* 검색 박스 */
    .search-box.sales-yearly-search {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      white-space: nowrap;
    }
    .search-box.sales-yearly-search input[type="number"] {
      width: 200px;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: box-shadow 0.15s ease, transform 0.05s ease,
        border-color 0.15s ease;
    }
    .search-box.sales-yearly-search input[type="number"]:focus {
      outline: none;
      border-color: #3d7aff;
      box-shadow: 0 0 0 3px rgba(61, 122, 255, 0.22),
        0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 버튼 */
    .btn-primary {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .btn-primary:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(61, 122, 255, 0.22),
        0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 차트 컨테이너 */
    .chart-container {
      position: relative;
      width: 100%;
      height: 420px;
      border-radius: 12px;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.6),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.25);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .chart-container::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0.55;
      background: linear-gradient(
          transparent 39px,
          rgba(54, 86, 170, 0.28) 40px
        ),
        linear-gradient(90deg, transparent 39px, rgba(54, 86, 170, 0.28) 40px);
      background-size: 40px 40px, 40px 40px;
      background-position: 0 0, 0 0;
    }
    .chart-container > canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* 포커스 보조 */
    button:focus,
    input:focus {
      outline: none;
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>연별 매출 통계</h2>
          <p class="helper">
            조회 구간의 연도별 매출 추이를 확인합니다. (예시 데이터)
          </p>

          <div class="search-box sales-yearly-search">
            <input
              id="startYear"
              type="number"
              placeholder="시작연도(예: 2021)"
            />
            <input
              id="endYear"
              type="number"
              placeholder="종료연도(예: 2025)"
            />
            <button id="btnQuery" class="btn-primary">조회</button>
          </div>

          <div class="chart-container">
            <canvas
              id="yearlyChart"
              aria-label="연도별 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
