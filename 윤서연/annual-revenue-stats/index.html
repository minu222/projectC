<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>연별 매출 통계</title>

    <!-- 전역 공통 CSS만 사용 -->
    <link rel="stylesheet" href="/common.css" />

    <!-- 페이지 전용 최소 스타일 -->
    <style>
      .content-box h2 {
        margin: 0 0 14px;
        color: var(--primary);
        font-size: 22px;
      }
      .content-box p.helper {
        margin: 6px 0 14px;
        color: var(--muted);
        font-size: 14px;
      }

      /* 검색 박스: 한 줄 고정, 입력 폭 고정 */
      .sales-yearly-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
      }
      .sales-yearly-search input[type="number"],
      .sales-yearly-search button {
        height: 42px;
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 10px;
      }
      .sales-yearly-search input[type="number"] {
        width: 220px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      .sales-yearly-search input[type="number"]:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }
      .sales-yearly-search .btn-primary {
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
      .sales-yearly-search .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* 차트 컨테이너: 고정 높이(비반응형) */
      .chart-container {
        position: relative;
        width: 100%;
        height: 420px;
        background: repeating-linear-gradient(
            to right,
            #f3f4f6 0,
            #f3f4f6 1px,
            transparent 1px,
            transparent 40px
          ),
          repeating-linear-gradient(
            to bottom,
            #f3f4f6 0,
            #f3f4f6 1px,
            transparent 1px,
            transparent 40px
          );
        border: 1px dashed #e5e7eb;
        border-radius: 12px;
      }
      .chart-container::after {
        content: "데이터 준비되면 차트가 표시됩니다";
        position: absolute;
        right: 12px;
        bottom: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .chart-container > canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>연별 매출 통계</h2>
          <p class="helper">
            조회 구간의 연도별 매출 추이를 확인합니다. (예시 데이터)
          </p>

          <div class="search-box sales-yearly-search">
            <input
              id="startYear"
              type="number"
              placeholder="시작연도(예: 2021)"
            />
            <input
              id="endYear"
              type="number"
              placeholder="종료연도(예: 2025)"
            />
            <button id="btnQuery" class="btn-primary">조회</button>
          </div>

          <div class="chart-container">
            <canvas
              id="yearlyChart"
              aria-label="연도별 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
