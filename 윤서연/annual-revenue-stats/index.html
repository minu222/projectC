<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>연별 매출 통계</title>

    <!-- 페이지 전용 최소 스타일 -->
  </head>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/menu.css" />

  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>연별 매출 통계</h2>
          <p class="helper">
            조회 구간의 연도별 매출 추이를 확인합니다. (예시 데이터)
          </p>

          <div class="search-box sales-yearly-search">
            <input
              id="startYear"
              type="number"
              placeholder="시작연도(예: 2021)"
            />
            <input
              id="endYear"
              type="number"
              placeholder="종료연도(예: 2025)"
            />
            <button id="btnQuery" class="btn-primary">조회</button>
          </div>

          <div class="chart-container">
            <canvas
              id="yearlyChart"
              aria-label="연도별 매출 차트"
              role="img"
            ></canvas>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
