<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>쿠폰 관리</title>
  </head>
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* ========== 검색 박스 ========== */
    .search-box.coupons-search {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 18px;
      white-space: nowrap;
    }
    .search-box.coupons-search input[type="text"],
    .search-box.coupons-search select {
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 10px;
      color: #e5f0ff;
      background: linear-gradient(
        180deg,
        rgba(22, 34, 74, 0.9),
        rgba(15, 26, 56, 0.9)
      );
      border: 1px solid rgba(84, 129, 255, 0.34);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-box.coupons-search input[type="text"] {
      width: 220px;
    }
    .search-box.coupons-search select {
      width: 140px;
    }

    .search-box.coupons-search :is(input, select):focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* 버튼 (검색/쿠폰 생성 공용) */
    .btn-primary {
      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      color: #fff;
      border: 1px solid rgba(61, 122, 255, 0.4);
      background: radial-gradient(
          140px 60px at 80% -40%,
          rgba(61, 122, 255, 0.8),
          transparent 70%
        ),
        linear-gradient(180deg, #1b2f72, #142963);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.05s ease, box-shadow 0.15s ease;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
        0 0 24px rgba(61, 122, 255, 0.22);
    }
    .btn-primary:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
    }

    /* ========== 테이블 ========== */
    .table-gap-top {
      margin-top: 6px;
    }

    .data-table.coupons-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
      background: linear-gradient(
        180deg,
        rgba(10, 17, 32, 0.65),
        rgba(16, 28, 64, 0.65)
      );
      border: 1px solid rgba(84, 129, 255, 0.3);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
        0 0 36px rgba(61, 122, 255, 0.08);
    }
    .coupons-table thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #bcd1ff;
      background: linear-gradient(
        180deg,
        rgba(32, 52, 110, 0.55),
        rgba(22, 36, 84, 0.3)
      );
      border-bottom: 1px solid rgba(84, 129, 255, 0.35);
    }
    .coupons-table td {
      padding: 12px 14px;
      font-size: 14px;
      color: #e4efff;
      border-bottom: 1px dashed rgba(84, 129, 255, 0.26);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coupons-table tbody tr:last-child td {
      border-bottom: none;
    }
    .coupons-table tbody tr:hover {
      background: rgba(24, 182, 255, 0.06);
    }

    /* 열 폭 미세 조정 (colgroup 클래스 기반) */
    .coupons-table col.code {
      width: 200px;
    }
    .coupons-table col.name {
      width: 220px;
    }
    .coupons-table col.rate {
      width: 100px;
    }
    .coupons-table col.period {
      width: 280px;
    }
    .coupons-table col.state {
      width: 120px;
    }

    /* 상태 배지 */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid currentColor;
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
    }
    .badge.normal {
      background: rgba(42, 216, 155, 0.12);
      color: #1fc493;
    } /* 사용가능 */
    .badge.ended {
      background: rgba(255, 91, 124, 0.12);
      color: #ff6b8a;
    } /* 종료 */
    .badge.soon {
      background: rgba(255, 200, 91, 0.12);
      color: #ffb347;
    } /* 임박 */

    /* 숫자 서식 (할인율 열에 탭형 숫자 적용하면 깔끔) */
    .coupons-table td:nth-child(3) {
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    /* 포커스 보조 */
    button:focus,
    select:focus,
    input:focus {
      outline: none;
    }
  </style>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>쿠폰 관리</h2>

          <div class="search-box coupons-search">
            <input type="text" placeholder="쿠폰코드/이름" />
            <select>
              <option>전체</option>
              <option>사용가능</option>
              <option>종료</option>
            </select>
            <button class="btn-primary">검색</button>
            <button class="btn-primary">쿠폰 생성</button>
          </div>

          <table
            class="data-table table-gap-top coupons-table"
            aria-label="쿠폰 목록"
          >
            <colgroup>
              <col class="code" />
              <col class="name" />
              <col class="rate" />
              <col class="period" />
              <col class="state" />
            </colgroup>
            <thead>
              <tr>
                <th>쿠폰코드</th>
                <th>이름</th>
                <th>할인율</th>
                <th>기간</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>WELCOME10</td>
                <td>신규 10%</td>
                <td>10%</td>
                <td>2025-01-01 ~ 2025-12-31</td>
                <td><span class="badge normal">사용가능</span></td>
              </tr>
              <!-- 예시 추가 -->
              <tr>
                <td>SPRING15</td>
                <td>봄맞이 15%</td>
                <td>15%</td>
                <td>2025-03-01 ~ 2025-04-30</td>
                <td><span class="badge ended">종료</span></td>
              </tr>
              <tr>
                <td>WEEKEND5</td>
                <td>주말 5%</td>
                <td>5%</td>
                <td>2025-09-01 ~ 2025-09-30</td>
                <td><span class="badge soon">임박</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
