<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>쿠폰 관리</title>
    <link rel="stylesheet" href="/common.css" />
    <style>
      /* 제목 */
      .content-box h2 {
        margin: 0 0 14px;
        color: var(--primary);
        font-size: 22px;
      }

      /* ===== 검색 박스: 비반응형 · 한 줄 고정 ===== */
      .coupons-search {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 16px;
        flex-wrap: nowrap; /* 줄바꿈 금지 */
      }
      .coupons-search input[type="text"],
      .coupons-search select,
      .coupons-search .btn-primary {
        height: 42px;
        font-size: 14px;
        border-radius: 10px;
      }
      .coupons-search input[type="text"],
      .coupons-search select {
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        background: #fff;
      }
      /* 고정 폭 */
      .coupons-search input[type="text"] {
        width: 240px;
      }
      .coupons-search select {
        width: 140px;
      }
      .coupons-search .btn-primary {
        padding: 0 14px;
        border: none;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }
      .coupons-search .btn-primary:hover {
        filter: brightness(0.98);
      }
      .coupons-search input[type="text"]:focus,
      .coupons-search select:focus {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      .btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* ===== 표: 고정 레이아웃(잘림 허용) ===== */
      .table-gap-top {
        margin-top: 12px;
      }
      .coupons-table {
        width: 100%;
        table-layout: fixed; /* ★ 고정 레이아웃 */
        border-collapse: separate;
        border-spacing: 0;
        background: #fff;
        border-radius: 14px;
        overflow: hidden;
        white-space: nowrap; /* 줄바꿈 방지 */
      }
      .coupons-table thead th {
        background: #f9fafb;
        font-weight: 700;
        font-size: 14px;
        text-align: left;
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
      }
      .coupons-table td {
        border-bottom: 1px solid #e5e7eb;
        padding: 12px 14px;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: middle;
      }
      .coupons-table tbody tr:last-child td {
        border-bottom: none;
      }
      .coupons-table tbody tr:hover {
        background: #fcfcfd;
      }

      /* 열 폭 고정 */
      .coupons-table col.code {
        width: 160px;
      }
      .coupons-table col.name {
        width: 220px;
      }
      .coupons-table col.rate {
        width: 100px;
      }
      .coupons-table col.period {
        width: 260px;
      }
      .coupons-table col.state {
        width: 120px;
      }

      /* 숫자/날짜 가독성 */
      .coupons-table td:nth-child(3), /* 할인율 */
      .coupons-table td:nth-child(4) {
        /* 기간 */
        font-variant-numeric: tabular-nums;
      }
      .coupons-table td:nth-child(3) {
        text-align: right;
      }

      /* 배지 (상태) */
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }
      .badge.normal {
        background: rgba(16, 185, 129, 0.12);
        color: #065f46;
      } /* 사용가능 */
      .badge.ended {
        background: rgba(107, 114, 128, 0.15);
        color: #374151;
      } /* 종료 */
      .badge.soon {
        background: rgba(245, 158, 11, 0.15);
        color: #8a4b00;
      } /* 임박 */

      /* 접근성 */
      :focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>

    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>쿠폰 관리</h2>

          <div class="search-box coupons-search">
            <input type="text" placeholder="쿠폰코드/이름" />
            <select>
              <option>전체</option>
              <option>사용가능</option>
              <option>종료</option>
            </select>
            <button class="btn-primary">검색</button>
            <button class="btn-primary">쿠폰 생성</button>
          </div>

          <table
            class="data-table table-gap-top coupons-table"
            aria-label="쿠폰 목록"
          >
            <colgroup>
              <col class="code" />
              <col class="name" />
              <col class="rate" />
              <col class="period" />
              <col class="state" />
            </colgroup>
            <thead>
              <tr>
                <th>쿠폰코드</th>
                <th>이름</th>
                <th>할인율</th>
                <th>기간</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>WELCOME10</td>
                <td>신규 10%</td>
                <td>10%</td>
                <td>2025-01-01 ~ 2025-12-31</td>
                <td><span class="badge normal">사용가능</span></td>
              </tr>
              <!-- 예시 추가 -->
              <tr>
                <td>SPRING15</td>
                <td>봄맞이 15%</td>
                <td>15%</td>
                <td>2025-03-01 ~ 2025-04-30</td>
                <td><span class="badge ended">종료</span></td>
              </tr>
              <tr>
                <td>WEEKEND5</td>
                <td>주말 5%</td>
                <td>5%</td>
                <td>2025-09-01 ~ 2025-09-30</td>
                <td><span class="badge soon">임박</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
