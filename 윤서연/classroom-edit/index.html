<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강의실 수정</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      /* Search row */
      .search-box.classroom-edit-search {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 12px 0 18px;
        white-space: nowrap;
      }
      .search-box.classroom-edit-search input[type="text"] {
        width: 260px;
        height: 40px;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 10px;
        color: #e5f0ff;
        background: linear-gradient(
          180deg,
          rgba(22, 34, 74, 0.9),
          rgba(15, 26, 56, 0.9)
        );
        border: 1px solid rgba(84, 129, 255, 0.34);
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .search-box.classroom-edit-search input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }
      .btn-search {
        height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        color: #fff;
        border: 1px solid rgba(61, 122, 255, 0.4);
        background: radial-gradient(
            140px 60px at 80% -40%,
            rgba(61, 122, 255, 0.8),
            transparent 70%
          ),
          linear-gradient(180deg, #1b2f72, #142963);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        transition: transform 0.05s ease, box-shadow 0.15s ease;
      }
      .btn-search:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
          0 0 24px rgba(61, 122, 255, 0.22);
      }
      .btn-search:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }

      /* Form wrapper (카드) */
      .classroom-edit-form {
        display: block;
        padding: 18px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid rgba(84, 129, 255, 0.26);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45),
          0 0 36px rgba(61, 122, 255, 0.08);
      }

      /* 첫 줄: 2열 그룹 */
      .classroom-edit-form > div:first-child {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 14px;
      }

      /* 라벨 + 인풋 공통 */
      .classroom-edit-form label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
        color: #bcd1ff;
        font-weight: 600;
      }

      /* 인풋/텍스트에어리어 */
      .form-input,
      .classroom-edit-form input[type="text"],
      .classroom-edit-form input[type="number"],
      .form-textarea,
      .classroom-edit-form textarea {
        width: 100%;
        padding: 10px 12px;
        font-size: 14px;
        color: #e5f0ff;
        border-radius: 10px;
        background: linear-gradient(
          180deg,
          rgba(22, 34, 74, 0.9),
          rgba(15, 26, 56, 0.9)
        );
        border: 1px solid rgba(84, 129, 255, 0.34);
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .form-textarea,
      .classroom-edit-form textarea {
        resize: none;
        line-height: 1.5;
      }

      /* 포커스 */
      .classroom-edit-form :is(input, textarea):focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }

      /* 비고(풀 폭) */
      .full-row {
        grid-column: 1 / -1;
      }

      /* Actions */
      .form-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 12px;
      }
      .btn-reset,
      .btn-submit {
        height: 40px;
        padding: 0 16px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 800;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        transition: transform 0.05s ease, box-shadow 0.15s ease,
          border-color 0.15s ease;
      }

      /* 삭제(보조/경고 톤) */
      .btn-reset {
        color: #ffdbe4;
        background: radial-gradient(
            140px 60px at 80% -40%,
            rgba(255, 120, 150, 0.55),
            transparent 70%
          ),
          linear-gradient(180deg, #3a1a2a, #2a1220);
        border: 1px solid rgba(255, 120, 150, 0.4);
      }
      .btn-reset:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
          0 0 24px rgba(255, 120, 150, 0.22);
      }
      .btn-reset:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 120, 150, 0.25),
          0 0 18px rgba(255, 120, 150, 0.18);
      }

      /* 저장(주요) */
      .btn-submit {
        color: #fff;
        background: radial-gradient(
            140px 60px at 80% -40%,
            rgba(61, 122, 255, 0.8),
            transparent 70%
          ),
          linear-gradient(180deg, #1b2f72, #142963);
        border: 1px solid rgba(61, 122, 255, 0.4);
      }
      .btn-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35),
          0 0 24px rgba(61, 122, 255, 0.22);
      }
      .btn-submit:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring), 0 0 18px rgba(24, 182, 255, 0.18);
      }

      /* Table-like spacing helpers (없어도 무방) */
      .helper-note {
        color: #9cb4dc;
        font-size: 13px;
      }
    </style>
    <!-- 페이지 전용(최소) -->
  </head>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>강의실 수정</h2>

          <div class="search-box classroom-edit-search">
            <input type="text" placeholder="강의실 코드 검색" />
            <button class="btn-search">조회</button>
          </div>

          <form class="classroom-edit-form">
            <div>
              <label>
                강의실 코드
                <input type="text" value="A-101" class="form-input" />
              </label>
              <label>
                수용 인원
                <input type="number" value="30" class="form-input" />
              </label>
            </div>

            <label class="full-row">
              비고
              <textarea rows="6" class="form-textarea">
프로젝터, 화이트보드</textarea
              >
            </label>

            <div class="form-actions">
              <button type="button" class="btn-reset">삭제</button>
              <button type="submit" class="btn-submit">수정 저장</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
