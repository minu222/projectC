<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>강의실 수정</title>
    <link rel="stylesheet" href="/common.css" />
  </head>
  <style>
    /* 검색 박스 */

    .search-box.classroom-edit-search input[type="text"],
    .search-box.classroom-edit-search .btn-search {
      height: 42px;
      font-size: 14px;
      border-radius: 10px;
    }
    .search-box.classroom-edit-search input[type="text"] {
      padding: 10px 12px;
      border: 1px solid #e5e7eb;
      background: #fff;
    }
    .search-box.classroom-edit-search input[type="text"]:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }
    .btn-search {
      padding: 0 14px;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-search:hover {
      background: #f9fafb;
    }

    /* 폼 레이아웃 */
    .classroom-edit-form {
      display: flex;
      gap: 14px 16px;

      flex-direction: column;
    }
    .classroom-edit-form > div {
      display: flex;
      gap: 14px 16px;
    }
    .classroom-edit-form label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }
    .classroom-edit-form .full-row {
      grid-column: 1 / -1;
    }

    /* 입력 요소 */
    .form-input,
    .form-textarea {
      width: 100%;
      border: 1px solid #e5e7eb;
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      font-size: 14px;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .form-input {
      height: 42px;
      padding: 10px 12px;
    }
    .form-textarea {
      padding: 10px 12px;
      resize: vertical;
    }
    .form-input::placeholder,
    .form-textarea::placeholder {
      color: #9ca3af;
    }
    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-color: #cbd5e1;
    }

    /* number 스핀 제거 */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    /* 액션 버튼 */
    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .btn-submit,
    .btn-reset {
      height: 42px;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-submit {
      border: none;
      background: var(--primary);
      color: #fff;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-reset {
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--danger) 40%, #e5e7eb);
      color: var(--danger);
    }
    .btn-reset:hover {
      background: color-mix(in srgb, var(--danger) 5%, #fff);
    }

    /* 반응형 */
    @media (max-width: 680px) {
      .search-box.classroom-edit-search {
        grid-template-columns: 1fr;
      }
      .classroom-edit-form {
        grid-template-columns: 1fr;
      }
      .form-actions {
        justify-content: stretch;
      }
      .form-actions > * {
        flex: 1 1 auto;
      }
    }

    /* 접근성 */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
      border-radius: 8px;
    }

    /* 프린트 최적화(선택) */
    @media print {
      .topbar {
        position: static;
        border: none;
      }
      .container {
        min-height: auto;
      }
      .content-box {
        box-shadow: none;
      }
      .form-actions {
        display: none;
      }
    }
  </style>
  <body>
    <header class="topbar">
      <div>DW Academy</div>
    </header>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>강의실 수정</h2>

          <div class="search-box classroom-edit-search">
            <input type="text" placeholder="강의실 코드 검색" />
            <button class="btn-search">조회</button>
          </div>

          <form class="classroom-edit-form">
            <div>
              <label>
                강의실 코드
                <input type="text" value="A-101" class="form-input" />
              </label>
              <label>
                수용 인원
                <input type="number" value="30" class="form-input" />
              </label>
            </div>
            <label class="full-row">
              비고
              <textarea rows="6" class="form-textarea">
프로젝터, 화이트보드</textarea
              >
            </label>

            <div class="form-actions">
              <button type="button" class="btn-reset">삭제</button>
              <button type="submit" class="btn-submit">수정 저장</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
