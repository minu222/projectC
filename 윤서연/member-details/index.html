<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="UTF-8" />
    <title>회원 관리 (마스터 · 디테일)</title>
  </head>
  <link rel="stylesheet" href="/style.css" />

  <body>
    <div class="container">
      <main class="main">
        <div class="two-col">
          <!-- ========== LEFT: 목록 ========== -->
          <section class="list-col card">
            <div class="card-header">
              <h2 class="card-title">회원 관리</h2>
              <div class="actions">
                <a class="btn-line" th:href="@{/messages/write}"> 메일 쓰기 </a>
                <a class="btn-line btn-primary" th:href="@{/admin/members/new}">
                  신규 등록
                </a>
                <button class="btn-line btn-danger" type="button">
                  선택 탈퇴
                </button>
              </div>
            </div>

            <div class="card-body">
              <form class="filters" method="get" th:action="@{/admin/members}">
                <div class="filters-left">
                  <label class="only-select">
                    소속:
                    <select name="group">
                      <option value="">- 전체 -</option>
                      <option value="DW">DW</option>
                      <option value="JS">JS</option>
                    </select>
                  </label>

                  <label>
                    검색:
                    <select name="type">
                      <option value="">- 전체 -</option>
                      <option value="name">이름</option>
                      <option value="username">아이디</option>
                      <option value="email">이메일</option>
                    </select>
                    <input
                      type="text"
                      name="keyword"
                      placeholder="검색어 입력"
                    />
                  </label>

                  <button type="submit">검색</button>
                </div>
              </form>

              <div class="table-wrap">
                <div class="table-scroller">
                  <table class="member-table" aria-label="회원 목록">
                    <thead>
                      <tr>
                        <th><input id="checkAll" type="checkbox" /></th>
                        <th class="col-no">No</th>
                        <th>아이디</th>
                        <th>이름</th>
                        <th class="col-email">이메일</th>
                        <th class="col-phone">전화번호</th>
                        <th class="col-date">가입일</th>
                        <th>상태</th>
                        <th class="col-actions">관리</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Thymeleaf 데이터 -->
                      <tr th:each="member, stat : ${members}">
                        <td>
                          <input
                            class="row-check"
                            th:value="${member.id}"
                            type="checkbox"
                          />
                        </td>
                        <td class="col-no" th:text="${stat.count}">1</td>
                        <td class="member-id">
                          <a
                            th:href="@{/admin/members/{id}(id=${member.id})}"
                            th:text="${member.username}"
                            >user01</a
                          >
                        </td>
                        <td th:text="${member.name}">홍길동</td>
                        <td class="col-email" th:text="${member.email}">
                          user01@example.com
                        </td>
                        <td class="col-phone" th:text="${member.phone}">
                          010-1234-5678
                        </td>
                        <td
                          class="col-date"
                          th:text="${#dates.format(member.createdAt,'yyyy-MM-dd')}"
                        >
                          2025-09-01
                        </td>
                        <td>
                          <span
                            class="badge green"
                            th:if="${member.status == '정상'}"
                            >정상</span
                          >
                          <span
                            class="badge gray"
                            th:if="${member.status == '휴면'}"
                            >휴면</span
                          >
                          <span
                            class="badge red"
                            th:if="${member.status == '탈퇴'}"
                            >탈퇴</span
                          >
                        </td>
                        <td class="col-actions">
                          <a th:href="@{/admin/members/{id}(id=${member.id})}"
                            >상세</a
                          >
                          <span> | </span>
                          <a
                            th:href="@{/admin/members/{id}/edit(id=${member.id})}"
                            >수정</a
                          >
                        </td>
                      </tr>

                      <!-- 정적 예시 -->
                      <tr>
                        <td><input class="row-check" type="checkbox" /></td>
                        <td class="col-no">1</td>
                        <td class="member-id"><a href="#">user01</a></td>
                        <td>홍길동</td>
                        <td class="col-email">user01@example.com</td>
                        <td class="col-phone">010-1234-5678</td>
                        <td class="col-date">2025-09-01</td>
                        <td><span class="badge green">정상</span></td>
                        <td class="col-actions">
                          <a href="#">상세</a> <span> | </span>
                          <a href="#">수정</a>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>

          <!-- ========== RIGHT: 상세 ======== -->
          <aside class="detail-col">
            <div class="detail-card">
              <div class="detail-head">
                <h3 class="detail-title">회원 상세</h3>
                <span
                  class="empty"
                  th:text="${selectedMember != null ? ('ID: ' + selectedMember.username) : '선택된 회원 없음'}"
                  >선택된 회원 없음</span
                >
              </div>

              <form th:if="${selectedMember != null}">
                <div class="detail-body">
                  <div class="form-grid">
                    <div class="form-row">
                      <label>이름</label>
                      <input
                        class="input"
                        name="name"
                        th:value="${selectedMember.name}"
                      />
                    </div>
                    <div class="form-row">
                      <label>아이디</label>
                      <input
                        class="input readonly"
                        name="username"
                        th:value="${selectedMember.username}"
                        readonly
                      />
                    </div>

                    <div class="form-row">
                      <label>구분(권한)</label>
                      <select
                        class="select"
                        name="role"
                        th:value="${selectedMember.role}"
                      >
                        <option value="USER">일반 회원</option>
                        <option value="TEACHER">강사</option>
                        <option value="ADMIN">관리자</option>
                      </select>
                    </div>
                    <div class="form-row">
                      <label>회원 상태</label>
                      <select
                        class="select"
                        name="status"
                        th:value="${selectedMember.status}"
                      >
                        <option value="정상">정상</option>
                        <option value="휴면">휴면</option>
                        <option value="탈퇴">탈퇴</option>
                        <option value="수료">수료</option>
                      </select>
                    </div>

                    <div class="form-row">
                      <label>이메일</label>
                      <input
                        class="input"
                        name="email"
                        th:value="${selectedMember.email}"
                      />
                    </div>
                    <div class="form-row">
                      <label>휴대전화</label>
                      <input
                        class="input"
                        name="phone"
                        th:value="${selectedMember.phone}"
                      />
                    </div>
                    <div class="form-row">
                      <label>유선전화</label>
                      <input
                        class="input"
                        name="tel"
                        th:value="${selectedMember.tel}"
                      />
                    </div>
                    <div class="form-row two">
                      <label>주소</label>
                      <input
                        class="input"
                        name="address"
                        th:value="${selectedMember.address}"
                      />
                    </div>

                    <div class="form-row">
                      <label>로그인 실패횟수</label>
                      <div class="inline-actions">
                        <input
                          class="input readonly"
                          name="loginFailCount"
                          th:value="${selectedMember.loginFailCount + '회'}"
                          readonly
                        />
                        <button type="button" class="btn-sm btn-unlock">
                          풀어주기
                        </button>
                      </div>
                    </div>
                    <div class="form-row">
                      <label>비밀번호</label>
                      <div class="inline-actions">
                        <input
                          class="input readonly"
                          value="********"
                          readonly
                        />
                        <button type="button" class="btn-sm btn-reset">
                          비밀번호 초기화
                        </button>
                      </div>
                    </div>

                    <div class="form-row two">
                      <label>메모</label>
                      <textarea
                        class="textarea"
                        name="memo"
                        th:text="${selectedMember.memo}"
                      ></textarea>
                    </div>

                    <div class="form-row">
                      <label>가입일</label>
                      <input
                        class="input readonly"
                        th:value="${#dates.format(selectedMember.createdAt,'yyyy-MM-dd HH:mm')}"
                        readonly
                      />
                    </div>
                    <div class="form-row">
                      <label>최근접속일</label>
                      <input
                        class="input readonly"
                        th:value="${#dates.format(selectedMember.lastLogin,'yyyy-MM-dd HH:mm')}"
                        readonly
                      />
                    </div>
                  </div>
                </div>
                <div class="detail-footer">
                  <button type="reset" class="btn btn-close">비우기</button>
                  <button type="submit" class="btn btn-save">저장</button>
                </div>
              </form>

              <div class="detail-body" th:if="${selectedMember == null}">
                <p class="empty">
                  왼쪽 목록에서 <strong>상세</strong>를 클릭하면 정보가 여기에
                  표시됩니다.
                </p>
              </div>
            </div>
          </aside>
        </div>
      </main>
    </div>
  </body>
</html>
