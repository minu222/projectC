spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.0.25:3306/project?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    username: project
    password: admin
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      keepaliveTime: 30000       # 오래된/죽은 연결 방지 (Boot가 카멜/케밥 둘 다 매핑)
      idleTimeout: 300000
      maxLifetime: 600000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none               # 기존 정책 유지

