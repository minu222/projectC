<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.9" />
  <title>회원가입 | MyLMS</title>
  <link rel="stylesheet" href="/css/signup.css" />
</head>
<body>
<header>
  <div class="logo">MyLMS</div>
</header>

<div class="signup-container">
  <div class="signup-box">
    <h3>회원가입</h3>

    <!-- ★ 폼에 id 부여 -->
    <form id="signupForm" action="/api/auth/signup" method="post" accept-charset="UTF-8" autocomplete="on">

      <!-- 아이디 -->
      <div class="input-group">
        <label for="userid">아이디</label>
        <input type="text" id="userid" name="userid" placeholder="아이디 입력" />
        <small id="idMsg" class="field-msg"></small>
      </div>

      <!-- ★ 이메일(필수) -->
      <div class="input-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="이메일 입력" />
      </div>

      <!-- 비밀번호 -->
      <div class="input-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력" />
        <small id="pwMsg" class="field-msg"></small>
      </div>

      <!-- 비밀번호 확인 -->
      <div class="input-group">
        <label for="password2">비밀번호 확인</label>
        <input type="password" id="password2" name="password2" placeholder="비밀번호 확인" />
      </div>

      <!-- 성명 -->
      <div class="input-group">
        <label for="name">성명</label>
        <input type="text" id="name" name="name" placeholder="성명 입력" />
      </div>

      <!-- 생년월일 -->
      <div class="input-group">
        <label for="birth">생년월일</label>
        <input type="date" id="birth" name="birth" />
      </div>

      <!-- 성별 -->
      <div class="input-group">
        <label>성별</label>
        <div class="gender-group">
          <button type="button" class="gender-btn" data-gender="남자">남자</button>
          <button type="button" class="gender-btn" data-gender="여자">여자</button>
        </div>
        <!-- ★ 서버로 보낼 숨김 필드 -->
        <input type="hidden" id="gender" name="gender" value="" />
      </div>

      <!-- 주소 -->
      <div class="input-group">
        <label for="address">주소</label>
        <input type="text" id="address" name="address" placeholder="주소 입력" />
      </div>

      <!-- 상세주소 -->
      <div class="input-group">
        <label for="detailAddress">상세주소</label>
        <input type="text" id="detailAddress" name="detailAddress" placeholder="상세주소 입력" />
      </div>

      <!-- 휴대폰 -->
      <div class="input-group">
        <label for="phone">휴대폰</label>
        <input type="tel" id="phone" name="phone" placeholder="010-1234-5678"
               inputmode="numeric" pattern="[0-9\-]{9,13}" />
      </div>

      <!-- 회원 구분 -->
      <div class="input-group">
        <label>회원 구분</label>
        <div class="role-group" id="roleGroup" role="group" aria-label="회원 구분">
          <button type="button" class="role-btn active" data-role="student">회원</button>
          <button type="button" class="role-btn" data-role="instructor">강사</button>
        </div>
        <input type="hidden" id="role" name="role" value="student">
      </div>

      <!-- 강사 전용 입력 -->
      <div id="teacherFields" style="display:none;">
        <div class="input-group">
          <label for="affiliation">소속</label>
          <input type="text" id="affiliation" name="affiliation" placeholder="소속 입력" />
        </div>

        <div class="input-group">
          <label for="intro">자기소개</label>
          <div class="memo-box">
            <textarea id="intro" name="intro" placeholder="자기소개를 입력하세요..."></textarea>
          </div>
        </div>

        <div class="input-group">
          <label>경력</label>
          <div id="careerList"></div>
          <button type="button" class="add-career-btn">+ 경력 추가</button>
        </div>
      </div>

      <!-- 수신동의 -->
      <div class="input-group">
        <label>수신 동의</label>
        <div class="agree-options">
          <label class="agree-box">
            <input type="checkbox" name="noteAgree" />
            <span class="checkmark"></span>
            <span class="agree-label">쪽지 수신 동의</span>
          </label>
          <label class="agree-box">
            <input type="checkbox" name="emailAgree" />
            <span class="checkmark"></span>
            <span class="agree-label">이메일 수신 동의</span>
          </label>
        </div>
      </div>

      <button type="submit" class="signup-btn">회원가입</button>
      <div class="options"><a href="/">취소</a></div>
      <!-- (선택) 오류 메시지 박스 -->
      <p id="signupError" class="error" style="display:none;"></p>
    </form>
  </div>
</div>

<script src="/js/signup.js" defer></script>
</body>
</html>
