<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | MyLMS</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<header>
  <a class="logo" href="/">MyLMS</a>
</header>

<div class="login-container">
  <div class="login-box">
    <h2>로그인</h2>
    <form id="loginForm" action="/api/auth/login" method="post" accept-charset="UTF-8" autocomplete="on">
      <div class="input-group">
        <label for="id">아이디(닉네임)</label>
        <input type="text" id="id" name="id"
               placeholder="아이디(닉네임) 입력"
               pattern="[A-Za-z0-9]{4,20}" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력"> <!-- name 추가 -->
      </div>
      <button type="submit" class="login-btn">LOGIN</button>
      <p id="loginError" class="error" style="display:none; margin-top:8px;"></p>
    </form>
    <div class="options">
      <a href="#">아이디 찾기</a> /
      <a href="#">비밀번호 찾기</a> /
      <a href="/signup">회원가입</a>
    </div>
  </div>
</div>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get('signup') === '1') {
    alert('회원가입이 완료되었습니다. 로그인 해 주세요.');
  }
</script>
</body>
</html>
