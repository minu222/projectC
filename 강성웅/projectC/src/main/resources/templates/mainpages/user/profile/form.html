<section th:fragment="form" xmlns:th="http://www.thymeleaf.org">
  <link rel="stylesheet" href="/mainpages/css/User-info.css"/>

  <main class="main-content">
    <div class="container">
      <div class="header">
        <h1>회원 정보 수정</h1>
        <p>프로필 정보를 업데이트하세요</p>
      </div>

      <div class="content">
        <!-- 프로필 영역 -->
        <div class="profile-section">
          <div class="profile-pic-wrapper">
            <div class="profile-pic" onclick="document.getElementById('profileInput').click()">
              <span class="plus-icon" id="plusIcon">+</span>
              <img id="profileImage" src="#" alt="프로필 이미지" style="display:none;">
            </div>
            <!-- 이미지 업로드 사용 시: enctype 필요(아래 form 참고) -->
            <input type="file" id="profileInput" name="profileImage" accept="image/*" onchange="previewImage(event)" style="display:none;">
          </div>
          <div class="profile-info">
            <h3 id="displayName" th:text="${user.name}"></h3>
            <p id="displayEmail" th:text="${user.email}"></p>
          </div>
        </div>

        <!-- 저장 폼 -->
        <!-- 이미지 업로드를 진짜로 받을 거면 enctype="multipart/form-data" 추가 -->
        <form class="form-grid" th:action="@{/profile/update}" method="post" id="profileForm" enctype="multipart/form-data">
          <!-- CSRF -->
          <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <!-- PK -->
          <input type="hidden" name="user_id" th:value="${user.user_id}"/>

          <!-- 아이디(닉네임) 읽기전용 -->
          <div class="input-group">
            <label for="nickname">아이디</label>
            <input type="text" id="nickname" class="input-field" name="nickname" th:value="${user.nickname}" readonly>
          </div>

          <div class="row">
            <!-- 비밀번호 변경은 별도 화면이 일반적; 여기선 비활성화 -->
            <div class="input-group">
              <label for="password">새 비밀번호</label>
              <input type="password" id="password" name="password" class="input-field" placeholder="새 비밀번호" readonly>
            </div>
            <div class="input-group">
              <label for="confirmPassword">비밀번호 확인</label>
              <input type="password" id="confirmPassword" class="input-field" placeholder="비밀번호 확인" readonly>
            </div>
          </div>

          <div class="input-group">
            <label for="name">이름</label>
            <input type="text" id="name" class="input-field" name="name" th:value="${user.name}" readonly>
          </div>

          <div class="input-group">
            <label for="phone">핸드폰 번호</label>
            <input type="text" id="phone" class="input-field" name="phone" th:value="${user.phone}" readonly>
          </div>

          <div class="input-group">
            <label for="address">주소</label>
            <input type="text" id="address" class="input-field" name="address" th:value="${user.address}" readonly>
          </div>

          <!-- detailAddress 컬럼이 실제 DB/엔티티에 없다면 name 제거 또는 주석 처리 -->
          <div class="input-group">
            <label for="detailAddress">상세주소</label>
            <input type="text" id="detailAddress" class="input-field" readonly>
          </div>

          <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" class="input-field" name="email" th:value="${user.email}" readonly>
          </div>

          <!-- 강사 전용 -->
          <div th:if="${user.role != null and #strings.equalsIgnoreCase(user.role.toString(),'INSTRUCTOR')}">
            <h3 style="margin-top:16px;">강사 정보</h3>
            <div class="input-group">
              <label for="affiliation">소속</label>
              <input type="text" id="affiliation" name="affiliation"
                     class="input-field"
                     th:value="${instructorProfile != null ? instructorProfile.affiliation : ''}"
                     readonly>
            </div>
            <div class="input-group">
              <label for="bio">자기소개</label>
              <textarea id="bio" name="bio" class="input-field" rows="5" readonly
                        th:text="${instructorProfile != null ? instructorProfile.bio : ''}"></textarea>
            </div>
          </div>

          <!-- 수신동의(엔티티에 없으면 name 제거 또는 서버에서 무시) -->
          <div class="checkbox-group" id="checkboxGroup">
            <h4>수신 동의 설정</h4>
            <div class="checkbox-item">
              <label>
                <input type="checkbox" id="emailAgree" name="emailAgree" disabled>
                <span class="checkmark"></span>
                이메일 수신 동의
              </label>
              <label style="margin-left:16px;">
                <input type="checkbox" id="messageAgree" name="noteAgree" disabled>
                <span class="checkmark"></span>
                쪽지 수신 동의
              </label>
            </div>
          </div>

          <div class="button-group" style="margin-top:16px;">
            <button type="button" class="btn btn-primary" id="editBtn">수정하기</button>
            <div>
              <button type="button" class="btn btn-primary" id="saveBtn" disabled>저장하기</button>
              <a href="/" class="btn btn-secondary">닫기</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script>
    // 한국 휴대폰 형식 보조 (선택)
    function formatKRPhone(s) {
      if (!s) return '';
      let d = String(s).replace(/[^\d-]/g, '');
      d = d.replace(/-+/g, '-').replace(/^-|-$/g, '');
      const only = d.replace(/-/g, '');
      if (only.startsWith('02')) {
        if (only.length <= 2) return only;
        if (only.length <= 5) return only.replace(/(\d{2})(\d+)/, '$1-$2');
        if (only.length <= 9) return only.replace(/(\d{2})(\d{3,4})(\d+)/, '$1-$2-$3');
        return only.slice(0,10).replace(/(\d{2})(\d{4})(\d{4})/, '$1-$2-$3');
      }
      if (only.length <= 3) return only;
      if (only.length <= 7)  return only.replace(/(\d{3})(\d+)/, '$1-$2');
      if (only.length <= 11) return only.replace(/(\d{3})(\d{3,4})(\d{1,4})/, '$1-$2-$3');
      return only.slice(0,11).replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
    }


    (function () {
      const $  = (sel, p = document) => p.querySelector(sel);
      const $$ = (sel, p = document) => Array.from(p.querySelectorAll(sel));

      const form      = $('#profileForm');
      const editBtn   = $('#editBtn');
      const saveBtn   = $('#saveBtn');
      const phone     = $('#phone');

      // 편집 대상들: 필요한 것만 추가/삭제하세요
      const editableSelectors = ['#nickname','#password','#confirmPassword',
        '#name','#phone','#address','#email','#affiliation','#bio'];

      const checkboxSelectors = ['#emailAgree', '#messageAgree'];

      let editing = false;

      function setEditable(on) {
        editing = on;

        // input/textarea readonly 토글
        editableSelectors.forEach(sel => {
          const el = $(sel);
          if (!el) return;
          if (el.tagName === 'TEXTAREA') {
            el.readOnly = !on;    // textarea는 readOnly 지원
          } else {
            el.readOnly = !on;    // input
          }
          // 시각적 강조용(선택): 읽기전용일 땐 회색 배경 유지
          el.classList.toggle('is-editing', on);
        });

        // 체크박스 disabled 토글
        checkboxSelectors.forEach(sel => {
          const el = $(sel);
          if (el) el.disabled = !on;
        });

        // 버튼 상태
        saveBtn.disabled = !on;
        editBtn.textContent = on ? '수정 취소' : '수정하기';
      }

      function validate() {
        const pw  = $('#password')?.value || '';
        const pw2 = $('#confirmPassword')?.value || '';
        if (pw || pw2) {
          if (pw.length < 8) { alert('비밀번호는 8자 이상 입력하세요.'); $('#password').focus(); return false; }
          if (pw !== pw2)   { alert('비밀번호가 일치하지 않습니다.'); $('#confirmPassword').focus(); return false; }
        }
        return true;
      }

      function sanitizePhoneKeepHyphen(s) {
        if (!s) return '';
        let t = String(s).replace(/[^\d-]/g, '');
        t = t.replace(/-+/g, '-').replace(/^-|-$/g, '');
        return t;
      }

      // 이벤트 바인딩
      editBtn?.addEventListener('click', () => {
        setEditable(!editing);
      });

      saveBtn?.addEventListener('click', () => {
        if (!editing) return;         // 편집 중이 아니면 무시
        if (!validate()) return;      // 클라이언트 검증

        // 전화번호 정리(숫자/하이픈만 유지)
        if (phone) phone.value = sanitizePhoneKeepHyphen(phone.value);

        // 최종 제출
        form.submit();
      });

      // 휴대폰 입력 시 포맷(편집 모드에서만)
      phone?.addEventListener('input', () => {
        if (!editing) return;
        const cur = phone.value;
        const formatted = formatKRPhone(cur);
        if (cur !== formatted) phone.value = formatted;
      });

      // 초기 상태: 읽기 전용
      setEditable(false);
    })();
  </script>
</section>
