spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://192.168.0.25:3306/project?useUnicode=true&characterEncoding=UTF-8
    username: project
    password: admin
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      validation-timeout: 5000
      # 오래된/죽은 연결 방지
      keepaliveTime: 30000
      idleTimeout: 300000
      maxLifetime: 600000
      connection-test-query: SELECT 1
spring.jpa:
  hibernate:
    ddl-auto: none

