<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
      <link rel="stylesheet" th:href="@{/css/common.css}">
      <link rel="stylesheet" th:href="@{/css/topbar.css}">
      <link rel="stylesheet" th:href="@{/css/sidebar.css}">
      <link rel="stylesheet" th:href="@{/css/instructor-info.css}">

  </head>
  <body>
  <div th:replace="fragments/topbar :: topbar"></div>
    <div class="container">
      <div th:replace="fragments/sidebar :: sidebar"></div>
      <!-- 메인 -->
      <main class="main">
        <div class="content-box">
          <h2>강사 정보</h2>

          <!-- 검색 필터 + 탈퇴 버튼 -->
          <div class="filter-box">
              <form th:action="@{/admin/instructors}" method="get">
                  <label>소속:
                      <select name="department">
                          <option>- 전체 -</option>
                          <option>DW</option>
                          <option>JS</option>
                      </select>
                  </label>
                  <label>검색:
                      <select name="type">
                          <option value="nickname">아이디</option>
                          <option value="name">이름</option>
                      </select>
                      <input name="keyword" placeholder="검색어 입력" type="text" />
                  </label>
                  <button type="submit">검색</button>

                  <div class="status-filter">
                      상태:
                      <label><input type="radio" name="status" value="all" checked /> 전체</label>
                      <label><input type="radio" name="status" value="active" /> 정상</label>
                      <label><input type="radio" name="status" value="suspended" /> 휴면</label>
                      <label><input type="radio" name="status" value="deleted" /> 탈퇴</label>
                  </div>
              </form>

              <form th:action="@{/admin/instructors/delete}" method="post">
                  <table>
                      <thead>
                      <tr>
                          <th><input type="checkbox" onclick="toggleAll(this)"/></th>
                          <th>No</th>
                          <th>아이디</th>
                          <th>이름</th>
                          <th>이메일</th>
                          <th>전화번호</th>
                          <th>가입일</th>
                          <th>상태</th>
                      </tr>
                      </thead>
                      <tbody>
                      <tr th:each="instructor, stat : ${instructors}">
                          <td><input type="checkbox" name="ids" th:value="${instructor.id}"/></td>
                          <td th:text="${stat.count}"></td>
                          <td th:text="${instructor.nickname}"></td>
                          <td th:text="${instructor.name}"></td>
                          <td th:text="${instructor.email}"></td>
                          <td th:text="${instructor.phone}"></td>
                          <td th:text="${#temporals.format(instructor.created_at, 'yyyy-MM-dd')}"></td>
                          <td>
                              <span class="badge badge-green" th:if="${instructor.status.name() == 'active'}">활성</span>
                              <span class="badge badge-yellow" th:if="${instructor.status.name() == 'suspended'}">정지</span>
                              <span class="badge badge-red" th:if="${instructor.status.name() == 'deleted'}">삭제</span>
                          </td>
                      </tr>
                      </tbody>
                  </table>

                  <button type="submit" class="btn-delete">🗑 선택 탈퇴</button>
              </form>
        </div>
      </main>
    </div>
  </body>
</html>
