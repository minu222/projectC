<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      rel="stylesheet"
    />
      <link rel="stylesheet" th:href="@{/css/common.css}">
      <link rel="stylesheet" th:href="@{/css/topbar.css}">
      <link rel="stylesheet" th:href="@{/css/sidebar.css}">
      <link rel="stylesheet" th:href="@{/css/instructor-info.css}">

  </head>
  <body>
  <div th:replace="fragments/topbar :: topbar"></div>
  <div th:replace="fragments/sidebar :: sidebar"></div>
    <div class="container">
      <!-- 메인 -->
      <main class="main">
        <div class="content-box">
          <h2>강사 정보</h2>

          <!-- 검색 필터 + 탈퇴 버튼 -->
          <div class="filter-box">
            <label
              >소속:
              <select>
                <option>- 전체 -</option>
                <option>DW</option>
                <option>JS</option>
              </select>
            </label>
            <label
              >검색:
              <select>
                <option>- 전체 -</option>
                <option>이름</option>
                <option>아이디</option>
              </select>
              <input placeholder="검색어 입력" type="text" />
            </label>
            <button>검색</button>

            <div class="status-filter">
              상태:
              <label><input checked name="status" type="radio" /> 전체</label>
              <label><input name="status" type="radio" /> 정상</label>
              <label><input name="status" type="radio" /> 휴면</label>
              <label><input name="status" type="radio" /> 탈퇴</label>
            </div>

            <div style="margin-left: auto">
              <button class="btn-delete">🗑 선택 탈퇴</button>
            </div>
          </div>

          <!-- 강사 리스트 (Thymeleaf 적용) -->
          <table>
            <thead>
              <tr>
                <th><input id="checkAll" type="checkbox" /></th>
                <th>No</th>
                <th>아이디</th>
                <th>이름</th>
                <th>이메일</th>
                <th>전화번호</th>
                <th>가입일</th>
                <th>상태</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="instructor, stat : ${instructor}">
                <td>
                  <input
                    class="row-check"
                    th:value="${instructor.id}"
                    type="checkbox"
                  />
                </td>
                <td th:text="${stat.count}"></td>
                <td>
                    <a th:href="@{'/admin/instructors/' + ${instructor.id}}"
                       th:text="${instructor.nickname}"></a>
                </td>
                <td th:text="${instructor.name}"></td>
                <td th:text="${instructor.email}"></td>
                <td th:text="${instructor.phone}"></td>
                <td th:text="${#temporals.format(instructor.created_at, 'yyyy-MM-dd')}"></td>
                <td>
                    <span class="badge badge-green" th:if="${instructor.status == 'active'}">활성</span>
                    <span class="badge badge-yellow" th:if="${instructor.status == 'suspended'}">정지</span>
                    <span class="badge badge-red" th:if="${instructor.status == 'deleted'}">삭제</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
