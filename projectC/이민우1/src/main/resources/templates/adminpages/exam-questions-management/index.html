<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy - 시험 문제 관리</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/adminpages/css/common.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/exam-questions-management.css}">
</head>
<body>
<div th:replace="adminpages/fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="adminpages/fragments/sidebar :: sidebar"></div>
    <main class="main">
        <div class="content-box">
            <h2>시험 문제 관리</h2>

            <!-- 검색/문항 추가 -->
            <div class="search-box exam-search">
                <form th:action="@{/admin/mock-exams}" method="get" style="display:inline;">
                    <input type="text" name="instructorId" placeholder="강사ID" th:value="${param.instructorId}" />
                    <button class="btn-search" type="submit">검색</button>
                </form>
                <a th:href="@{/admin/mock-exams/new}" class="btn-submit">문항 추가</a>
            </div>

            <!-- 시험 문제 목록 -->
            <table class="data-table exam-table">
                <thead>
                <tr>
                    <th>NO</th>
                    <th>제목</th>
                    <th>강사ID</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="exam, i : ${exams}">
                    <td th:text="${i.index + 1}">1</td>
                    <td th:text="${exam.title}">1</td>
                    <td th:text="${exam.instructorId}"></td>
                    <td>
                        <a th:href="@{/admin/mock-exams/{id}/edit(id=${exam.examId})}">수정</a> |
                        <form th:action="@{/admin/mock-exams/{id}/delete(id=${exam.examId})}" method="post" style="display:inline;">
                            <button type="submit" onclick="return confirm('삭제하시겠습니까?')">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(exams)}">
                    <td colspan="5">등록된 시험 문제가 없습니다.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
