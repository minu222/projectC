<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/adminpages/css/style.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/menu.css}">
</head>

<body>
<div th:replace="adminpages/fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="adminpages/fragments/sidebar :: sidebar"></div>
    <main class="main">
        <div class="content-box">
            <h2 th:text="${mockExam.examId == null} ? '시험 문제 등록' : '시험 문제 수정'">시험 문제 등록/수정</h2>

            <form th:action="@{/admin/mock-exams/save}" method="post">
                <input type="hidden" name="examId" th:value="${mockExam.examId}" />

                <div class="form-group">
                    <label>제목</label>
                    <textarea name="title" th:text="${mockExam.title}" required></textarea>
                </div>

                <div class="form-group">
                    <label>내용</label>
                    <textarea name="question" th:text="${mockExam.question}" required></textarea>
                </div>

                <div class="form-group">
                    <label>정답</label>
                    <input type="text" name="answer" th:value="${mockExam.answer}" required/>
                </div>

                <div class="form-group">
                    <label>점수</label>
                    <input type="number" name="score" th:value="${mockExam.score}" required/>
                </div>

                <div class="form-group">
                    <label>강사</label>
                    <select name="instructorId" required>
                        <option value="">강사를 선택하세요</option>
                        <option th:each="inst : ${instructors}"
                                th:value="${inst.user_id}"
                                th:text="${inst.nickname}"
                                th:selected="${inst.user_id == mockExam.instructorId}">
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn-submit" th:text="${mockExam.examId == null} ? '등록' : '수정'"></button>
            </form>


        </div>
    </main>
</div>
</body>
</html>
