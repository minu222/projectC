<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>출석 관리</title>
    <link rel="stylesheet" href="/style.css" />

  </head>
  <body>
    <div class="container">
      <main class="main">
        <div class="content-box">
          <h2>출석 관리</h2>

          <div class="search-box attendance-search">
            <input type="text" placeholder="과정명" />
            <input type="date" />
            <button class="btn-primary">조회</button>
          </div>

          <table class="data-table table-gap-top" aria-label="출석 테이블">
            <colgroup>
              <col style="width: 72px" />
              <!-- NO -->
              <col />
              <!-- 학생 (가변) -->
              <col style="width: 200px" />
              <!-- 상태 -->
              <col style="width: 300px" />
              <!-- 비고 -->
            </colgroup>
            <thead>
              <tr>
                <th>NO</th>
                <th>학생</th>
                <th>상태</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>
                  <select>
                    <option>출석</option>
                    <option>지각</option>
                    <option>결석</option>
                  </select>
                </td>
                <td><input type="text" placeholder="사유" /></td>
              </tr>
              <!-- 필요 시 항목 반복 -->
            </tbody>
          </table>

          <div class="actions-row attendance-actions">
            <button class="btn-secondary">임시저장</button>
            <button class="btn-primary">출석 저장</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
