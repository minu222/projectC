<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DW Academy - 강사 정보</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/adminpages/css/common.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/payment-management.css}">
</head>
<body>
<div th:replace="adminpages/fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="adminpages/fragments/sidebar :: sidebar"></div>

    <main class="main">
        <div class="content-box">
            <h2>결제 관리</h2>

            <div class="search-box payments-search">
                <input type="text" placeholder="주문번호/이메일" />
                <select>
                    <option>전체</option>
                    <option>승인</option>
                    <option>취소</option>
                </select>
                <button class="btn-search">검색</button>
            </div>

            <table class="data-table payments-table">
                <thead>
                <tr>
                    <th>결제번호</th>
                    <th>주문번호</th>
                    <th>금액</th>
                    <th>방법</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>P-1001</td>
                    <td>O-20250910-001</td>
                    <td>₩350,000</td>
                    <td>카드</td>
                    <td><span class="badge normal">승인</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
