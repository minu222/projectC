<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/adminpages/css/style.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/menu.css}">
</head>

<body>
<div th:replace="adminpages/menu :: menu"></div>
    <main class="main">
    <div class="content-box">
    <h2 th:text="${post.title}">제목</h2>
    <p>작성자: <span th:text="${post.authorName}"></span></p>
    <p>카테고리: <span th:text="${post.category}"></span></p>
    <p>조회수: <span th:text="${post.views}"></span></p>
    <p>좋아요: <span th:text="${post.likes}"></span></p>
    <p>댓글수: <span th:text="${post.commentsCount}"></span></p>
    <hr/>
    <div th:text="${post.content}">내용</div>
    <a th:href="@{/admin/posts-manage}">목록으로 돌아가기</a>
    </div>
</main>
</div>
</body>
</html>
