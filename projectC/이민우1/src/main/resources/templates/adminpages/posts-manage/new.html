<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy - 게시글 상세</title>
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
            rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/adminpages/css/style.css}" />
    <link rel="stylesheet" th:href="@{/adminpages/css/menu.css}" />
</head>
<body>
<div th:replace="adminpages/menu :: menu"></div>

<main class="main">
    <div class="content-box card">
        <!-- 카드 래퍼 -->
        <header class="card-header detail-head">
            <h2 class="detail-title" th:text="${post.title}">제목</h2>

            <!-- 오른쪽 액션 버튼 (수정/삭제 등 필요하면 추가) -->
            <div class="actions">
                <a
                        th:href="@{/admin/posts-manage/edit/{id}(id=${post.id})}"
                        class="btn-line"
                        role="button"
                >
                    <i class="fa-solid fa-pen" aria-hidden="true"></i> 수정
                </a>
                <a
                        th:href="@{/admin/posts-manage/delete/{id}(id=${post.id})}"
                        class="btn-line"
                        role="button"
                >
                    <i class="fa-solid fa-trash" aria-hidden="true"></i> 삭제
                </a>
            </div>
        </header>

        <section class="card-body detail-body">
            <div
                    class="form-grid"
                    style="
              grid-template-columns: 1fr 1fr;
              gap: 12px;
              margin-bottom: 12px;
            "
            >
                <div class="muted">
                    <strong>작성자</strong>
                    <div class="helper-note" th:text="${post.authorName}">
                        작성자명
                    </div>
                </div>
                <div class="muted">
                    <strong>카테고리</strong>
                    <div class="helper-note" th:text="${post.category}">카테고리</div>
                </div>

                <div class="muted">
                    <strong>조회수</strong>
                    <div class="helper-note" th:text="${post.views}">0</div>
                </div>
                <div class="muted">
                    <strong>좋아요 / 댓글</strong>
                    <div class="helper-note">
                        <span th:text="${post.likes}">0</span> 좋아요 ·
                        <span th:text="${post.commentsCount}">0</span> 댓글
                    </div>
                </div>
            </div>

            <hr
                    style="
              border: none;
              border-top: 1px dashed rgba(84, 129, 255, 0.18);
              margin: 10px 0 18px;
            "
            />

            <!-- 본문 영역: HTML을 그대로 렌더링하려면 th:utext 사용 가능 -->
            <div
                    class="form-textarea"
                    style="background: transparent; border: none; padding: 0"
            >
                <div th:utext="${post.content}">내용</div>
            </div>
        </section>

        <footer class="detail-footer">
            <a th:href="@{/admin/posts-manage}" class="btn-line">
                <i class="fa-solid fa-list" aria-hidden="true"></i> 목록으로
                돌아가기
            </a>
            <a th:href="@{/admin/posts-manage/new}" class="btn">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> 새 글 작성
            </a>
        </footer>
    </div>
</main>
</body>
</html>
