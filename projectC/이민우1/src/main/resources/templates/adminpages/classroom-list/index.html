<!-- ===============================
DW Academy - 강의실 목록 (No JS)
- 스크립트 없이 시각/가독성만 개선
- :has()로 체크된 행 하이라이트 (지원 브라우저에서)
- 모바일 카드형 테이블 전환
=============================== -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy - 강의실 목록</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/adminpages/css/common.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/classroom-list.css}">
</head>
<body>
<div th:replace="adminpages/fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="adminpages/fragments/sidebar :: sidebar"></div>

    <main class="main">
        <div class="content-box">

            <!-- 헤더 -->
            <div class="header">
                <h2>강의실 목록</h2>
            </div>

            <!-- 검색/액션 -->
            <form class="search-area" method="get" th:action="@{/admin/classrooms-list}" th:object="${filter}">
                <div class="search-left">

                    <!-- 카테고리 -->
                    <label for="category">카테고리:</label>
                    <select th:field="*{category}" id="category" name="category">
                        <option value="">전체</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>

                    <!-- 상태 -->
                    <label for="status">상태:</label>
                    <select th:field="*{status}" id="status">
                        <option value="">전체</option>
                        <option value="draft" th:selected="${filter.status=='draft'}">미승인</option>
                        <option value="published" th:selected="${filter.status=='published'}">승인</option>
                        <option value="closed" th:selected="${filter.status=='closed'}">폐쇄</option>
                    </select>

                    <!-- 키워드 검색 -->
                    <label>강의실명:</label>
                    <input type="text" id="keyword" name="keyword" placeholder="검색어 입력" th:value="${filter.keyword}" />
                    <button type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i> 검색
                    </button>

                </div>
            </form>

            <form th:action="@{/admin/classrooms/delete-selected}" method="post" id="deleteForm">

                <div class="search-actions">
                    <button type="submit" class="btn-delete">
                        <i class="fa-solid fa-trash"></i> 선택 삭제
                    </button>
                </div>


            <!-- 목록 테이블 -->
            <div class="table-wrap">
                <div class="table-scroller">
                    <table aria-label="강의실 목록">
                        <colgroup>
                            <col class="chk"/>
                            <col/>
                            <col/>
                            <col/>
                            <col/>
                            <col/>
                            <col/>
                            <col/>
                        </colgroup>
                        <thead>
                        <tr>
                            <th><input id="checkAllRooms" type="checkbox" aria-label="전체 선택"/></th>
                            <th>번호</th>
                            <th>강의실명</th>
                            <th>카테고리</th>
                            <th class="num">학생 수</th>
                            <th>상태</th>
                            <th>강사 ID</th>

                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="room, i : ${courses}">
                            <td data-label="선택">
                                <input class="row-check room" type="checkbox" name="ids" th:value="${room.classroomId}"/>
                            </td>
                            <td class="center" data-label="번호" th:text="${i.index + 1}">1</td>
                            <td data-label="강의실명" th:text="${room.title}">강좌명</td>
                            <td data-label="카테고리" th:text="${room.category}">카테고리</td>
                            <td class="num" data-label="학생 수" th:text="${room.studentCount}">0</td>
                            <td data-label="상태">
                                <form th:action="@{/admin/classrooms/update-status}" method="post" style="display:inline;">
                                    <input type="hidden" name="classroomId" th:value="${room.classroomId}" />
                                    <select name="status" th:class="'status ' + ${room.status}">
                                        <option value="draft" th:selected="${room.status == 'draft'}">미승인</option>
                                        <option value="published" th:selected="${room.status == 'published'}">승인</option>
                                        <option value="closed" th:selected="${room.status == 'closed'}">폐쇄</option>
                                    </select>

                                    <button type="submit">저장</button>
                                </form>
                            </td>

                            <td data-label="강사 ID" th:text="${room.instructorId}">0</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

</body>
</html>
