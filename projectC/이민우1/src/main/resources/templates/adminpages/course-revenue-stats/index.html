<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DW Academy - 강사 정보</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/adminpages/css/common.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/course-revenue-stats.css}">
</head>
<body>
<div th:replace="adminpages/fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="adminpages/fragments/sidebar :: sidebar"></div>

    <main class="main">
        <div class="content-box">
            <h2>과정 매출 통계</h2>

            <div class="search-box sales-course-search">
                <input type="text" placeholder="과정명" />
                <button class="btn-search">조회</button>
            </div>

            <div class="chart-container sales-course-chart">
                <canvas id="courseChart"></canvas>
            </div>
        </div>
    </main>
</div>
</body>
</html>
