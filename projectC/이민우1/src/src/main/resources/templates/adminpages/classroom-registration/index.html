<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy - 강의실 등록</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/adminpages/css/common.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/adminpages/css/classroom-registration.css}">
</head>
<body>
<div th:replace="adminpages/fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="adminpages/fragments/sidebar :: sidebar"></div>
    <main class="main">
        <div class="content-box">
            <h2>강의실 등록</h2>

            <!-- 성공 메시지 -->
            <div th:if="${message}" class="alert-success" th:text="${message}"></div>
            <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

            <!-- form: POST & bound to ${classroom} -->
            <form th:action="@{/admin/classrooms-registration}" th:object="${classroom}" method="post" class="classroom-form">

                <div>
                    <label>
                        강의실명
                        <input type="text" th:field="*{title}" placeholder="예: A-101" class="form-input" />
                    </label>
                    <label>
                        강의자
                        <select th:field="*{instructorId}" class="form-input">
                            <option th:each="instructor : ${instructors}"
                                    th:value="${instructor['instructor_id']}"
                                    th:text="${instructor['instructor_id']}">
                            </option>
                        </select>
                    </label>
                </div>
                    <label class="full-row">
                        비고
                        <textarea rows="6" th:field="*{description}" placeholder="프로젝터, 화이트보드 등" class="form-textarea"></textarea>
                    </label>
                    <label>
                        무료 여부
                        <input type="checkbox" th:field="*{isFree}" /> 무료
                    </label>
                    <label>
                        카테고리
                        <select th:field="*{category}" class="form-input">
                            <option value="" disabled selected>카테고리 선택</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                        </select>
                    </label>

                    <label>
                        수용 인원
                        <input type="number" th:field="*{studentCount}" placeholder="예: 30" class="form-input" />
                    </label>
                <div class="form-actions">
                    <button type="submit" class="btn-submit">등록</button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
