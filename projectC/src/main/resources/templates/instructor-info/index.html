<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>DW Academy - 강사 정보</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/topbar.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/user-info.css}">
</head>
<body>
<div th:replace="fragments/topbar :: topbar"></div>
<div class="container">
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- 메인 -->
    <main class="main">
        <div class="content-box">
            <h2>강사 정보</h2>

            <!-- 검색 필터 + 탈퇴 버튼 -->
            <form th:action="@{/admin/instructors}" method="get">
                <div class="filter-box">
                    <label>
                        소속:
                        <select name="department">
                            <option value="">- 전체 -</option>
                            <option value="DW">DW</option>
                            <option value="JS">JS</option>
                        </select>
                    </label>
                    <label>
                        검색:
                        <select name="keywordType">
                            <option value="">- 전체 -</option>
                            <option value="name">이름</option>
                            <option value="nickname">아이디</option>
                        </select>
                        <input name="keyword" placeholder="검색어 입력" type="text" />
                    </label>
                    <button type="submit">검색</button>

                    <div class="status-filter">
                        상태:
                        <label><input type="radio" name="status" value="" checked> 전체</label>
                        <label><input type="radio" name="status" value="ACTIVE"> 정상</label>
                        <label><input type="radio" name="status" value="SUSPENDED"> 휴면</label>
                        <label><input type="radio" name="status" value="DELETED"> 탈퇴</label>
                    </div>

                    <div style="margin-left: auto">
                        <button class="btn-delete" type="button">🗑 선택 탈퇴</button>
                    </div>
                </div>
            </form>

            <!-- 강사 리스트 -->
            <table>
                <thead>
                <tr>
                    <th><input id="checkAll" type="checkbox" /></th>
                    <th>No</th>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>전화번호</th>
                    <th>가입일</th>
                    <th>상태</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="instructor, iterStat : ${instructors}">
                    <td><input class="row-check" th:value="${instructor.user_id}" type="checkbox" /></td>
                    <td th:text="${iterStat.index + 1}"></td>
                    <td>
                        <a th:href="@{'/admin/member-details/' + ${instructor.user_id}}"
                           th:text="${instructor.nickname}"></a>
                    </td>
                    <td th:text="${instructor.name}"></td>
                    <td th:text="${instructor.email}"></td>
                    <td th:text="${instructor.phone}"></td>
                    <td th:text="${instructor.created_at != null} ? ${#temporals.format(instructor.created_at, 'yyyy-MM-dd')} : ''"></td>
                    <td>
                        <span class="badge badge-green"
                              th:if="${instructor.status != null and instructor.status.name() == 'ACTIVE'}">정상</span>
                        <span class="badge badge-gray"
                              th:if="${instructor.status != null and instructor.status.name() == 'SUSPENDED'}">휴면</span>
                        <span class="badge badge-red"
                              th:if="${instructor.status != null and instructor.status.name() == 'DELETED'}">탈퇴</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
